ьный спор казался мне лучше того молчания, к которому я успел привыкнуть.","","Мы купили еды.","Поехали домой.","И начали готовить.","Всё было настолько просто, что в другой ситуации я, возможно, даже не запомнил бы этот вечер.","Обычная квартира.","Обычная еда.","Музыка.","Разговоры.","Два человека, которые когда-то были вместе, а теперь пытались понять, кем приходятся друг другу.","Но для меня этот вечер оказался особенным.","Потому что Таисия снова находилась рядом.","В той самой квартире, которую я так хотел ей показать.","Теперь здесь было уже не так пусто, как раньше.","Я постепенно сделал то, что когда-то собирался сделать.","И мне хотелось, чтобы она увидела, насколько многое изменилось.","Но ещё сильнее хотелось другого.","Чтобы она осталась.","Хотя бы на этот вечер.","Чтобы нам не нужно было снова прощаться.","","Мы слушали музыку.","Танцевали.","И в какой-то момент мне показалось, что я снова оказался в тех временах, когда между нами ещё не было столько боли.","Когда мы могли просто находиться рядом.","Когда обычный вечер не нужно было воспринимать как редкую возможность увидеть друг друга.","Я смотрел на Таисию и чувствовал, как все попытки забыть её окончательно теряют смысл.","Я ведь действительно старался.","Пытался убедить себя, что нужно отпустить.","Пробовал воспринимать её как друга.","Пытался не показывать чувства.","Но достаточно было снова увидеть её рядом, услышать голос, прикоснуться во время танца — и всё возвращалось.","Только сильнее.","","Самым сложным была близость.","Таисия находилась совсем рядом.","Настолько близко, что я мог её обнять.","Мог протянуть руку.","Мог почувствовать тепло человека, по которому так долго скучал.","И иногда я действительно обнимал её.","Но каждое прикосновение сопровождалось внутренней неловкостью.","Потому что мы больше не были парой.","Я не знал, где теперь проходят границы.","Что для неё означает наше общение.","Можно ли позволить себе чуть больше нежности.","Или это только сделает всё сложнее.","Мне хотелось поцеловать её.","Очень.","Но я боялся.","Боялся неправильно понять происходящее.","Боялся разрушить даже ту дружбу, которую нам удалось сохранить.","Боялся, что для неё это просто приятный вечер, а я снова начну видеть в нём надежду на возвращение.","Поэтому сдерживался.","Хотя внутри всё буквально тянулось к ней.","","Я часто думаю о том, как странно устроена любовь.","Когда-то мы жили вместе, а я боялся показать свои чувства.","Теперь же мне хотелось обнимать Таисию каждую минуту, но я боялся сделать это, потому что мы больше не были вместе.","Словно жизнь решила поменять нас местами.","Раньше у меня была возможность любить её открыто, но я не умел.","Теперь я научился.","Но возможность исчезла.","И это было невероятно обидно.","","Вечер прошёл хорошо.","Мы провели время вместе.","Готовили.","Слушали песни.","Танцевали.","Разговаривали.","И на какое-то время я снова почувствовал то самое тепло, которого мне так не хватало.","Но потом Таисия уехала.","Снова.","А я остался в квартире, где ещё недавно звучала музыка.","Где мы танцевали.","Где я мог обнимать её.","И вдруг всё стало тихо.","Я смотрел на привычные стены и понимал, что теперь люблю её ещё сильнее.","Хотя казалось, что сильнее уже невозможно.","","В тот период у меня появилось сравнение, которое почему-то очень точно передавало происходящее.","Таисия была ветром.","А я — фантиком.","Лёгким, беспомощным, подхваченным этим ветром.","Я летел за ней, куда бы она ни направлялась.","Иногда оказывался совсем рядом.","Иногда меня относило далеко.","Иногда казалось, что я наконец догнал её.","А потом ветер снова менял направление.","И я продолжал лететь следом.","С одной-единственной мечтой.","Хотя бы ещё раз поцеловать её.","","После той встречи я уже не мог убедить себя, что всё закончилось.","Нет, разум прекрасно понимал происходящее.","Мы не были вместе.","Она не обещала вернуться.","Я не имел права воспринимать обычную встречу как начало новых отношений.","Но сердце снова надеялось.","И эта надежда оказалась сильнее всех моих попыток её подавить.","Я не знал, что будет дальше.","Не знал, захочет ли Таисия снова приехать.","Не знал, увижу ли её в ближайшее время.","Но продолжал ждать.","А потом произошло то, чего я совершенно не ожидал.","Она снова собралась в Краснодар.","И на этот раз всё изменилось.","","Перед её приездом я сделал раковину.","Ту самую, которую она хотела.","Казалось бы, обычная бытовая вещь.","Но для меня она имела особенное значение.","Я помнил её желание.","Помнил, какой она хотела видеть квартиру.","И продолжал постепенно делать то, о чём мы когда-то говорили.","Наверное, мне хотелось показать, что даже после всего произошедшего я не перестал заботиться о том, что было важно для нас.","Что наши мечты не превратились для меня в пустые слова.","Что я всё ещё помню.","","Таисия приехала.","Я снова был счастлив её видеть.","Но теперь старался не строить слишком больших ожиданий.","Мы ведь уже проходили через это.","Я знал, как больно бывает поверить в возвращение, которого на самом деле нет.","Поэтому просто радовался тому, что она рядом.","А потом она меня поцеловала.","","Я не знаю, как правильно описать этот момент.","Наверное, потому что никакие красивые слова не способны передать то, что я почувствовал.","Это был взрыв.","Неожиданный.","Огромный.","Совершенно невозможный.","Ещё недавно я боялся даже прикоснуться к ней, чтобы не нарушить границы нашей дружбы.","Ещё недавно пытался убедить себя, что должен научиться жить без её любви.","Ещё недавно писал письма и песни, прекрасно понимая, что всё это может ни к чему не привести.","А теперь она сама меня поцеловала.","Таисия.","Моя Таисия.","Девушка, которую я так долго пытался вернуть.","Я был ошарашен.","Счастлив.","Растерян.","Не понимал, что произошло.","Не знал, почему она снова приблизилась ко мне.","Не знал, что именно изменилось в её чувствах.","Но в тот момент мне не хотелось искать объяснения.","Мне хотелось просто поверить.","Поверить, что она снова выбрала меня.","","Я мысленно благодарил всех богов, каких только мог вспомнить.","Наверное, это звучит смешно.","Но я действительно был настолько счастлив.","Мне казалось невероятным, что после всех наших ошибок, после расстояния, после другого парня, после расставания и моих бесконечных попыток забыть её мы снова оказались рядом.","И теперь между нами снова был поцелуй.","Не дружеское объятие.","Не случайное прикосновение.","А то, о чём я мечтал всё это время.","Я не знал, каким чудом всё произошло.","Но был благодарен.","За неё.","За этот момент.","За возможность ещё раз попробовать.","","Наверное, тогда я впервые подумал, что наша история действительно отличается от других.","Мы уже расставались.","Уже причиняли друг другу боль.","Уже пытались жить отдельно.","Но каким-то образом снова находили дорогу друг к другу.","Словно между нами существовало что-то, что невозможно было окончательно разорвать.","Я не мог объяснить это.","Не знал, любовь ли это, привычка, привязанность или невероятное совпадение обстоятельств.","Но тогда мне хотелось верить в самое красивое объяснение.","Что мы действительно нужны друг другу.","Что все наши расставания — лишь трудные главы одной большой истории.","И что однажды мы всё-таки научимся быть счастливыми вместе.","","Я снова получил шанс.","По крайней мере, именно так я воспринимал происходящее.","И на этот раз хотел использовать его иначе.","Больше не быть тем холодным парнем из первой квартиры.","Не прятаться за равнодушием.","Не заставлять Таисию угадывать мои чувства.","Я хотел любить её открыто.","Делать комплименты.","Дарить цветы.","Устраивать маленькие сюрпризы.","Заботиться.","Быть рядом настолько часто, насколько позволяли обстоятельства.","Мне хотелось, чтобы она видела не только мои старания, но и то, насколько сильно я её люблю.","И вскоре у меня появилась возможность сделать для неё ещё одну маленькую, но очень важную вещь.","Всё началось с обычного спора.","Спора о том, приедет она или нет.","На кону стояли духи.","И я ещё не знал, что эта история станет одним из тех воспоминаний, к которым буду возвращаться с особенной нежностью.","","Глава 10. Счастье с ароматом духов","Иногда любовь проявляется в совершенно неожиданных вещах.","Не в громких признаниях.","Не в дорогих путешествиях.","Не в красивых обещаниях.","А в желании исправить маленькую неприятность, из-за которой любимый человек расстроился.","Порой тебе совершенно не важно, сколько это будет стоить.","Сколько времени займёт.","Насколько разумным окажется поступок.","Ты просто хочешь увидеть улыбку.","И всё.","","Мы с Таисией поспорили.","Уже не помню, насколько серьёзным был сам спор.","Да это и не важно.","Суть заключалась в том, приедет она или нет.","Я согласился, что если проиграю, куплю ей духи.","Она приехала.","И, конечно, я проиграл.","Хотя какое же это было поражение?","Я снова увидел её.","Снова получил возможность провести время рядом.","Снова мог обнять.","И теперь у меня появился ещё один повод сделать ей приятное.","Мы отправились выбирать духи.","Те, которые она хотела.","Мне нравилось наблюдать, как Таисия выбирает что-то для себя.","Нравилось видеть её заинтересованность.","Нравилось осознавать, что могу исполнить хотя бы одно небольшое желание.","Мы купили духи.","И я был доволен.","Не покупкой самой по себе.","А тем, что смог её порадовать.","","Но дома всё пошло не так.","Оказалось, что духи не те.","Не тот аромат, который она хотела.","Таисия расстроилась.","И заплакала.","Наверное, кто-то другой мог бы не придать этому значения.","Сказать, что ничего страшного не случилось.","Что это всего лишь духи.","Что можно пользоваться этими.","Но я видел её слёзы.","И мне было совершенно не важно, насколько серьёзной выглядит причина со стороны.","Она расстроилась.","А мне хотелось, чтобы она улыбалась.","Я сразу начал успокаивать её.","Говорил, что попробую сделать возврат.","Что поменяем.","Что всё решим.","Я действительно верил, что смогу исправить ситуацию.","В конце концов, это ведь просто покупка.","Разве может быть настолько сложно обменять один флакон духов на другой?","Как оказалось, может.","","На следующий день после работы я поехал в магазин.","Хотел вернуть духи.","Или обменять их.","Объяснить ситуацию.","Сделать так, чтобы Таисия получила именно то, что хотела.","Но мне отказали.","Возврат не получился.","И в тот момент передо мной появился выбор.","Можно было просто принять отказ.","Вернуться домой.","Объяснить, что ничего сделать не удалось.","Тем более Таисия сама говорила, что не нужно покупать новые духи.","Что не стоит тратить деньги.","И, наверное, именно так поступил бы человек, который привык принимать решения исключительно разумно.","Но я тогда думал совершенно о другом.","Я помнил её слёзы.","Помнил, как сильно она расстроилась.","И представлял, как обрадуется, если всё-таки получит тот самый аромат.","Мне хотелось сделать это для неё.","Не потому, что она требовала.","Не потому, что я был обязан.","А потому, что любил.","","Я купил новые духи.","Те самые.","Которые она действительно хотела.","Несмотря на то что обменять предыдущие не удалось.","Несмотря на дополнительные расходы.","Несмотря на то что Таисия просила не покупать ничего нового.","А потом сказал ей, что духи всё-таки поменяли.","Я не стал рассказывать, что купил второй флакон.","Не хотел, чтобы она переживала из-за денег.","Не хотел, чтобы чувствовала себя виноватой.","Мне просто хотелось увидеть её счастливой.","И когда она получила нужные духи, я почувствовал невероятное удовлетворение.","Не от того, что смог потратить деньги.","Не от того, что совершил какой-то особенный поступок.","А от того, что исправил ситуацию, которая её расстроила.","","Я понимал, что это не самая разумная трата.","У меня и без того хватало финансовых забот.","Впереди были долги, работа, необходимость зарабатывать на поездки и совместную жизнь.","Но в тот момент я почти не думал об этом.","Наверное, иногда мне слишком сильно хотелось доказать самому себе, что я способен делать любимую девушку счастливой.","Что могу быть нужным.","Что от ательно сможем оставить прошлые ошибки позади.","И какое-то время я действительно чувствовал, что мы движемся в правильном направлении.","","А потом в нашей жизни появилось маленькое существо, которое изменило всё.","Сначала я даже не представлял, насколько сильно к нему привяжусь.","Насколько счастливым буду чувствовать себя, возвращаясь домой.","Насколько быстро обычная квартира превратится для меня в маленький семейный мир.","У нас появилась собака.","Мия.","И вместе с ней пришло совершенно новое чувство.","Ощущение, что у нас с Таисией теперь есть нечто большее, чем просто отношения.","У нас появилась маленькая семья.","","Глава 11. Наша маленькая семья","В детстве я мечтал о собаке.","Наверное, у многих есть такая мечта.","Ты представляешь, как однажды у тебя появится маленький друг, который будет встречать тебя дома, бегать по квартире, играть, радоваться твоему возвращению.","Но годы идут.","Жизнь меняется.","Появляются другие заботы.","И детские желания постепенно откладываются куда-то далеко.","Ты перестаёшь думать о них каждый день.","Но они никуда не исчезают.","И однажды жизнь неожиданно возвращает тебе то, о чём ты когда-то мечтал.","У меня это произошло благодаря Мие.","","Я помню, как мы ехали за ней.","В тот момент я ещё не знал, насколько важной станет для меня эта маленькая собака.","Мы с Таисией отправились её забирать.","И уже тогда всё происходящее казалось невероятно милым.","Маленькое существо, которое совсем скоро станет частью нашей жизни.","Нашей квартиры.","Наших повседневных забот.","Мы искали полотенце, чтобы ей было тепло.","Переживали за неё.","Старались сделать всё, чтобы маленькая Мия чувствовала себя хорошо.","Наверное, со стороны это была обычная поездка за собакой.","Но для меня она стала одним из самых светлых воспоминаний о наших отношениях.","Потому что мы делали это вместе.","Мы ехали за существом, о котором теперь предстояло заботиться.","И мне очень нравилась сама мысль, что у нас появляется кто-то общий.","Кто-то, кого мы будем любить.","","Когда Мия появилась дома, я влюбился в неё практически сразу.","Она была маленьким чудом.","И я совершенно не умел на неё сердиться.","Даже когда нужно было поругать.","Даже когда она что-нибудь вытворяла.","Мне было достаточно посмотреть на неё, чтобы вся строгость куда-то исчезала.","Я ведь так долго мечтал о собаке.","А теперь она была у меня.","Наша Мия.","Маленькая.","Живая.","Настоящая.","И вместе с ней моя жизнь словно стала немного теплее.","","Больше месяца я жил с Мией.","Мы проводили время дома.","Играли.","Бегали по квартире.","Я включал Xbox.","Слушал музыку.","А она была рядом.","Иногда мне казалось, что именно в такие моменты я впервые почувствовал настоящее домашнее счастье.","Не то, которое связано с дорогими покупками.","Не то, которое появляется после удачного рабочего дня.","А самое простое.","Когда у тебя есть дом.","Есть собака.","Есть любимая девушка.","И ты вдруг понимаешь, что именно об этом когда-то мечтал.","","Я часто смотрел на Мию и думал о Таисии.","О том, как неожиданно всё сложилось.","Ещё недавно я был парнем, который не умел показывать чувства и боялся поверить в отношения.","Потом мы пережили расстояние.","Расставание.","Другого человека.","Мои письма.","Песни.","Бесконечные попытки вернуть любовь.","А теперь у нас появилась собака.","Разве мог я представить такое в самом начале?","Когда впервые ехал к Таисии через половину Краснодара, мне даже в голову не приходило, что однажды буду считать её и маленькую Мию своей семьёй.","Но именно так я себя и чувствовал.","У меня была семья.","Пусть ещё не официальная.","Пусть мы не были женаты.","Пусть наша жизнь оставалась далёкой от идеальной.","Но я любил их обеих.","Таисию.","И Мию.","И мне казалось, что этого достаточно, чтобы продолжать бороться со всеми трудностями.","","Особенно дорогими оставались воспоминания о том, как мы забирали Мию.","Как переживали, чтобы ей было тепло.","Как искали полотенце.","Как радовались её появлению.","Наверное, любовь действительно живёт в мелочах.","Иногда ты запоминаешь не какие-то огромные события, а самые обычные моменты.","Поездку.","Заботу о маленькой собаке.","Радость любимого человека.","И спустя время именно эти воспоминания оказываются самыми болезненными.","Потому что в них всё было хорошо.","И потому что тогда ты ещё не знал, как сильно всё изменится.","","Конечно, основная забота о Мие постепенно легла на Таисию.","Я понимал это.","Она вкладывала в собаку больше сил.","Больше времени.","Больше заботы.","И позже, когда наши отношения снова начнут разрушаться, мне будет особенно грустно осознавать, что я уже не являюсь такой же частью их повседневной жизни.","Но моя любовь к Мие от этого не исчезнет.","Я всё равно буду считать её маленьким чудом.","Собакой, о которой мечтал с детства.","И частью той семьи, которую мы однажды пытались построить.","","Пока же я был счастлив.","Мы продолжали жить.","Слушали музыку.","Играли.","Проводили время вместе.","И я всё чаще ловил себя на мысли, что хочу сохранить эту жизнь.","Не только отношения.","Не только встречи.","А именно нашу маленькую семью.","Мне хотелось, чтобы когда-нибудь всё это стало постоянным.","Чтобы не нужно было снова провожать Таисию.","Чтобы Мия всегда была рядом.","Чтобы мы могли вместе решать бытовые проблемы, покупать что-нибудь для дома, планировать будущее.","Мне хотелось обычной жизни.","Той самой, которую раньше я даже не умел ценить.","","Но работа снова начала забирать Таисию.","Она брала подработки.","Всё больше времени проводила в делах.","Её жизнь постепенно становилась всё более загруженной.","А потом она забрала Мию к себе.","И в квартире снова стало тише.","Слишком тихо.","Я понимал, что Таисии непросто постоянно ездить.","Тем более теперь с собакой.","Понимал, что работа требует времени.","Что у неё есть свои обязанности.","Но от этого мне не становилось легче.","Я снова оказался далеко от двух существ, которых считал своей семьёй.","И снова начал искать способы приезжать.","","Таисия находилась в Красной Поляне.","Дорога туда требовала денег.","А с финансами у меня всё ещё было непросто.","Я старался подрабатывать.","Искал дополнительные возможности.","Откладывал.","Мне хотелось приезжать чаще.","Но за тот период удалось выбраться только два раза.","Всего два.","И каждая из этих поездок была для меня бесценной.","","Я помню, как радовался, когда снова видел её.","Таисию.","Её глаза.","Улыбку.","Смех.","Даже её крик.","Всё это было настолько родным, что я готов был забыть обо всех трудностях ради возможности снова оказаться рядом.","Мне нравилось гулять с ней.","Разговаривать.","Просто находиться поблизости.","Нравилось чувствовать, что после всех наших расставаний и возвращений мы снова выбрали друг друга.","И каждый раз я обещал себе, что буду становиться лучше.","Более внимательным.","Более нежным.","Более открытым.","","Я начал чаще дарить цветы.","Делать комплименты.","Придумывать маленькие сюрпризы.","Старался не забывать о подарках.","Хотел, чтобы Таисия видела: я действительно изменился.","Что перед ней уже не тот парень, который когда-то отталкивал её холодностью.","Теперь я хотел быть человеком, рядом с которым она чувствует себя любимой.","И, наверное, иногда мне это удавалось.","По крайней мере, я очень старался.","","Но жизнь снова готовила удар.","И на этот раз он был связан не с отношениями.","Не с расстоянием.","Не с другим человеком.","А с моей работой.","Меня уволили.","","Когда я узнал об увольнении, внутри словно что-то провалилось.","Я и без того постоянно переживал из-за денег.","Из-за долгов.","Из-за невозможности приезжать так часто, как хотелось.","А теперь лишился работы.","Того, что позволяло мне хотя бы постепенно двигаться вперёд.","Я снова оказался в положении, которого больше всего боялся.","Без стабильного заработка.","С финансовыми обязательствами.","С любимой девушкой, находящейся далеко.","И с ощущением, что я опять ничего не могу сделать.","","Мне было стыдно.","Не перед кем-то конкретным.","Перед самим собой.","Я чувствовал, что снова не справился.","Что опять не смог обеспечить себе устойчивую жизнь.","Что теперь не могу приехать к Таисии, даже если очень хочу.","Что все мои планы снова откладываются.","И сильнее всего меня мучила мысль о том, каким я выгляжу в её глазах.","Мне казалось, что я становлюсь жалким.","Бесполезным.","Человеком, который постоянно обещает что-то изменить, но снова оказывается в сложной ситуации.","Я не знал, действительно ли Таисия так думала.","Но сам видел себя именно таким.","И это било по самооценке сильнее любого чужого слова.","","Я продолжал искать способы заработать.","Брался за подработки.","Разгружал машины.","Старался получить хоть какие-то деньги.","Потому что понимал: останавливаться нельзя.","Нужно закрывать долги.","Нужно жить.","Нужно искать новую работу.","И, конечно, нужно продолжать бороться за возможность быть рядом с Таисией.","А впереди приближался Новый год.","И мне очень хотелось сделать ей особенный подарок.","Она говорила, что ничего дарить не нужно.","Что подарки не обязательны.","Но я уже знал, что хочу сделать.","Когда-то Таисия показала мне кольцо.","Бриллиантовое.","То самое, которое ей понравилось.","Я запомнил.","И теперь собирался исполнить её желание.","Даже если ради этого придётся работать ещё больше.","","Тогда я ещё не понимал, что маленькое кольцо станет для меня символом гораздо большего.","Не просто красивым украшением.","Не просто новогодним подарком.","А доказательством самому себе, что я всё ещё способен что-то сделать.","Что могу справиться.","Что мои усилия способны принести радость человеку, которого люблю.","И что даже после увольнения, долгов и бесконечных трудностей я могу увидеть её счастливую улыбку.","Я начал копить.","Постепенно.","Работая там, где получалось.","Откладывая деньги.","И каждый раз вспоминая, как сильно хочу подарить Таисии именно это кольцо.","Впереди меня ждал момент, который я запомню надолго.","Момент, когда она получит подарок.","И я снова почувствую себя счастливым просто потому, что счастлива она.","","Продолжение — глава 12 «Кольцо, которое стоило больше денег».","Впереди: подарок Таисии, её реакция, Новый год в горах, знакомство с подругами и свадьба её мамы — событие, после которого Артём впервые всерьёз расскажет о своём желании однажды назвать Таисию женой.","ЧАСТЬ II","ЛЮБОВЬ НА РАССТОЯНИИ","Глава 12. Кольцо, которое стоило больше денег","Иногда самым дорогим подарком оказывается не тот, за который ты заплатил больше всего.","А тот, ради которого пришлось преодолеть самого себя.","Когда за красивой коробочкой скрываются бессонные мысли, тяжёлая работа, усталость, переживания и огромное желание увидеть улыбку любимого человека.","Для кого-то это просто украшение.","Для тебя — целая история.","История о том, как ты старался.","О том, сколько раз хотел сдаться, но продолжал.","О том, как среди собственных проблем находил силы думать о счастье другого человека.","Именно таким для меня стало кольцо, которое я подарил Таисии.","","Я помню момент, когда она впервые показала мне его.","Бриллиантовое кольцо.","Красивое украшение, которое ей понравилось.","Она говорила о нём, а я слушал.","Наверное, тогда она даже не подозревала, насколько хорошо я запомню это желание.","Для неё это мог быть один из обычных разговоров.","Увидела что-то красивое.","Поделилась.","И жизнь продолжилась.","Но у меня эта маленькая деталь осталась в памяти.","Я запомнил, какое именно кольцо она хотела.","И однажды решил, что обязательно его куплю.","Не потому, что должен.","Не потому, что она требовала.","А потому, что мне хотелось сделать для неё что-то особенное.","","К тому времени моя жизнь снова переживала непростой период.","Меня уволили.","Стабильного заработка не было.","Долги продолжали напоминать о себе.","Деньги, которых и раньше не хватало, теперь приходилось буквально искать.","Я хватался за возможности подработать.","Разгружал машины.","Старался заработать хоть что-нибудь.","Иногда возвращался к мысли о том, насколько далеко моя жизнь оказалась от той, которую я хотел построить.","Мне хотелось быть рядом с Таисией.","Хотелось иметь возможность приезжать к ней, когда она скучает.","Хотелось помогать.","Хотелось, чтобы ей не приходилось постоянно думать о деньгах.","Но вместо этого я сам находился в положении, когда каждый заработанный рубль имел значение.","И от этого становилось особенно тяжело.","Я чувствовал себя человеком, который постоянно пытается выбраться из ямы, но стоит ему приблизиться к краю, как земля снова осыпается под ногами.","И всё-таки я продолжал работать.","Потому что впереди был Новый год.","А у меня была цель.","","Я начал откладывать деньги на кольцо.","Постепенно.","Небольшими суммами.","Стараясь не тратить то, что уже удалось собрать.","Иногда приходилось выбирать между тем, что хотелось купить себе, и тем, что я планировал подарить Таисии.","И почти всегда я вспоминал её лицо.","Представлял, как она увидит кольцо.","Как поймёт, что я запомнил её желание.","Как обрадуется.","Мне нравилось думать об этом.","Наверное, даже больше, чем о самом подарке.","Потому что в моей голове уже существовал тот момент, ради которого я всё делал.","Она открывает коробочку.","Видит кольцо.","И улыбается.","А я понимаю, что смог.","","Иногда мне кажется, что в тот период я слишком сильно связывал собственную ценность с тем, что мог дать Таисии.","Если удавалось заработать — чувствовал себя лучше.","Если получалось приехать — становился счастливее.","Если мог купить подарок — появлялась гордость.","А если денег не было, я словно переставал видеть в себе что-нибудь хорошее.","Мне казалось, что мужчина обязан справляться.","Обязан зарабатывать.","Обязан решать проблемы.","Обязан делать жизнь любимой девушки легче.","И когда я не мог выполнить хотя бы что-то из этого, начинал ненавидеть собственную беспомощность.","Я редко говорил об этом.","Но постоянно чувствовал.","И, наверное, именно поэтому покупка кольца стала для меня настолько важной.","Мне хотелось не только порадовать Таисию.","Мне хотелось доказать самому себе, что я всё ещё на что-то способен.","","В какой-то момент нужная сумма наконец оказалась у меня.","Я купил кольцо.","То самое.","Которое она хотела.","Помню своё волнение.","Казалось бы, всё уже сделано.","Деньги заработаны.","Подарок куплен.","Остаётся только дождаться Нового года.","Но ждать я совершенно не умел.","Особенно когда дело касалось возможности сделать Таисию счастливой.","Мне хотелось подарить кольцо прямо сейчас.","Не через несколько недель.","Не в назначенную дату.","А как можно скорее.","Я представлял её реакцию и понимал, что больше не хочу держать подарок у себя.","Поэтому написал ей.","Спросил, когда лучше подарить кольцо: сейчас или на Новый год.","Таисия выбрала сейчас.","И я был только рад.","","Я отправил ей подарок.","А потом началось ожидание.","Наверное, со стороны оно могло показаться смешным.","Взрослый парень.","Кольцо уже куплено.","Посылка отправлена.","Казалось бы, чего переживать?","Но я волновался невероятно.","Понравится ли ей?","Подойдёт ли?","Будет ли она рада?","Не окажется ли, что я что-то неправильно понял?","Я постоянно возвращался мыслями к подарку.","Представлял момент получения.","Ждал.","И почему-то мне казалось, что от её реакции зависит гораздо больше, чем от обычного подарка.","","А потом Таисия прислала видео.","Она получила кольцо.","И была счастлива.","Я смотрел на неё и чувствовал, как внутри разливается невероятное тепло.","Вот оно.","То, ради чего я работал.","Ради чего разгружал машины.","Ради чего откладывал деньги.","Ради чего так сильно переживал.","Её радость.","Её улыбка.","Её слова.","Я был счастлив вместе с ней.","И в тот момент все трудности словно отступили.","Ненадолго.","Потому что долги никуда не исчезли.","Работа сама собой не появилась.","Финансовые проблемы не решились.","Но я смотрел на счастливую Таисию и понимал, что смог сделать что-то хорошее.","Для неё.","Для нас.","","Особенно важными для меня оказались её слова.","Я почувствовал одобрение.","Почувствовал, что мои старания заметили.","И это неожиданно придало мне сил.","Наверное, мне действительно не хватало такого ощущения.","Что я справился.","Что сделал что-то правильно.","Что могу быть полезным.","Что человек, которого люблю, доволен мной.","Я словно получил новую порцию энергии.","Захотелось работать ещё больше.","Искать возможности.","Выбираться из долгов.","Восстанавливать финансовое положение.","Чтобы снова иметь возможность приезжать к ней.","Чтобы снова радовать.","Чтобы однажды перестать переживать о том, хватит ли денег на дорогу.","","Я не знал, каким будет наше будущее.","Не знал, сколько ещё трудностей ждёт впереди.","Но тогда, глядя на видео с кольцом, я чувствовал надежду.","Мне казалось, что мы движемся в правильном направлении.","Я меняюсь.","Учусь любить.","Стараюсь заботиться.","Таисия рядом, пусть пока и на расстоянии.","У нас есть Мия.","Есть общие воспоминания.","Есть планы.","И впереди Новый год.","Праздник, который мы собирались встретить вместе.","Я очень ждал его.","Потому что впервые за долгое время хотел не просто отметить наступление нового года.","Я хотел встретить его рядом с девушкой, с которой мечтал провести все следующие.","","Но работа так и не появлялась.","Я продолжал искать.","Продолжал переживать из-за денег.","Продолжал пытаться выбраться из сложного положения.","И всё-таки впереди были несколько дней, которые я очень хотел сделать счастливыми.","Наш Новый год.","В горах.","С Таисией.","С её подругами.","С надеждой, что следующий год окажется лучше предыдущего.","Я ещё не знал, насколько непростой будет дорога к нашему домику.","Не знал, что по пути мне придётся сдерживать злость, потому что кто-то заставит Таисию плакать.","Не знал, насколько необычным окажется для меня праздник в новой компании.","Но уже точно знал одно.","Я буду рядом с ней.","И именно это делало приближающийся Новый год особенным.","","Глава 13. Новый год, который хотелось остановить","Новый год всегда кажется своеобразной границей.","Будто вместе с последними секундами декабря можно оставить позади всё плохое.","Все ошибки.","Все ссоры.","Все неудачи.","Все переживания.","И начать заново.","Конечно, жизнь так не работает.","Долги не исчезают после полуночи.","Проблемы не растворяются вместе с праздничным салютом.","Люди не становятся другими только потому, что на календаре появилась новая цифра.","Но почему-то каждый год мы всё равно надеемся.","И я тоже надеялся.","Особенно тогда.","Потому что собирался встретить Новый год с Таисией.","","К тому моменту за нашими плечами уже было слишком много всего.","Первая встреча.","Анапа.","Совместная квартира.","Её уход.","Возвращение.","Работа на сезоне.","Расстояние.","Расставание.","Другой парень.","Мои письма.","Песни.","Новая встреча.","Поцелуй.","Мия.","И бесконечные попытки построить что-то настоящее.","Иногда я сам удивлялся, сколько всего успело произойти.","Мы словно проживали несколько жизней за один год.","И теперь мне хотелось хотя бы ненадолго забыть обо всех сложностях.","Просто провести праздник рядом.","Без расстояния.","Без ожидания следующей встречи.","Без необходимости смотреть на часы и думать о дороге домой.","","Я приехал к Таисии.","Мы сняли домик в горах.","Красиво звучит, правда?","Новый год.","Горы.","Любимая девушка.","Уютный дом.","Компания друзей.","Кажется, идеальный способ встретить праздник.","Вот только добраться до домика оказалось настоящим испытанием.","Он находился далеко.","И дорога заняла гораздо больше времени и сил, чем хотелось.","Мы добирались долго.","Уставали.","И в какой-то момент произошло то, что очень сильно меня разозлило.","","Какой-то водитель не давал Таисии пройти.","Продолжал движение, несмотря на то что она находилась перед машиной.","Ситуация оказалась настолько неприятной, что Таисия расплакалась.","А я увидел её слёзы.","Наверное, существуют вещи, которые способны мгновенно вывести человека из равновесия.","Для меня одной из таких вещей всегда были её слёзы.","Особенно когда причиной становилось чужое поведение.","Я мог сколько угодно терпеть собственные трудности.","Мог молчать, когда мне было тяжело.","Мог делать вид, что всё нормально.","Но когда кто-то заставлял плакать Таисию, внутри словно вспыхивала злость.","Мне хотелось вмешаться.","Разобраться.","Заставить человека понять, что так поступать нельзя.","Я был невероятно раздражён.","И если бы не Таисия, не знаю, насколько эмоционально отреагировал бы.","Но она меня остановила.","И я сдержался.","","Наверное, это было правильно.","В конце концов, мы приехали отдыхать.","Не выяснять отношения с незнакомыми людьми.","Не портить себе праздник.","Не превращать долгожданные выходные в очередную неприятную историю.","Я понимал это.","Но злость ещё долго не отпускала.","Мне было тяжело видеть, как любимая девушка плачет.","Хотелось защитить её.","Сделать так, чтобы никто больше не мог испортить ей настроение.","Хотя, конечно, я понимал, что невозможно оградить человека от всего плохого.","Можно только быть рядом.","И иногда именно это важнее всего.","","В конце концов мы добрались.","Нашли домик.","И начался праздник.","Я помню, насколько необычным всё это было для меня.","Раньше я не особенно любил подобные ситуации.","Новые компании.","Незнакомые люди.","Необходимость общаться.","Я часто стеснялся.","Чувствовал себя неловко.","Не знал, как правильно себя вести.","Но рядом с Таисией постепенно менялся.","Она словно вытаскивала меня из того маленького мира, в котором я привык прятаться.","Заставляла пробовать новое.","Общаться.","Не бояться чужого внимания.","И теперь я оказался в компании её подруг.","В горах.","На Новый год.","И, к собственному удивлению, был этому рад.","","Мне понравилось знакомиться с ними.","Нравилось ощущать себя частью её жизни.","Не просто парнем, который время от времени приезжает.","А человеком, которого она берёт с собой на праздник.","Знакомит со своими близкими людьми.","С которым хочет разделить важный вечер.","Для меня это имело огромное значение.","Потому что каждый такой момент словно подтверждал: я не чужой.","У меня есть место рядом с ней.","В её жизни.","Среди её друзей.","В её планах.","И это делало меня счастливым.","","Особенно хорошо я помню Таисию в тот вечер.","Её платье.","То, насколько красивой она была.","Я смотрел на неё и не мог перестать восхищаться.","Она была неотразима.","Наверное, именно такие воспоминания остаются особенно яркими.","Не весь праздник целиком.","Не каждое произнесённое слово.","Не все разговоры.","А один образ.","Любимая девушка.","В красивом платье.","Рядом с тобой.","И ты вдруг понимаешь, насколько сильно её любишь.","Я смотрел на Таисию и чувствовал благодарность.","За то, что она снова появилась в моей жизни.","За то, что мы пережили всё предыдущее и всё-таки встретили этот праздник вместе.","За возможность находиться рядом.","","Мы встретили Новый год.","В горах.","В компании.","Вместе.","И для меня это было невероятно мило.","Я не хотел думать о долгах.","О том, что всё ещё не могу найти работу.","О сложностях, которые неизбежно вернутся после праздников.","Мне хотелось просто запомнить этот момент.","Потому что я уже знал, насколько быстро счастье может превращаться в воспоминание.","","Наверное, где-то глубоко внутри я тогда мечтал, чтобы наши отношения наконец стали спокойными.","Чтобы нам больше не приходилось расставаться.","Чтобы расстояние осталось в прошлом.","Чтобы я нашёл хорошую работу.","Смог закрыть долги.","Переехать ближе к Таисии.","И чтобы однажды мы встречали Новый год уже не в съёмном домике, а в собственном доме.","С Мией.","С привычными семейными заботами.","С ощущением, что больше не нужно ничего доказывать.","Что мы просто вместе.","Но пока это оставалось мечтой.","А мечты, как я уже успел понять, не всегда совпадают с жизнью.","","Праздник закончился.","Начался новый год.","И вместе с ним — новый этап нашей истории.","Таисия собиралась приехать в Краснодар.","На свадьбу своей мамы.","Само по себе это было важное событие.","Но ещё больше меня удивило другое.","Она предложила мне пойти вместе с ней.","Познакомиться с родственниками.","Стать частью семейного праздника.","И я снова почувствовал то самое волнение, которое испытывал в начале наших отношений.","Только теперь всё было гораздо серьёзнее.","Потому что я уже не просто хотел понравиться Таисии.","Мне хотелось, чтобы её семья тоже приняла меня.","И где-то глубоко внутри жила мечта, о которой она тогда даже не подозревала.","Однажды я хотел сам стоять рядом с ней на свадьбе.","Только уже не в качестве гостя.","А в качестве жениха.","","Глава 14. Чужая свадьба и моя несказанная мечта","Когда любишь человека, рано или поздно начинаешь представлять будущее.","Сначала осторожно.","Почти незаметно для самого себя.","Представляешь, как вы будете жить вместе.","Как станете проводить выходные.","Куда поедете отдыхать.","Как будете возвращаться домой после работы.","А потом однажды ловишь себя на мысли, что представляешь этого человека рядом не через месяц и даже не через год.","А через много лет.","И почему-то не можешь представить на его месте никого другого.","У меня это произошло с Таисией.","Я хотел, чтобы однажды она стала моей женой.","Но тогда ещё не говорил ей об этом.","","Когда Таисия предложила пойти с ней на свадьбу мамы, я растерялся.","Конечно, внешне старался выглядеть спокойно.","Как всегда.","Моя любимая невозмутимость снова пришла на помощь.","Я делал вид, что ничего особенного не происходит.","Что знакомство с родственниками — совершенно обычное дело.","Что я не переживаю.","Но внутри всё было иначе.","Я боялся.","Боялся не понравиться.","Боялся, что кто-нибудь из её семьи посмотрит на меня и решит, что я недостаточно хорош для Таисии.","Боялся осуждения.","Особенно с учётом того, насколько нестабильной была моя жизнь.","Работа.","Финансы.","Долги.","Постоянные попытки найти своё место.","Мне хотелось выглядеть человеком, рядом с которым за неё можно не переживать.","А сам я далеко не всегда чувствовал себя таким.","И всё-таки согласился.","Потому что она позвала.","Потому что хотела видеть меня рядом.","И потому что для меня это было ещё одним подтверждением серьёзности наших отношений.","","Перед свадьбой возникла небольшая ссора.","Мы не совсем поняли друг друга по поводу одежды.","Я не купил заранее брюки и рубашку.","А ведь на свадьбу нужно было прийти нормально одетым.","Таисия расстроилась.","Я понимал, что сглупил.","Снова не уделил достаточно внимания детали, которая для неё была важна.","И решил исправить ситуацию.","Поехал покупать одежду.","Старался сделать всё, чтобы больше не создавать проблем.","Мне хотелось, чтобы этот праздник прошёл хорошо.","Без лишних ссор.","Без неприятных мелочей.","Чтобы мы просто наслаждались временем вместе.","","Мы сняли красивую квартиру.","И я решил приготовить для Таисии еду.","Сам.","Для меня это было почти отдельным приключением.","Я не был человеком, который с лёгкостью проводит время на кухне и способен быстро приготовить что-нибудь вкусное.","Но мне захотелось удивить её.","Сделать приятное.","Чтобы она приехала и увидела, что я постарался.","Я потратил на готовку практически целый день.","Целый.","Сейчас даже смешно вспоминать.","Наверное, люди, которые действительно умеют готовить, справились бы с тем же самым часа за два.","А я возился невероятно долго.","Но мне было не жалко времени.","Я представлял, как Таисия приедет.","Увидит приготовленную еду.","Удивится.","Улыбнётся.","И мы спокойно проведём вечер.","","Я приготовил крабовый салат.","С рисом.","И, конечно же, именно здесь жизнь решила немного посмеяться надо мной.","Таисия приехала.","Я показал ей, что приготовил.","А она сказала, что не ест крабовый салат с рисом.","Вот так.","Целый день стараний.","И одна маленькая деталь, которую я не учёл.","Наверное, в другой ситуации я мог бы действительно обидеться.","Но тогда мне было скорее смешно от собственной неудачи.","Я сделал вид, будто расстроился.","Хотя на самом деле не злился.","Понимал, что сам не угадал.","Что следовало заранее узнать, какой салат она любит.","И что она вовсе не обязана радоваться блюду только потому, что я долго его готовил.","Но самое главное — она была рядом.","А когда Таисия находилась рядом, многие мелкие неприятности теряли для меня значение.","Я мог сколько угодно переживать из-за салата.","Но стоило посмотреть на неё, как становилось понятно: день всё равно удался.","","Наступил день свадьбы.","Мы отправились на праздник.","Я волновался.","Но старался не показывать.","Мне предстояло познакомиться с множеством родственников.","Стать частью компании, в которой почти все знали друг друга гораздо дольше, чем меня.","И, конечно, я переживал о том, какое впечатление произведу.","Но постепенно напряжение начало исчезать.","Я познакомился с хорошими людьми.","Мне понравилась атмосфера.","Нравилось наблюдать за Таисией среди её семьи.","Видеть другую часть её жизни.","Ту, к которой раньше я не имел такого близкого отношения.","","Особенно мне запомнилась её бабушка.","Она произвела на меня невероятное впечатление.","Я смотрел на неё и постепенно начинал понимать, откуда у Таисии столько характера.","Столько эмоций.","Столько внутренней силы.","Мне казалось, что в ней удивительным образом соединились черты мамы и бабушки.","И это было прекрасно.","Я ведь полюбил Таисию именно такой.","Взрывной.","Эмоциональной.","Иногда совершенно непредсказуемой.","И теперь, знакомясь с её семьёй, словно увидел ещё одну часть истории человека, который стал для меня настолько дорог.","","Праздник продолжался.","Люди общались.","Веселились.","Постепенно многие уже успели выпить.","А потом наступил один из самых традиционных свадебных моментов.","Букет невесты.","Казалось бы, обычная свадебная традиция.","Немного смеха.","Немного неловкости.","Немного шуток о том, кто следующим отправится под венец.","Но для меня этот момент оказался неожиданно серьёзным.","Потому что я уже думал о свадьбе.","Нашей свадьбе.","","Я не говорил Таисии об этом.","Не рассказывал, что действительно представляю её своей женой.","Но внутри уже существовало желание однажды сделать ей предложение.","Не случайно.","Не между делом.","Не потому, что кто-то пошутил на чужом празднике.","А красиво.","Так, чтобы она запомнила этот момент на всю жизнь.","Мне хотелось продумать всё.","Выбрать особенное место.","Возможно, отправиться куда-нибудь в путешествие.","Сделать предложение неожиданно.","Романтично.","Так, чтобы Таисия удивилась.","Чтобы улыбнулась.","Чтобы этот день стал одним из самых счастливых в её жизни.","Я даже представить не мог, что когда-нибудь начну думать о подобных вещах.","Вспомнить хотя бы меня в начале нашей истории.","Парня, который не умел говорить комплименты.","Который стеснялся собственной симпатии.","Который фотографировал девушку возле холодного моря и боялся показать, насколько она ему нравится.","А теперь этот же парень мечтал однажды встать перед ней с кольцом.","И спросить, согласна ли она стать его женой.","","На свадьбе возникла ситуация, связанная с букетом, которая заставила меня особенно остро задуматься о предложении.","Всё происходило неожиданно.","Немного неловко.","И совсем не так, как я когда-то представлял.","Но в тот момент я понял одну важную вещь.","Я действительно готов.","Не в смысле того, что у меня уже решены все финансовые проблемы.","Не в смысле идеальной жизни.","Не в смысле отсутствия страхов.","Нет.","Всего этого у меня как раз не было.","Но я был уверен в человеке, которого хотел видеть рядом.","Я хотел жениться на Таисии.","Именно на ней.","Не потому, что боялся остаться один.","Не потому, что считал свадьбу способом спасти отношения.","А потому, что любил её и представлял с ней своё будущее.","","Я мог бы сделать предложение прямо тогда.","По крайней мере, в тот момент мне казалось, что эмоционально я к этому готов.","Но меня остановила мысль о том, что всё получится не так, как я хотел.","Это была свадьба её мамы.","Чужой праздник.","Чужой особенный день.","А мне хотелось, чтобы наше предложение стало отдельным воспоминанием.","Чтобы оно принадлежало только нам.","Без спешки.","Без случайности.","Без ощущения, что всё произошло из-за свадебной традиции.","Поэтому я ничего не сделал.","Решил подождать.","Продумать всё.","Однажды удивить её по-настоящему.","","Наверное, в этом было что-то особенно трогательное.","Таисия даже не подозревала, насколько серьёзно я уже воспринимаю наше будущее.","Не знала, что иногда мысленно называю её своей будущей женой.","Что представляю, как однажды сделаю предложение.","Что хочу провести рядом с ней гораздо больше времени, чем просто очередной сезон.","Она пробудила во мне романтика.","Человека, который раньше словно не существовал.","Я научился мечтать о красивых моментах.","О сюрпризах.","О кольцах.","О свадьбе.","О семье.","И всё это было связано с одной девушкой.","","Свадьба закончилась.","Мы вернулись к обычной жизни.","Таисия снова уехала работать.","А я остался со своими мыслями.","С воспоминаниями о празднике.","О её семье.","О том, насколько красивой она была.","И с мечтой, которую пока никому не собирался раскрывать.","Я хотел однажды сделать ей предложение.","Но прежде нужно было решить гораздо более приземлённые проблемы.","Найти стабильную работу.","Разобраться с деньгами.","И самое главное — наконец перестать жить на расстоянии.","Потому что я уже начинал понимать: невозможно бесконечно строить совместное будущее, находясь далеко друг от друга.","И вскоре это расстояние снова поставит наши отношения под угрозу.","","Глава 15. Работа ближе к тебе","После свадьбы жизнь быстро вернулась в привычное русло.","Таисия снова работала.","Много.","Я тоже пытался наладить своё положение.","Проходил стажировку.","Искал возможности.","Думал о будущем.","Но теперь к обычным заботам добавилась мысль, которая не покидала меня практически ни на день.","Мне нужно быть ближе к ней.","Не когда-нибудь.","Не через год.","Не после того, как всё идеально сложится.","А как можно скорее.","Потому что я устал любить на расстоянии.","","Каждое утро я просыпался с пониманием, что Таисия снова далеко.","Каждый день занимался своими делами, но мысленно возвращался к одному вопросу.","Как переехать?","Как найти работу рядом?","Как сделать так, чтобы мы могли наконец жить в одном месте?","Я искал вакансии.","Особенно те, где предоставляли проживание.","Потому что понимал: просто переехать и начать снимать квартиру будет непросто.","У меня оставались финансовые проблемы.","Долги.","Обязательства.","И я не хотел, чтобы всё это легло на Таисию.","","Она сама хотела снять квартиру.","Готова была двигаться в этом направлении.","Но меня останавливала мысль, что из-за меня ей придётся брать на себя дополнительные расходы.","Я не мог спокойно принять такой вариант.","Мне казалось неправильным, что девушка, которая и без того много работает, будет вынуждена ещё сильнее напрягаться финансово ради моего переезда.","Я хотел решить проблему самостоятельно.","Найти работу.","Заработать.","Приехать.","И уже тогда строить совместную жизнь.","Наверное, это было связано с моими представлениями о том, каким должен быть мужчина.","Мне хотелось самому справляться с трудностями.","Не перекладывать их на неё.","Не превращаться в ещё одну проблему.","Я ведь видел, сколько всего происходит в её жизни.","И не хотел добавлять ей забот.","","Но поиски работы шли тяжело.","Одни работодатели отказывали.","Другие не отвечали.","Где-то всё выглядело многообещающе, но потом снова ничего не получалось.","Я отправлял отклики.","Ждал.","Проверял сообщения.","Надеялся.","И каждый отказ воспринимал всё болезненнее.","Потому что для меня это был не просто отказ в работе.","Это означало ещё один день далеко от Таисии.","Ещё одну неделю ожидания.","Ещё один период, когда я не смогу быть рядом.","А время шло.","","Постепенно я начал замечать, что Таисия снова отдаляется.","Она всё больше погружалась в собственные проблемы.","Работа.","Мия.","Деньги.","Усталость.","Бесконечные заботы.","Я видел, насколько ей тяжело.","И хотел помочь.","Но не мог.","В этом и заключалась самая мучительная часть происходящего.","Я был готов стараться.","Готов работать.","Готов приезжать.","Готов поддерживать.","Но все мои желания упирались в обстоятельства.","Я находился далеко.","И не мог просто приехать после её тяжёлого дня.","Не мог взять на себя часть повседневных забот.","Не мог обнять, когда она устала.","Не мог даже нормально помочь с Мией.","И постепенно это чувство бесполезности начало возвращаться.","","Я старался не давить на неё.","Понимал, что Таисии нужно время.","Что у неё хватает собственных переживаний.","Что постоянные разговоры о наших отношениях могут только добавить напряжения.","Поэтому занимался своими проблемами.","Искал работу.","Ждал ответов.","Пытался подготовить возможность переезда.","Но внутри всё сильнее боялся.","Потому что видел, как между нами снова растёт расстояние.","И теперь речь шла уже не о километрах.","","А потом наконец появился шанс.","Мне ответили по работе.","Я мог ехать.","Мог оказаться ближе.","Мог наконец перестать быть человеком, который постоянно говорит, что скоро приедет.","Впервые за долгое время появилась реальная возможность изменить нашу жизнь.","Я должен был радоваться.","И я действительно радовался.","Но вместе с этим внутри поднялась паника.","Потому что мне казалось, что я почти опоздал.","Что Таисия уже слишком сильно отдалилась.","Что ещё немного — и переезжать будет просто не к кому.","","Я начал переживать всё сильнее.","Становился навязчивым.","Ревновал.","Пытался понять, что происходит.","Где она.","С кем.","Почему мы стали меньше общаться.","Почему я чувствую, что теряю её, хотя наконец получил возможность оказаться рядом.","Я понимал, что веду себя неправильно.","Но страх словно оказался сильнее здравого смысла.","Мне хотелось получить подтверждение, что мы всё ещё вместе.","Что я нужен.","Что она ждёт моего приезда.","Но чем сильнее я искал это подтверждение, тем больше напряжения появлялось между нами.","","Однажды ночью всё сорвалось.","Таисия отдыхала с Инессой.","Но я тогда не знал этого.","Я видел, что она не отвечает так, как мне хотелось.","Начал звонить.","Переживать.","Думать о худшем.","Она сбрасывала звонки.","И от этого моя тревога только усиливалась.","Я начал представлять, что она находится с кем-то другим.","Что меня обманывают.","Что я снова переживаю ту самую историю, которой так долго боялся.","Мысли лезли одна страшнее другой.","Я уже не мог спокойно оценивать происходящее.","Мне казалось, что нужно срочно разобраться.","Прямо сейчас.","Немедленно.","","Я попросил дать трубку Инессе.","Хотел убедиться, что Таисия действительно находится с подругой.","Сейчас я понимаю, насколько неприятно это могло выглядеть.","Словно я требовал доказательств.","Словно моё беспокойство давало мне право проверять её.","Но тогда мне казалось, что иначе я просто сойду с ума от неизвестности.","Таисия засмеялась.","Сказала, что Инесса в туалете.","И собиралась закончить разговор.","А я воспринял это ещё болезненнее.","Продолжил писать.","Звонить.","Пытаться добиться ответа.","Чем больше она отдалялась, тем настойчивее я становился.","И чем настойчивее становился я, тем сильнее отдалялась она.","Получился замкнутый круг.","Из которого я не смог вовремя выйти.","","В какой-то момент я сорвался окончательно.","Слишком сильно надавил.","Слишком много позволил собственным страхам.","И, кажется, именно тогда потерял значительную часть её доверия.","Я не хотел причинять ей боль.","Не хотел превращать наши отношения в бесконечные проверки.","Не хотел быть человеком, который мешает ей спокойно проводить время с подругой.","Но именно так всё и получилось.","Мой страх потерять Таисию снова начал разрушать то, что я пытался сохранить.","","На следующий день мы переписывались.","Поздно ночью разговаривали.","И тогда она сказала, что хочет расстаться.","Я услышал эти слова и словно застыл.","Снова.","Опять.","Только теперь всё происходило в момент, когда я наконец почти решил проблему расстояния.","Когда нашёл возможность приехать.","Когда уже представлял, как мы будем чаще видеться.","Мне казалось, что это несправедливо.","Что жизнь словно издевается надо мной.","Стоит приблизиться к цели — и она снова исчезает.","","Я решил, что Таисия сказала это на эмоциях.","Что мы оба устали.","Что ночной разговор просто оказался слишком тяжёлым.","Поэтому не стал сразу воспринимать расставание как окончательное.","Постарался уснуть.","Дать ей время.","Дать время себе.","Надеялся, что всё наладится.","","Следующие дни были странными.","Она работала.","Я не понимал, что происходит между нами.","Мы продолжали общаться.","Потом наступили выходные.","Эмоции немного улеглись.","И наши разговоры снова стали тёплыми.","Мы созванивались.","Переписывались, когда у неё появлялось свободное время.","Иногда общались настолько мило, что я почти убедил себя: всё действительно было сказано в порыве эмоций.","Мы не расстались.","Просто сильно поссорились.","Я хотел в это верить.","И верил.","","А потом во время очередного разговора услышал фразу, которая мгновенно разрушила мою надежду.","Таисия назвала меня единственным другом, с которым могла поговорить.","Другом.","Я замолчал.","Внутри всё словно остановилось.","Друг.","Значит, она действительно воспринимает нас иначе.","Значит, те слова о расставании не были случайными.","Значит, пока я думал, что мы миримся, она уже считала наши отношения законченными.","","Я не знал, что сказать.","Не понимал, как реагировать.","Для меня это было неожиданным ударом.","Не потому, что дружба с Таисией ничего не значила.","Наоборот.","Я слишком сильно ценил её присутствие.","Но я любил её.","Не как друга.","Я хотел обнимать её.","Целовать.","Просыпаться рядом.","Строить будущее.","А теперь вдруг оказался человеком, с которым можно просто поговорить.","","Позже она объяснила, что не хотела причинить мне боль.","Не хотела обидеть.","Но боль уже была.","Я чувствовал себя раздавленным.","Вновь.","В тот момент мне казалось, что я снова проиграл.","Проиграл расстоянию.","Собственным страхам.","Обстоятельствам.","Времени.","И самому себе.","","Я находился в ужасном положении.","Работа оставалась нестабильной.","Денег почти не было.","Проблемы никуда не исчезали.","И теперь уходил самый родной человек.","Таисия.","Девушка, ради которой я был готов разгружать машины, ездить через полстраны и менять собственную жизнь.","Девушка, которой я хотел однажды сделать предложение.","Девушка, которую представлял своей женой.","Теперь она называла меня другом.","","Я пытался убедить себя, что должен отпустить её.","Что нельзя бесконечно удерживать человека собственными чувствами.","Что если она больше не хочет отношений, мне нужно принять это.","Но внутри всё сопротивлялось.","Я любил её больше, чем когда-либо прежде.","И совершенно не представлял, как жить с мыслью, что наша история снова закончилась.","А впереди меня ждал переезд.","Я всё-таки собирался приехать работать ближе к ней.","И теперь это решение приобрело совершенно другой смысл.","Раньше я ехал к любимой девушке.","Теперь — в место, где находилась девушка, которую я любил, но которая больше не считала нас парой.","Я не знал, что будет дальше.","Но всё-таки поехал.","Потому что какая-то часть меня продолжала надеяться.","Что, возможно, когда она снова увидит меня рядом, что-нибудь изменится.","Что я смогу доказать серьёзность своих намерений.","Что она снова посмотрит на меня так, как раньше.","","Я приехал шестого числа.","И вечером мы договорились увидеться.","Я отправился к ней в отель.","Сердце колотилось от волнения.","Я снова собирался увидеть Таисию.","И Мию.","Снова оказаться рядом с двумя существами, которых считал своей маленькой семьёй.","Но теперь между нами существовала невидимая граница.","Мы больше не были вместе.","И мне предстояло научиться находиться рядом с человеком, которого хотелось целовать, понимая, что делать этого нельзя.","","Глава 16. В тридцати минутах от счастья","Шестого числа я приехал.","И впервые за долгое время расстояние между мной и Таисией перестало измеряться долгими поездками.","Теперь она находилась всего в тридцати минутах езды.","Тридцать минут.","Для кого-то это обычная дорога по городу.","Для меня — почти чудо.","Я столько времени мечтал оказаться ближе.","Столько раз искал работу.","Столько раз получал отказы.","Столько раз переживал, что не могу приехать.","И вот наконец оказался рядом.","Только теперь мы больше не были парой.","Какая странная насмешка судьбы.","","Вечером мы договорились встретиться.","Я приехал к отелю, где находилась Таисия.","И снова почувствовал то самое волнение.","Будто собирался увидеть её впервые.","Хотя знал её уже давно.","Знал, как она улыбается.","Как злится.","Как смеётся.","Как может неожиданно придумать что-нибудь совершенно безумное.","Знал её привычки.","Знал характер.","Знал, насколько сильно она способна изменить настроение одним словом.","Но всё равно волновался.","Потому что любил.","","Когда я увидел её, внутри снова всё перевернулось.","Боже, какая же она была красивая.","Я смотрел на неё и не мог поверить, что снова нахожусь так близко.","После всех месяцев ожидания.","После расстояния.","После ссор.","После очередного расставания.","Она стояла передо мной.","Живая.","Настоящая.","Моя любимая Таисия.","Хотя теперь я уже не мог назвать её своей.","","Я был рад увидеть Мию.","Наше маленькое чудо.","Собаку, которую мы когда-то вместе забирали.","Ради которой искали полотенце, чтобы ей было тепло.","С которой я больше месяца жил в квартире.","Играл.","Слушал музыку.","Бегал по дому.","И теперь снова мог её увидеть.","В тот момент я особенно остро почувствовал, насколько сильно скучал по нашей маленькой семье.","","Мы пошли гулять.","Разговаривали.","Проводили время вместе.","А я периодически замолкал.","Не потому, что мне нечего было сказать.","Наоборот.","Мне хотелось сказать слишком многое.","Что скучал.","Что люблю.","Что рад оказаться рядом.","Что всё ещё хочу нашего будущего.","Но я понимал, что мы расстались.","И не хотел превращать встречу в попытку заставить её передумать.","Поэтому иногда просто смотрел на Таисию.","Украдкой.","Когда она не замечала.","","Я ловил себя на совершенно глупом желании.","Взять её за руку.","Просто протянуть ладонь.","Переплести пальцы.","И идти рядом.","Как раньше.","Без неловкости.","Без необходимости думать, можно ли это делать.","Мне хотелось обнять её.","Поцеловать.","Прижать к себе.","Иногда даже привычно шлёпнуть по попе — так, как мне нравилось делать, когда мы были вместе.","Но теперь всё это осталось за невидимой границей.","Мы друзья.","И я должен был помнить об этом.","","Я смотрел на неё и думал, что не хочу искать другую.","Не потому, что в мире больше нет красивых девушек.","Не потому, что другие люди не способны подарить счастье.","Просто я любил именно Таисию.","Её характер.","Её смех.","Её эмоциональность.","Её привычки.","Даже те черты, которые иногда становились причиной наших ссор.","Я не хотел заменять её кем-то другим.","Не хотел начинать всё заново с человеком, который совершенно не знает нашей истории.","Мне хотелось исправить то, что не получилось у нас.","Но я не знал, возможно ли это.","","Мы зашли в ресторан.","Поели.","Провели время вместе.","И, конечно, я снова немного не рассчитал бюджет.","Деньги оставались проблемой.","Но в тот момент мне было практически всё равно.","Я видел Таисию.","Слышал её голос.","Мог разговаривать с ней не через телефон.","И разве мог я думать о чём-то другом?","Она предложила дать мне денег.","Но я отказался.","Мне хотелось самому оплатить нашу встречу.","Не потому, что она была обязана позволять мне это делать.","И не потому, что деньги ничего не значили.","Просто для меня тот вечер был слишком дорог.","И я не хотел, чтобы он превращался в разговор о расходах.","","Когда пришло время уезжать, стало грустно.","Очень.","Я понимал, что завтра мы снова будем каждый заниматься своими делами.","Она — работать.","Я — пытаться устроить собственную жизнь.","И никто не знает, когда получится увидеться снова.","Мне хотелось задержаться.","Ещё немного поговорить.","Ещё раз посмотреть на неё.","Запомнить.","Хотя, казалось бы, зачем запоминать человека, которого и так знаешь настолько хорошо?","Но я боялся, что однажды такие встречи совсем исчезнут.","И поэтому старался сохранить каждую.","","Я не знал, была ли Таисия рада видеть меня настолько же сильно.","Иногда мне казалось, что в её глазах всё ещё есть что-то тёплое.","Что я по-прежнему значу для неё больше, чем обычный друг.","Что где-то глубоко внутри наши чувства ещё живы.","Но я не мог этого доказать.","Возможно, мне просто хотелось так думать.","Возможно, я видел то, чего уже не было.","А возможно, действительно чувствовал что-то, о чём мы оба не говорили.","Я не знал.","И эта неизвестность одновременно давала надежду и причиняла боль.","","Когда я возвращался после встречи, снова думал о том, насколько сильно изменился.","Вспоминал себя в Анапе.","Того странного парня, который боялся показать симпатию.","Который вёл себя холодно, хотя внутри уже начинал влюбляться.","Который не умел ценить близость.","А теперь посмотрите на меня.","Я готов был разгружать грузовики.","Искать работу в другом городе.","Ездить на последние деньги.","Преодолевать сотни километров.","Только чтобы увидеть её.","Чтобы побыть рядом.","Чтобы услышать смех.","Чтобы однажды снова получить возможность назвать её своей девушкой.","","Наверное, я слишком долго учился любить.","И только когда научился, понял, насколько легко всё потерять.","Но я всё ещё не хотел сдаваться.","Потому что не мог представить, как однажды буду жить с мыслью, что даже не попытался вернуть наши отношения.","Я хотел знать, что сделал всё возможное.","Не ради красивой истории.","Не ради доказательства собственной правоты.","А потому, что действительно мечтал провести жизнь с этой совершенно сумасшедшей девушкой.","","На следующий день у Таисии была работа.","У меня — выходной.","И я внезапно почувствовал, насколько сильно изменилась наша повседневность.","Раньше я мог проснуться и увидеть сообщение:","«Доброе утро ❤️».","Такое простое.","Обычное.","Но для меня оно значило невероятно много.","Потому что я понимал: она проснулась и подумала обо мне.","Нашла несколько секунд, чтобы написать.","Пожелать доброго утра.","Поставить сердечко.","И от этого весь день словно становился немного теплее.","","Теперь таких сообщений почти не было.","Я просыпался.","Брал телефон.","И не видел привычного «доброго утра».","Понимал, что теперь я, возможно, уже не первый человек, которому она хочет написать после пробуждения.","Что её утро больше не начинается с нашего диалога.","И от этого становилось неожиданно грустно.","Иногда я даже думал о том, как теперь записан в её контактах.","Наверное, просто «Артём».","Без сердечек.","Без ласковых слов.","Без всего того, что когда-то делало нас парой.","А у меня она по-прежнему оставалась записана как «моя❤️».","И я совершенно не хотел ничего менять.","","В один из дней я оказался на ферме.","Сорвал там цветы для Таисии.","Мне захотелось сделать ей маленький сюрприз.","Приехать.","Подарить.","Немного погулять с Мией.","И, конечно, хотя бы ненадолго увидеть её.","Я приехал неожиданно.","Но нормально пообщаться не получилось.","У Таисии было много работы.","Я понимал это.","И всё равно был рад.","Рад, что смог передать цветы.","Рад увидеть Мию.","Рад даже тому, что Таисия продолжала рассказывать мне о происходящем на работе.","О своих делах.","О сложностях.","О повседневных заботах.","Для кого-то это могло показаться пустяком.","А для меня значило, что я ещё не исчез окончательно из её жизни.","Что она всё ещё делится со мной хотя бы частью своего дня.","","Приближалось четырнадцатое февраля.","День всех влюблённых.","И я уже подготовил подарок.","Понимал, что Таисия не особенно хочет его получать.","Знал, что мы больше не вместе.","Но для меня этот день всё ещё оставался праздником любви.","А я ведь любил её.","Безумно.","Именно поэтому решил сделать кое-что особенное.","Не просто купить подарок.","А подарить ей нашу историю.","Историю любви.","Ошибок.","Слёз.","Расставаний.","Возвращений.","И тех моментов, ради которых, как мне тогда казалось, стоило продолжать бороться.","","Я начал писать.","Вспоминал самое начало.","Как впервые общался с ней.","Как ездил через Краснодар.","Как мы внезапно отправились в Анапу.","Как я фотографировал её возле холодного моря.","Как мы съехались.","Как расставались.","Как она возвращалась.","Как появилась Мия.","Как я дарил кольцо.","Как мы встречали Новый год.","Как я знакомился с её семьёй.","Как мечтал однажды сделать предложение.","И чем больше писал, тем сильнее чувствовал, будто снова проживаю всё это.","Иногда улыбался.","Иногда становилось грустно.","Иногда хотелось вернуться в прошлое и исправить хотя бы одну ошибку.","Но я продолжал.","Потому что хотел, чтобы Таисия узнала, какой была наша история с моей стороны.","Чтобы увидела то, чего я так долго не умел показывать.","","Я подготовил ещё один подарок.","В рамке должно было остаться изображение того самого места, где я влюбился в неё.","Места возле моря.","В Анапе.","Где она улыбалась на холоде.","А я фотографировал её и делал вид, что ничего особенного не чувствую.","Мне хотелось, чтобы этот подарок напоминал о начале.","О том времени, когда ещё не существовало всех наших сложностей.","Когда мы были просто двумя людьми, которые внезапно отправились к морю.","И один из них ещё не понимал, что встретил девушку, о которой однажды напишет целую историю.","","В тот момент я не знал, чем всё закончится.","Вернёмся ли мы друг к другу.","Сможем ли снова построить отношения.","Или однажды мне придётся окончательно принять, что наша любовь осталась в прошлом.","Но всё ещё надеялся.","И в конце своей истории написал слова, которые казались мне особенно важными.","Рыцарей больше нет.","Драконы давно исчезли.","Но я всё равно буду стараться.","Буду любить.","Буду ждать своего шанса.","В ожидании дракона.","","Тогда мне казалось, что история почти закончена.","Я даже написал её завершение.","Допустил, что у нас может быть печальный финал.","Но всё ещё верил, что однажды появится новая глава.","Что мы снова встретимся.","Что я смогу её очаровать.","Что мы опять будем обниматься.","Что она снова станет моей.","И я оказался прав только в одном.","Новая глава действительно появилась.","Вот только жизнь написала её совершенно не так, как я ожидал.","","ЧАСТЬ III","В ОЖИДАНИИ ДРАКОНА","Глава 17. Четырнадцатое февраля","Я ждал этого дня.","Наверное, слишком сильно.","Когда мы расстались, у меня осталось не так много поводов надеяться на встречу.","Теперь нельзя было просто договориться провести выходные вместе, как обычная пара.","Нельзя было рассчитывать на поцелуй.","Нельзя было быть уверенным, что Таисия захочет увидеться.","Поэтому каждая возможность встретиться становилась для меня особенной.","А четырнадцатое февраля казалось почти символичным.","День влюблённых.","И я — человек, который всё ещё безумно влюблён.","","Я заранее подготовил подарок.","Ту самую историю наших отношений.","И ещё один подарок, связанный с Анапой.","С местом, где я впервые по-настоящему почувствовал, насколько сильно Таисия мне нравится.","Мне хотелось вручить всё лично.","Посмотреть на её реакцию.","Увидеть, как она будет читать.","Возможно, услышать что-нибудь тёплое.","Я не ждал, что подарок мгновенно вернёт наши отношения.","По крайней мере, старался не строить таких ожиданий.","Но очень хотел провести этот день рядом.","","Незадолго до праздника Таисия заболела.","Ей стало плохо.","Она грустила.","И я решил приехать.","Привезти лекарства.","Купить то, что ей нужно.","Хотя бы немного помочь.","Мне было тяжело осознавать, что она плохо себя чувствует, а я снова не могу сделать ничего действительно большого.","Но теперь находился ближе.","И мог хотя бы приехать.","","В тот день я подумал, что, возможно, стоит вручить подарок заранее.","Раз ей плохо.","Раз настроение испорчено.","Раз она заболела.","Может быть, маленький сюрприз хотя бы немного её порадует?","Я достал подарок.","И подарил.","Таисии понравилось.","Я был счастлив.","Пусть не всё получилось так, как планировалось.","Пусть четырнадцатое февраля ещё не наступило.","Но я снова увидел её радость.","И на какое-то время мне стало легче.","","Проблема заключалась в том, что моя собственная жизнь в этот момент снова разваливалась.","Работа на ферме оказалась действительно тяжёлой.","Денег почти не оставалось.","Я тратился на дорогу.","На необходимые покупки.","На попытки помочь Таисии.","И постепенно оказался в положении, когда начал переживать даже о самых простых вещах.","Как купить еду?","Как оплатить автобус?","Как продолжать работать, если не хватает денег даже на повседневные расходы?","Я пытался искать выход.","Но всё давалось тяжело.","И всё-таки продолжал думать о четырнадцатом февраля.","О встрече.","О том, как мы проведём хотя бы немного времени вместе.","Эта мысль словно помогала выдерживать остальные трудности.","","А потом Таисия позвонила.","И задала вопрос:","— Ты точно хочешь увидеться?","Я сразу почувствовал что-то неприятное.","Не знаю почему.","Наверное, потому что слишком хорошо успел изучить ситуации, когда подобный вопрос появляется не просто так.","Я начал спрашивать, в чём дело.","И услышал, что на четырнадцатое февраля она запланировала встречу с Инессой.","Они собирались пойти в клуб.","","Я понимаю, что мы тогда не были парой.","Понимаю, что Таисия имела право строить собственные планы.","Встречаться с подругами.","Отдыхать.","Проводить праздник так, как ей хочется.","Но в тот момент я почувствовал огромное разочарование.","Потому что всю неделю жил ожиданием нашей встречи.","Мне казалось, что мы всё-таки увидимся.","Что я смогу провести с ней этот день.","А теперь планы менялись.","И вместе с ними словно исчезало всё, на что я надеялся.","","Я был очень обижен.","Наверное, сильнее, чем следовало.","Но эмоции уже накопились.","Тяжёлая работа.","Отсутствие денег.","Постоянные переживания.","Неопределённость между нами.","И теперь ещё это.","Мне вдруг показалось, что я больше ничего не значу для Таисии.","Что моё желание увидеться не имеет для неё такого же значения, как для меня.","Что я снова пытаюсь удержаться за отношения, которых уже нет.","И в какой-то момент решил:","Хватит.","Мне здесь больше нечего делать.","","Я вернулся с фермы.","Быстро собрал вещи.","Придумал объяснение своему отъезду.","Купил билет на поезд.","И в тот же вечер отправился обратно в Краснодар.","Всё произошло настолько быстро, что я сам не успел до конца осознать принятое решение.","Ещё утром я находился рядом с местом, где работала Таисия.","А вечером уже ехал домой.","Расстроенный.","Обиженный.","С ощущением, что снова оказался ненужным.","","Я сидел в поезде и думал о том, как странно всё складывается.","Столько времени искал возможность оказаться ближе.","Столько раз переживал из-за расстояния.","Наконец приехал.","Устроился работать.","И теперь сам уезжал.","Потому что больше не мог справляться с собственными чувствами.","Мне хотелось верить, что поступаю правильно.","Что наконец выбираю себя.","Что перестаю бегать за человеком, который больше не хочет быть со мной.","Но внутри всё равно было больно.","","В дороге мне позвонила Таисия.","Спросила:","— Ты где?","А я уже ехал в Краснодар.","","На следующее утро я спросил, почему она звонила.","Что хотела.","И услышал ответ, который совершенно не ожидал.","Она хотела меня увидеть.","Но я уже был в поезде.","Позже я узнал, что в тот день Таисия гуляла с парнем, с которым ей не очень понравилось проводить время. Она заболела и захотела увидеть меня.","Эта новость вызвала во мне противоречивые чувства.","С одной стороны, мне было неприятно узнавать о другом парне.","С другой — она хотела увидеть именно меня.","И это снова пробудило надежду.","","Мы созвонились.","Разговаривали.","Я понял, насколько сильно скучаю.","Насколько хочу оказаться рядом.","Насколько глупым теперь кажется расстояние, которое сам создал, уехав домой.","Мы начали шутить о том, что я прямо сейчас снова приеду.","И в какой-то момент шутка перестала быть шуткой.","","Уже в обед я снова ехал на поезде.","Обратно.","К ней.","","Наверное, если бы кто-нибудь наблюдал за моей жизнью со стороны, он решил бы, что я окончательно сошёл с ума.","Вчера уехал, потому что был обижен.","Сегодня возвращаюсь, потому что скучаю.","Снова трачу деньги.","Снова преодолеваю расстояние.","Снова делаю всё ради возможности увидеть Таисию.","Но тогда мне было совершенно не важно, насколько странно это выглядит.","Она хотела меня видеть.","А я хотел видеть её.","И этого оказалось достаточно.","","Таисия сняла квартиру.","Она болела.","Я приехал.","И, наверное, именно с того дня между нами снова начало что-то меняться.","Не было громких признаний.","Не было обещаний, что теперь всё обязательно получится.","Не было красивого разговора о возвращении отношений.","Но что-то произошло.","Мы снова начали смотреть друг на друга иначе.","Словно между нами оставалось то самое чувство, которое мы столько раз пытались забыть.","","Я не знал, чем это закончится.","Но снова почувствовал надежду.","И снова позволил себе поверить, что история продолжается.","Хотя четырнадцатое февраля, которого я так ждал, уже пошло совершенно не по плану.","Наверное, именно в этом и заключалась особенность наших отношений.","Мы редко приходили туда, куда собирались.","Но каким-то невероятным образом постоянно снова оказывались рядом.","","После этой встречи я уже не мог приезжать так часто.","Финансовые возможности оставались ограниченными.","Работа и деньги продолжали создавать проблемы.","Но мы общались.","Переписывались.","Созванивались.","И между нами снова появлялось что-то тёплое.","Я чувствовал это.","Хотя Таисия по-прежнему иногда отшучивалась, что мы просто друзья.","Мне это не нравилось.","Совсем.","Потому что я не хотел быть её другом.","Я хотел быть человеком, к которому она возвращается домой.","Которого целует.","Которого любит.","Но пока приходилось принимать то, что есть.","И надеяться.","","Тем временем жизнь Таисии становилась всё сложнее.","Работа практически круглосуточно.","Подготовка к сдаче на права.","Финансовые проблемы.","Усталость.","И новые трудности, связанные с жильём.","В её жизни снова начались перемены.","И вскоре они приведут нас к очередной попытке жить вместе.","Попытке, которая сначала подарит мне надежду на семейное счастье, а потом снова заставит чувствовать себя человеком, который ничего не смог.","","Продолжение — глава 18 «Дом, в котором мы снова были вместе».","В ней начнётся жизнь в Весёлом: переезд Таисии с Лейлой, проблемы Инессы, цветы, которые Артём привезёт после долгой дороги, неожиданное совместное проживание и постепенное возвращение тех трудностей, от которых они так долго пытались убежать.","ЧАСТЬ III","В ОЖИДАНИИ ДРАКОНА","Глава 18. Дом, в котором мы снова были вместе","Иногда мне кажется, что у нашей истории была одна странная особенность.","Каждый раз, когда я окончательно убеждал себя, что всё закончилось, жизнь находила способ снова свести нас вместе.","Мы расставались.","Отдалялись.","Пытались привыкнуть к отсутствию друг друга.","Я учился засыпать без её сообщений, просыпаться без привычного «доброе утро» и жить с пониманием, что теперь у каждого из нас своя дорога.","А потом что-нибудь происходило.","Неожиданный приезд.","Звонок.","Встреча.","И мы снова оказывались рядом.","Словно два человека, которые никак не могли окончательно разойтись.","После четырнадцатого февраля всё повторилось.","Я уехал, думая, что больше не нужен ей.","А уже на следующий день снова ехал обратно.","И теперь между нами опять появилось что-то, чему мы не спешили давать название.","","Мы продолжали общаться.","Созванивались.","Переписывались.","Иногда разговоры получались настолько тёплыми, что я почти забывал о нашем расставании.","Мне нравилось слышать её голос.","Нравилось, когда она рассказывала о своём дне.","Нравилось ощущать, что я всё ещё присутствую в её жизни.","Но была одна вещь, которая постоянно возвращала меня к реальности.","Таисия по-прежнему могла отшутиться, что мы друзья.","Друзья.","Как же я не любил это слово.","Не потому, что дружба была чем-то плохим.","А потому, что между нами уже произошло слишком многое, чтобы я мог спокойно воспринимать её исключительно как подругу.","Я помнил наши поцелуи.","Нашу первую квартиру.","Нашу маленькую Мию.","Новый год в горах.","Свадьбу её мамы.","И собственные мечты о том, как однажды назову Таисию женой.","А теперь должен был улыбаться, когда она говорила, что мы просто друзья.","Иногда я тоже шутил.","Делал вид, что меня это не задевает.","Но внутри каждый раз появлялась небольшая обида.","Потому что мне хотелось гораздо большего.","","Тем временем у Таисии снова начался непростой период.","Работа забирала практически всё её время.","Она готовилась сдавать на права.","Пыталась зарабатывать достаточно, чтобы справляться с повседневными расходами.","И одновременно решала проблемы, связанные с жильём.","В какой-то момент они с Лейлой переехали из отеля в квартиру.","Сначала казалось, что всё складывается неплохо.","Совместное проживание.","Возможность немного изменить привычную жизнь.","Но постепенно начались трудности.","Отношения Лейлы создавали дополнительные проблемы.","Появлялась суета.","Возникали неприятные ситуации.","Таисия нервничала.","Не высыпалась.","Уставала ещё сильнее.","Я видел, насколько тяжело ей становится.","И снова испытывал знакомое чувство.","Мне хотелось помочь.","Но я не всегда понимал, как именно это сделать.","","Потом проблемы появились у Инессы.","Ей стало негде жить.","И Таисия предложила временно переехать к ним.","Теперь в квартире жили втроём.","Таисия, Лейла и Инесса.","Я не знал всех подробностей их совместной жизни.","Не присутствовал при каждом разговоре.","Не мог видеть все сложности, с которыми они сталкивались.","Но понимал, что спокойствия у Таисии от этого не прибавилось.","Работа.","Усталость.","Проблемы подруг.","Постоянные бытовые вопросы.","И среди всего этого — наши непонятные отношения.","Мне хотелось хотя бы иногда становиться для неё человеком, рядом с которым можно отдохнуть от происходящего.","Но, как обычно, получалось далеко не всегда.","","Однажды Таисия позвала меня приехать.","Она отработала сутки.","Я понимал, что после такой смены человек может буквально валиться с ног.","Поэтому заранее написал ей.","Попросил предупредить, если она собирается спать, чтобы я не приезжал сразу.","Мне не хотелось мешать ей отдыхать.","Не хотелось оказаться причиной ещё одной неприятности.","Я прекрасно знал, насколько важен для неё сон после работы.","Но предупреждения не последовало.","И я поехал.","","По дороге я купил цветы.","У бабушки на вокзале.","Мне нравились такие маленькие покупки.","Не обязательно дорогие букеты из красивых цветочных магазинов.","Иногда достаточно просто увидеть цветы и подумать:","«А ведь Таисии будет приятно».","Я представлял, как приеду.","Как она откроет дверь.","Как увидит букет.","Возможно, улыбнётся.","И мы проведём немного времени вместе.","Мне хотелось сделать ей приятное.","Особенно после тяжёлой смены.","","Когда я приехал, дверь открыла Инесса.","Оказалось, Таисия уснула.","Она хотела спать.","И моё появление совсем не обрадовало её.","Я не ожидал такой реакции.","Ведь специально спрашивал заранее, стоит ли приезжать.","Хотел избежать именно такой ситуации.","Но теперь уже находился у неё дома.","С цветами.","И с ощущением, что снова оказался не вовремя.","","Таисия встретила меня раздражённо.","Я понимал, что она устала.","Что после суток человек может быть совсем не в настроении.","Что ей хотелось просто выспаться.","Но мне всё равно было обидно.","Я ведь не собирался мешать.","Не хотел будить её.","Не приехал специально, чтобы испортить отдых.","Наоборот.","Хотел порадовать.","А получилось так, словно само моё присутствие стало проблемой.","Я оставил цветы.","И пошёл гулять с Мией.","","Прогулка с собакой немного помогла отвлечься.","Мия всегда вызывала у меня особенные чувства.","Я смотрел на неё и вспоминал, как мы когда-то забирали её вместе с Таисией.","Как искали полотенце, чтобы ей было тепло.","Как я играл с ней дома.","Как радовался, что у нас появилась маленькая семья.","Теперь всё было гораздо сложне
