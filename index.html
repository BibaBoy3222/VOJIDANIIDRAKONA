<style>

.page-content h1,.page-content h2{font-weight:normal;text-indent:0;line-height:1.25}
.page-content h1{font-size:1.42em;margin:0 0 1.2em;letter-spacing:-.025em}

.page.blank .page-content{display:none}

.nav-btn:disabled{opacity:.35;cursor:not-allowed}

.search-results{max-height:55vh;overflow:auto;margin-top:10px}

.search-result span{color:#77736d}
.settings-panel{display:none;position:fixed;z-index:25;right:20px;top:75px;width:min(310px,calc(100vw - 40px));padding:18px;background:#fffefa;border:1px solid #e0dbd2;border-radius:13px;box-shadow:0 15px 55px #0002}
.settings-panel.open{display:block}
.setting{margin:16px 0}
.setting label{display:flex;justify-content:space-between;font-size:12px;color:#5d5852;margin-bottom:9px}
.setting input[type=range]{width:100%;accent-color:var(--accent)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#272321;color:white;padding:11px 16px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}

.bookmark-on{color:var(--accent);border-color:#bba6a5;background:#eee5e2}
@media(max-width:900px){.app{grid-template-columns:1fr;gap:10px;padding-top:14px}.sidebar{display:none}.mobile-toc{display:inline-block}.book-spread{min-height:min(690px,calc(100dvh - 190px))}.page{padding:clamp(20px,5vw,42px) clamp(17px,4vw,30px) 46px}.page-content{font-size:calc(var(--page-font) * .86)}.reader-toolbar{margin-top:0}.topbar{height:58px}.brand{font-size:10px}.book-spread{grid-template-columns:1fr}.page.left{display:none}.page.right{border-radius:3px;background:var(--paper);box-shadow:var(--shadow)}.page.right .page-content{font-size:var(--page-font)}.page.right .page-number{bottom:18px}.nav-btn{min-width:0;flex:1}.page-count{white-space:nowrap}}
@media(max-width:420px){.topbar{padding:0 12px}.brand{letter-spacing:.09em;gap:7px}.top-actions{gap:5px}.icon-btn{width:36px;min-height:36px}.app{padding-left:10px;padding-right:10px}.reader-toolbar{font-size:10px}.small-select{padding:7px 5px}.book-spread{min-height:calc(100dvh - 180px)}.page{padding:26px 22px 45px}.page-content{font-size:var(--page-font)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style>

</main>

</div>

<script id="book-data" type="application/json">{"title":"В ОЖИДАНИИ ДРАКОНА","subtitle":"История любви, которая каждый раз начиналась заново","meta":["Автобиографический роман","Автор: Артём"],"paragraphs":["В ОЖИДАНИИ ДРАКОНА","История любви, которая каждый раз начиналась заново","Автобиографический роман","Автор: Артём","","ЧАСТЬ I","КОГДА ВСЁ ТОЛЬКО НАЧИНАЛОСЬ","Глава 1. Девушка, ради которой я ехал через весь Краснодар","Говорят, самые важные люди появляются в нашей жизни неожиданно.","Не тогда, когда мы их ищем. Не тогда, когда готовы к любви. И уж точно не тогда, когда уверены, что впереди нас ждёт история, способная изменить всё.","Они просто появляются.","Сначала становятся обычным сообщением в телефоне. Потом — человеком, с которым хочется разговаривать чуть дольше, чем с остальными. А однажды ты замечаешь, что готов проехать через половину города, потратить последние деньги и отказаться от собственных планов ради нескольких часов рядом.","И даже тогда не понимаешь, что уже начал влюбляться.","Со мной произошло именно так.","Её звали Таисия.","И если бы кто-нибудь в тот момент сказал мне, что однажды я буду писать целую книгу об этой девушке, я бы, наверное, рассмеялся.","Не потому, что она была недостаточно особенной.","Просто тогда я ещё не знал, насколько особенной она станет для меня.","","В моей жизни она появилась примерно два года назад.","Взрывная. Эмоциональная. Иногда резкая. С характером, который невозможно было не заметить.","Она не была похожа на спокойных девушек, которые тщательно подбирают слова, стараются всем понравиться и прячут настоящие эмоции за вежливой улыбкой.","Таисия была другой.","Если ей что-то не нравилось, это чувствовалось. Если она злилась, скрыть это было невозможно. Если радовалась, то искренне, по-настоящему, словно на несколько мгновений весь остальной мир переставал существовать.","В ней было столько эмоций, что порой казалось: одной девушки слишком много для такого маленького мира.","Но именно это меня и привлекало.","За её характером скрывалась история, которую я постепенно узнавал.","До меня в её жизни уже был человек, оставивший после себя болезненные воспоминания. Прошлые отношения ранили её, и, хотя я не мог до конца знать, что она пережила, мне было понятно: доверять людям после такого непросто.","Наверное, поэтому её искренность казалась мне ещё более удивительной.","Она могла рассказывать о своей жизни, о работе, о том, что её раздражает или радует. Иногда разговоры получались смешными, иногда серьёзными, иногда совершенно бессмысленными.","Но мне нравились они все.","Таисия работала в букмекерской конторе.","Я слушал её истории о сменах, о рабочих буднях, о разных ситуациях, которые с ней происходили. Казалось бы, что особенного может быть в рассказах человека о работе?","Но когда рассказывала она, мне было интересно.","Иногда я даже не задумывался над тем, что именно она говорит.","Мне просто нравилось её слушать.","Нравилось, как она общается. Как реагирует. Как рассказывает о вещах, которые для неё важны.","Мне нравилась её честность.","В ней было что-то настоящее.","То, чего я, возможно, давно искал в людях, но сам ещё не понимал этого.","","Тогда я воспринимал её как друга.","По крайней мере, именно так я себе говорил.","Я не пытался красиво ухаживать. Не придумывал романтических свиданий. Не засыпал её комплиментами и не строил планов на совместное будущее.","Да какой из меня тогда был романтик?","Я совершенно не умел показывать чувства.","Наверное, даже если бы захотел признаться кому-нибудь в симпатии, сделал бы это настолько странно, что человек решил бы, будто я над ним издеваюсь.","Я не умел быть нежным.","Не умел говорить красивые слова.","Не умел показывать человеку, насколько он мне дорог.","Зато умел приезжать.","И почему-то именно ради неё мне хотелось делать это снова и снова.","Краснодар — большой город.","Особенно когда у тебя почти нет денег.","Особенно когда дорога занимает немало времени.","И особенно когда ты прекрасно понимаешь, что мог бы остаться дома, отдохнуть, заняться своими делами или хотя бы сохранить последние деньги.","Но я ехал.","Иногда буквально на последние.","Через половину Краснодара.","Не ради какого-то особенного события. Не ради поцелуя или признания. Не ради обещания, что между нами однажды что-нибудь получится.","Я просто хотел провести с ней время.","Посидеть рядом.","Поговорить.","Послушать очередную историю о её работе.","Увидеть её настроение, её реакции, её улыбку.","И возвращаться домой с ощущением, что день прошёл не зря.","Сейчас, оглядываясь назад, я понимаю, насколько странно это выглядело.","Человек, который якобы просто дружит с девушкой, готов тратить последние деньги, лишь бы увидеть её.","Человек, который не считает себя романтиком, почему-то снова и снова выбирает дорогу к ней.","Человек, который не верит в любовь, постепенно начинает делать ради другого то, чего раньше не делал ни для кого.","Но тогда я не задавал себе этих вопросов.","Мне было хорошо.","И этого хватало.","","Больше всего меня подкупала её искренность.","Наверное, я мог бы назвать десятки качеств, которые мне в ней нравились, но именно искренность запомнилась первой.","Таисия не казалась человеком, который старается выглядеть идеальным.","Она могла быть уставшей.","Могла злиться.","Могла рассказывать о неприятных вещах.","Могла эмоционально реагировать на происходящее.","И всё равно оставалась для меня невероятно милой.","Мне нравилось, что рядом с ней жизнь не казалась какой-то заранее написанной историей.","С ней никогда нельзя было точно знать, что произойдёт завтра.","Возможно, именно поэтому я так быстро привык к её присутствию.","Постепенно общение с Таисией стало частью моей повседневности.","Я не помню точного момента, когда это произошло.","Не было какого-то особенного вечера, после которого я вдруг понял, что она занимает важное место в моей жизни.","Всё происходило незаметно.","Сначала ты просто отвечаешь человеку на сообщения.","Потом начинаешь ждать, когда он напишет.","Потом находишь повод увидеться.","А потом уже сам не замечаешь, как человек становится причиной, по которой тебе хочется куда-то ехать, что-то делать и менять привычный распорядок дня.","И самое удивительное — ты всё ещё называешь это дружбой.","Я действительно думал, что мы просто дружим.","Наверное, мне было удобнее так считать.","Ведь дружба не требовала от меня признаний.","Не заставляла рисковать.","Не вынуждала открываться и показывать свою уязвимость.","А любовь…","Любовь меня пугала.","Тогда я ещё не понимал, насколько сильно.","","У меня уже был опыт, из-за которого я боялся оказаться человеком, чьими чувствами просто воспользуются.","Я не хотел снова довериться кому-то, а потом остаться с ощущением, что всё это было нужно только мне.","Поэтому даже когда Таисия начала нравиться мне сильнее, я предпочитал ничего не показывать.","Будто равнодушие могло защитить меня от боли.","Какая же это была глупость.","Но понять это мне предстояло гораздо позже.","Пока же я продолжал приезжать к ней, общаться, слушать её истории и делать вид, что всё происходящее совершенно обычно.","А жизнь тем временем готовила для нас первую неожиданную поездку.","Ту самую, после которой я уже не мог смотреть на Таисию так, как раньше.","","Я часто возвращаюсь мыслями к самому началу.","Не к нашим расставаниям.","Не к ссорам.","Не к тем моментам, когда мы причиняли друг другу боль.","А именно к первым дням.","Когда ещё не существовало всех этих сложностей.","Когда мы не пытались разобраться, кто прав, а кто виноват.","Когда не было бесконечных переездов, расстояний, долгов, переживаний и страха потерять друг друга.","Были просто два человека.","Девушка, которая работала в букмекерской конторе, уставала, рассказывала истории и жила своей эмоциональной жизнью.","И парень, который ехал через половину Краснодара, потому что почему-то именно рядом с ней ему хотелось находиться.","Иногда мне кажется, что в этом начале было что-то особенно красивое.","Мы ещё ничего друг другу не обещали.","Ничего не требовали.","Не пытались удержать.","Я даже не знал, что однажды буду считать её самым родным человеком.","Что стану мечтать о совместном доме.","Что у нас появится собака.","Что я буду выбирать ей кольцо, знакомиться с её семьёй, встречать с ней Новый год и представлять, как однажды она станет моей женой.","И уж точно я не знал, сколько раз нам придётся расстаться.","Сколько раз я буду собирать себя по кусочкам.","Сколько раз она снова появится в моей жизни, когда я уже почти поверю, что всё закончилось.","Тогда я ничего этого не знал.","И, наверное, хорошо.","Потому что, знай я заранее, через что нам придётся пройти, я всё равно не уверен, что смог бы отказаться от знакомства с ней.","Ведь вместе со всей болью пришлось бы отказаться и от самого прекрасного, что я пережил рядом с Таисией.","От её улыбки.","От наших поездок.","От Мии.","От объятий.","От тех редких мгновений, когда всё было хорошо и казалось, что так будет всегда.","Но до всего этого было ещё далеко.","Впереди нас ждала Анапа.","Холодное море.","Спонтанное решение.","И девушка, которая даже не подозревала, насколько сильно начинает менять мою жизнь.","А я…","Я всё ещё был уверен, что просто дружу с ней.","Как же сильно я ошибался.","","Глава 2. Билеты в неизвестность","Иногда жизнь меняется из-за решений, которые ты принимаешь месяцами.","Ты долго думаешь, взвешиваешь все варианты, сомневаешься, строишь планы, пытаешься предусмотреть последствия.","А иногда всё решают несколько минут.","Одно неожиданное предложение.","Одна мысль.","Одно сообщение.","И вот ты уже едешь на вокзал, совершенно не понимая, что ждёт тебя впереди.","Наша поездка в Анапу началась именно так.","","Всё произошло внезапно.","Таисия предложила поехать в Анапу.","Без долгой подготовки, без заранее составленных планов и без уверенности, что эта поездка вообще получится.","Просто взять и уехать.","В другой город.","К морю.","Я тогда почти не располагал деньгами.","Да и сама идея показалась мне настолько неожиданной, что первой реакцией был отказ.","Я постеснялся.","Наверное, дело было даже не столько в деньгах.","Я просто не привык к подобным решениям.","Не привык внезапно куда-то срываться.","Не привык соглашаться на приключения, когда не знаю, что будет дальше.","А уж тем более не привык отправляться в другой город с девушкой, которая мне нравилась, но которой я боялся в этом признаться.","Поэтому я отказался.","Казалось бы, на этом всё могло закончиться.","Таисия вернулась после рабочей смены и собиралась поспать.","Обычный день.","Обычное предложение, от которого я отказался.","Можно было остаться дома и продолжить жить как раньше.","Но что-то не давало мне покоя.","Я сидел и думал.","Почему я вообще отказался?","Почему снова позволяю собственным страхам решать за меня?","Почему сижу на месте, когда девушка, с которой мне так нравится проводить время, предлагает отправиться куда-то вместе?","У меня не было ответов.","Точнее, был один.","Я просто боялся.","Боялся выглядеть глупо.","Боялся неловкости.","Боялся оказаться в ситуации, где придётся показать, что она мне небезразлична.","И в какой-то момент я разозлился на самого себя.","Ну сколько можно?","Почему я должен отказываться от того, чего на самом деле хочу?","Ведь я хотел поехать.","Хотел провести с ней время.","Хотел увидеть море.","Хотел увидеть её счастливой.","И тогда я взял телефон.","Написал Таисии, что мы всё-таки едем.","Нужно срочно собираться, покупать билеты и встречаться на вокзале.","Вот так.","Без долгих размышлений.","Без уверенности, что всё пройдёт идеально.","Я просто решился.","И сейчас, вспоминая тот момент, понимаю: это было одно из первых решений, которые я принял не вопреки своим чувствам, а благодаря им.","","Я до сих пор помню нашу встречу на вокзале.","Наверное, некоторые воспоминания остаются с человеком навсегда не потому, что в них произошло что-то грандиозное.","А потому, что именно в такие моменты он впервые почувствовал то, чему ещё не умел дать название.","Таисия приехала после работы.","Она была уставшей.","И невероятно красивой.","Я помню, как смотрел на неё и стеснялся.","Боже, как же я стеснялся.","Вроде бы мы уже общались, виделись, проводили вместе время.","Казалось, что тут такого?","Но почему-то именно на вокзале я особенно остро почувствовал, насколько сильно она мне нравится.","Передо мной стояла девушка, с которой я собирался отправиться к морю.","Просто мы вдвоём.","В другой город.","И вместо того чтобы радоваться и показывать свои чувства, я начал вести себя так, словно мне совершенно всё равно.","Сейчас я бы многое отдал за возможность вернуться в тот момент и сказать самому себе:","«Артём, перестань строить из себя непонятно кого. Ты ведь счастлив. Так почему боишься это показать?»","Но тогда я этого не понимал.","Мне казалось, что если Таисия заметит мою симпатию, я окажусь в уязвимом положении.","Поэтому я прятался за равнодушием.","За странным поведением.","За неловкой грубостью.","И даже не задумывался, как всё это выглядит со стороны.","","Мы отправились в Анапу.","Я не знаю, что именно Таисия думала обо мне во время той поездки.","Возможно, считала меня странным.","Возможно, не понимала, почему человек, который сам согласился ехать с ней, теперь ведёт себя так отстранённо.","Возможно, её это обижало.","Я не могу знать наверняка.","Но я прекрасно помню, что происходило внутри меня.","Мне хотелось быть рядом.","Хотелось разговаривать.","Хотелось наслаждаться временем, которое мы проводили вместе.","И одновременно я делал всё, чтобы скрыть эти желания.","Это был какой-то невероятный внутренний конфликт.","С одной стороны — симпатия, которую становилось всё труднее отрицать.","С другой — страх, что эти чувства однажды обернутся болью.","И вместо того чтобы просто быть собой, я выбирал худший из возможных вариантов.","Я становился холодным.","Отдалённым.","Иногда грубым.","Наверное, со стороны могло показаться, что я вообще не хотел туда ехать.","Хотя на самом деле был счастлив оказаться рядом с ней.","","Особенно хорошо я помню море.","Холодное.","Совсем не такое, каким его обычно представляют, когда думают об Анапе.","Это была не та поездка, где люди целыми днями лежат на пляже под палящим солнцем.","У моря было холодно.","Но именно там осталось одно из самых дорогих моих воспоминаний.","Я фотографировал Таисию.","Она стояла возле моря.","И улыбалась.","Я смотрел на неё и радовался.","Не потому, что происходило что-то необыкновенное.","А потому, что она была счастлива.","Мне нравилось видеть её такой.","Нравилось понимать, что мы всё-таки приехали.","Что я не остался дома.","Что не позволил своей нерешительности лишить нас этой поездки.","Она улыбалась, а я фотографировал её и старался никак не показывать, что чувствую.","Наверное, именно тогда во мне появилось то желание, которое позже станет одной из главных частей моей любви к Таисии.","Желание видеть её счастливой.","Не обязательно из-за меня.","Не обязательно благодаря каким-то дорогим подаркам.","Просто видеть её улыбку.","Знать, что в этот момент ей хорошо.","Позже я буду стараться смешить её после тяжёлых рабочих смен.","Буду покупать подарки, даже когда с деньгами всё плохо.","Буду искать возможности приехать, чтобы провести рядом хотя бы немного времени.","Но тогда всего этого ещё не было.","Было холодное море.","Была Таисия.","Была фотография.","И был я — человек, который уже начинал влюбляться, но отчаянно пытался убедить себя в обратном.","","Наши дни в Анапе прошли.","Мы вернулись в Краснодар.","К привычной жизни.","К работе.","К обычным делам.","К городу, в котором всё началось.","Только вот для меня кое-что изменилось.","Я уже не мог воспринимать Таисию исключительно как друга.","Сколько бы ни пытался.","Сколько бы ни убеждал себя, что ничего особенного не происходит.","После Анапы мои чувства стали другими.","Наверное, я влюбился ещё раньше.","Может быть, в один из тех дней, когда ехал к ней через весь Краснодар.","Может быть, когда впервые понял, насколько мне нравится её искренность.","А может, именно на том холодном берегу, когда фотографировал её возле моря.","Я не знаю.","У любви редко бывает точная дата начала.","Ты просто однажды замечаешь, что человек стал для тебя гораздо важнее, чем ты собирался ему позволить.","И тогда начинаешь бояться.","Потому что теперь тебе есть что терять.","","Я продолжал сомневаться.","Продолжал думать, что меня могут использовать.","Продолжал искать причины не доверять происходящему.","И, конечно, продолжал вести себя как идиот.","Сейчас мне легко признавать это.","Тогда — нет.","Тогда я искренне верил, что, скрывая свои чувства, защищаю себя.","Я не понимал одной простой вещи.","Иногда, пытаясь не позволить другому человеку причинить тебе боль, ты сам начинаешь причинять боль ему.","Своей холодностью.","Своим молчанием.","Своим нежеланием сказать то, что действительно чувствуешь.","Я не знал, что ждёт нас впереди.","Не знал, что совсем скоро мы примем ещё одно совершенно неожиданное решение.","Решение, к которому я не был готов.","Решение, которое изменит наши отношения гораздо сильнее, чем поездка к морю.","Мы решим жить вместе.","Всего через месяц.","И тогда я окончательно пойму, что Таисия — человек, рядом с которым моя жизнь больше никогда не будет предсказуемой.","Она была похожа на поезд, который мчится вперёд, не собираясь останавливаться.","А я…","Я был пассажиром, который сел в него, ещё не зная конечной станции.","И почему-то совершенно не хотел выходить.","","Конец первых двух глав.","Продолжение — глава 3 «Поезд, у которого не было остановок». В ней начнётся ваша первая совместная жизнь: квартира в Краснодаре, первые серьёзные ошибки, её уход к другому человеку и тот самый звонок в дверь, после которого ты впервые почувствовал, что она вернулась к тебе.","","","История любви, которая каждый раз начиналась заново","ЧАСТЬ I","КОГДА ВСЁ ТОЛЬКО НАЧИНАЛОСЬ","Глава 3. Поезд, у которого не было остановок","Есть люди, которые входят в твою жизнь тихо. Осторожно открывают дверь, знакомятся с твоими привычками, постепенно становятся частью повседневности.","А есть такие, как Таисия.","Она не просто появилась в моей жизни. Она ворвалась в неё, словно ураган, перевернула всё, к чему я привык, и заставила меня совершать поступки, на которые раньше я никогда бы не решился.","И самое удивительное заключалось в том, что мне это нравилось.","Я, человек, который привык сомневаться даже в собственных чувствах, вдруг оказался рядом с девушкой, для которой спонтанность была чем-то совершенно естественным.","Мы могли неожиданно сорваться в Анапу, а спустя какое-то время принять решение, которое обычно люди обдумывают месяцами.","Мы решили съехаться.","Всего через месяц.","Даже сейчас, вспоминая это, я невольно улыбаюсь.","Месяц.","Каких-то тридцать дней, за которые два человека успели познакомиться, привыкнуть друг к другу и решить, что теперь готовы делить не только прогулки и разговоры, но и повседневную жизнь.","Я никогда раньше так не поступал.","Не представлял, что могу настолько быстро согласиться жить с девушкой.","Обычно мне требовалось время, чтобы привыкнуть к человеку, разобраться в своих чувствах, убедиться, что происходящее действительно имеет смысл.","Но с Таисией всё было иначе.","С ней словно переставали работать привычные правила.","Я мог сколько угодно убеждать себя, что нужно быть осторожнее, что нельзя торопиться, что отношения требуют времени.","А потом она появлялась со своей очередной неожиданной идеей, и все мои разумные доводы куда-то исчезали.","Меня завораживала эта непредсказуемость.","Я не знал, куда всё приведёт, но хотел узнать.","И, наверное, именно тогда окончательно перестал сопротивляться тому, что между нами происходило.","Хотя признаться себе в любви всё ещё не мог.","","Квартиру мы нашли быстро.","Настолько быстро, что я даже не успел до конца осознать происходящее.","Ещё недавно я ездил к ней через половину Краснодара, чтобы провести вместе несколько часов.","А теперь мы собирались просыпаться в одной квартире.","Видеть друг друга каждый день.","Засыпать рядом.","Возвращаться в одно и то же место.","Делить пространство, привычки, настроение и все те мелочи, о которых люди редко задумываются, пока не начинают жить вместе.","Мне казалось, что это должно быть прекрасно.","Ведь теперь не нужно было искать повод для встречи.","Не нужно тратить последние деньги на дорогу.","Не нужно прощаться и разъезжаться по разным концам города.","Она просто будет рядом.","Та самая девушка, которую я ещё недавно воспринимал как друга.","Та самая, ради которой внезапно купил билеты в Анапу.","Та самая, чья улыбка у холодного моря почему-то осталась у меня в памяти гораздо ярче многих других событий.","Теперь мы будем жить вместе.","И от одной этой мысли внутри появлялось странное, непривычное тепло.","Но, как оказалось, мечтать о совместной жизни и действительно жить вместе — совершенно разные вещи.","","Я хотел бы написать, что наша первая квартира стала местом, где мы окончательно поняли, насколько сильно любим друг друга.","Что каждое утро начиналось с объятий, каждый вечер заканчивался разговорами, а все разногласия исчезали после одного поцелуя.","Хотел бы.","Но это была бы неправда.","Наша совместная жизнь с самого начала оказалась гораздо сложнее, чем я представлял.","И значительная часть этой сложности была связана со мной.","Я по-прежнему не умел показывать чувства.","Более того, теперь, когда Таисия находилась рядом постоянно, мои страхи стали только сильнее.","Раньше я мог спрятать свою неуверенность за редкими встречами.","Мог приехать, провести с ней время, а потом уехать домой и снова оказаться в привычном мире, где никто не требовал от меня эмоциональной открытости.","Теперь такой возможности не было.","Мы жили вместе.","И каждый день мне приходилось сталкиваться с тем, чего я так долго избегал.","С близостью.","С доверием.","С необходимостью быть не просто человеком, который иногда приезжает, а человеком, который действительно присутствует в жизни другого.","Я не справлялся.","Вместо того чтобы становиться ближе, я порой отталкивал её.","Вместо того чтобы говорить, что мне хорошо рядом с ней, мог вести себя так, словно совершенно не ценю происходящее.","Вместо нежности — холодность.","Вместо признаний — молчание.","Вместо уверенности в наших отношениях — бесконечные сомнения.","Я боялся поверить, что всё это настоящее.","Что девушка, которая мне так нравится, действительно решила жить со мной.","Что я могу быть кому-то нужен.","Что меня могут выбрать не на один вечер, не на несколько встреч, а для чего-то большего.","И этот страх постепенно превращался в поведение, за которое мне потом будет стыдно.","Я был рядом с человеком, которого начинал любить всё сильнее.","Но вёл себя так, будто пытался доказать обратное.","","Сейчас я часто думаю о той квартире.","О наших первых днях.","О том, какими мы тогда были.","Наверное, если бы мне дали возможность вернуться назад, я не стал бы искать красивые слова или придумывать невероятные романтические поступки.","Я просто постарался бы быть внимательнее.","Чаще слушать.","Меньше сомневаться.","Не воспринимать присутствие Таисии как что-то, что теперь никуда не исчезнет.","И самое главное — перестал бы прятать любовь за равнодушием.","Но тогда я ещё не понимал, насколько дорогой может оказаться такая ошибка.","Мне казалось, что впереди у нас достаточно времени.","Что мы постепенно привыкнем друг к другу.","Что всё само собой станет лучше.","Однако отношения не становятся крепче только потому, что два человека живут под одной крышей.","Иногда совместная жизнь лишь отчётливее показывает всё, с чем каждый из них пришёл в эти отношения.","Свои страхи.","Свою неуверенность.","Свои обиды.","Своё прошлое.","И если обо всём этом молчать, однажды между двумя людьми может появиться расстояние, которое не измерить километрами.","Мы находились рядом.","Но далеко не всегда были близки.","","Я не хочу делать вид, что во всём происходившем виноват только я.","Отношения всегда складываются из поступков двух людей.","У каждого есть собственные чувства, ожидания, переживания и ошибки.","Но я могу отвечать только за себя.","И свои ошибки я помню.","Помню, что не ценил многие моменты.","Что не показывал того, что чувствовал.","Что позволял страхам влиять на моё отношение к девушке, которая стала мне дорога.","А ещё помню, что, несмотря на всю странность нашей первой совместной жизни, она оставила после себя удивительно тёплые воспоминания.","Наверное, в этом и заключается одна из особенностей любви.","Иногда ты вспоминаешь период, который был далеко не самым счастливым, и всё равно чувствуешь тепло.","Не потому, что забыл плохое.","А потому, что среди всех сложностей там был человек, которого ты любил.","И даже обычная квартира спустя время превращается в место, где осталась часть твоей жизни.","Нашей жизни.","","Постепенно я начал замечать, что что-то идёт не так.","Таисия стала пропадать.","Я не всегда понимал, где она и что происходит.","Между нами появлялось всё больше непонятного.","А потом я узнал, что в её жизни появился другой парень.","Наверное, существуют новости, к которым невозможно подготовиться.","Даже если отношения уже переживают трудный период.","Даже если ты чувствуешь, что человек отдаляется.","Даже если заранее пытаешься убедить себя, что всё может закончиться.","Всё равно в какой-то момент ты узнаёшь правду, и внутри что-то неприятно обрывается.","Я не знал, как правильно реагировать.","Злился ли я?","Да.","Было ли мне больно?","Конечно.","Но сильнее всего меня мучили вопросы.","Я потерял её из-за собственного поведения?","Или всё произошло бы независимо от того, каким я был?","Мог ли я что-то изменить?","И если мог, почему не сделал этого раньше?","Ответов у меня не было.","Была только неприятная смесь обиды, разочарования и чувства собственной глупости.","Я понимал, что сам немало сделал для того, чтобы наши отношения стали сложными.","Но от этого происходящее не становилось менее болезненным.","Наоборот.","Боль смешивалась с сожалением.","Я вспоминал моменты, когда мог проявить больше нежности.","Когда мог сказать что-нибудь хорошее.","Когда мог просто обнять её.","И каждый раз думал о том, что теперь, возможно, уже слишком поздно.","","Но показывать всё это я не собирался.","Конечно же.","Ведь я был тем самым человеком, который считал, что чувства лучше держать внутри.","Что не стоит показывать слабость.","Что если тебе больно, нужно сделать невозмутимое лицо и продолжать жить.","Я не говорил Таисии, насколько сильно меня задело происходящее.","Не объяснял, что чувствую.","Не признавался, как страшно мне становится от мысли, что она может окончательно уйти.","Я снова выбирал молчание.","И снова думал, что поступаю правильно.","Она ушла к тому парню.","А я остался.","В квартире, которая ещё совсем недавно казалась началом чего-то большого.","Я не знал, закончилось ли всё окончательно.","Не знал, что будет дальше.","Наверное, какая-то часть меня пыталась убедить себя, что нужно просто принять произошедшее.","Но другая часть уже понимала то, в чём я так долго боялся признаться.","Я влюбился.","По-настоящему.","И мысль о том, что Таисия больше не будет рядом, причиняла гораздо больше боли, чем я был готов показать.","","Иногда мне кажется, что самые важные признания человек делает не вслух.","Он может сколько угодно отрицать свои чувства перед другими.","Может говорить, что всё нормально.","Может изображать равнодушие.","Но когда остаётся один, обмануть самого себя становится намного сложнее.","Я не хотел терять Таисию.","Не хотел, чтобы наша история закончилась так быстро.","Не хотел, чтобы всё, что между нами происходило, осталось только воспоминанием о спонтанной поездке к морю и нескольких месяцах странной совместной жизни.","Но она ушла.","И я ничего не мог с этим сделать.","По крайней мере, так мне тогда казалось.","Я ещё не знал, что очень скоро услышу звук, который запомню надолго.","Обычный звонок в дверь.","Звук, который в другой день не значил бы совершенно ничего.","Но именно тогда он изменил всё.","","Глава 4. Когда она вернулась","Есть мгновения, которые невозможно заранее представить.","Ты можешь сколько угодно прокручивать в голове разные варианты развития событий.","Думать о том, что скажешь человеку при встрече.","Представлять, как будешь себя вести.","Убеждать себя, что больше не позволишь ему приблизиться.","А потом раздаётся звонок в дверь.","И все заранее придуманные слова исчезают.","","Она вернулась.","Просто появилась снова.","После того как ушла к другому парню.","После моего молчания.","После обиды, которую я пытался спрятать настолько глубоко, насколько вообще возможно.","После всех мыслей о том, что, наверное, я сам разрушил то, что между нами начиналось.","Я услышал звонок.","И увидел Таисию.","Она пришла ко мне.","Вернулась, чтобы остаться и лечь спать.","Даже сейчас мне трудно передать словами, что я почувствовал в тот момент.","Это была не просто радость.","Не обычное облегчение от того, что неприятная ситуация наконец закончилась.","Внутри словно одновременно исчезли десятки тяжёлых мыслей.","Она здесь.","Снова рядом.","Не где-то с другим человеком.","Не в неизвестности.","А здесь.","В нашей квартире.","Со мной.","Боже, как же я был счастлив.","Наверное, до того момента я ещё никогда не испытывал настолько сильного облегчения из-за возвращения человека.","Но самое странное заключалось в том, что снаружи я почти ничего не показал.","","Можно подумать, что после такого события я должен был наконец измениться.","Обнять её.","Рассказать, как сильно переживал.","Признаться, что боялся больше никогда не увидеть.","Сказать, что она мне нужна.","Что мне больно было её терять.","Что я хочу попробовать всё заново, но уже иначе.","Наверное, это было бы правильно.","Но я снова остался собой.","Тем самым парнем, который умеет чувствовать гораздо больше, чем способен показать.","Я радовался её возвращению.","И одновременно не мог забыть, что произошло.","Доверие оказалось подорвано.","Внутри сидел страх, что всё может повториться.","Что однажды она снова уйдёт.","Что я позволю себе окончательно поверить в наши отношения, а потом снова окажусь один.","Поэтому вместо того, чтобы открыться, я продолжал держать дистанцию.","Не всегда ценил её присутствие.","Не всегда правильно реагировал.","Не всегда давал понять, насколько сильно хотел, чтобы она осталась.","Сейчас мне особенно тяжело вспоминать именно это.","Не сам факт её ухода.","Не другого парня.","А собственную неспособность сказать простые слова.","«Я рад, что ты вернулась».","«Я скучал».","«Ты мне очень нужна».","Всё это я чувствовал.","Но почему-то считал, что лучше промолчать.","","После её возвращения между нами начали складываться отношения.","Уже не просто дружба.","Не непонятное общение двух людей, которые вроде бы нравятся друг другу, но боятся это признать.","Мы постепенно становились парой.","И для меня это было чем-то совершенно новым.","Я начал учиться доверять.","Не сразу.","Не без ошибок.","Не без внутреннего сопротивления.","Иногда страхи возвращались.","Иногда я снова сомневался.","Иногда вспоминал, как она уходила, и понимал, что полностью забыть произошедшее пока не получается.","Но теперь у меня появилось желание меняться.","Раньше я словно постоянно искал причины, по которым отношения могут не получиться.","Теперь всё чаще думал о том, что должен сделать, чтобы они получились.","Разница огромная.","В первом случае ты заранее готовишься к поражению.","Во втором — впервые позволяешь себе надеяться.","И я начал надеяться.","На нас.","На то, что всё плохое осталось позади.","На то, что однажды смогу перестать бояться и просто любить её.","","Возможно, именно после возвращения Таисии я окончательно осознал глубину собственных чувств.","Пока человек находится рядом, иногда кажется, что так будет всегда.","Ты привыкаешь к его присутствию.","К голосу.","К привычкам.","К тому, что можешь увидеть его завтра.","И только когда он исчезает, вдруг понимаешь, какое место занимал в твоей жизни.","Я успел почувствовать это.","Пусть ненадолго.","Пусть наша история тогда ещё только начиналась.","Но мне хватило.","Когда Таисия ушла, я понял, насколько сильно не хочу её терять.","А когда вернулась — насколько сильно хочу, чтобы она осталась.","И теперь мне предстояло научиться тому, чего я прежде почти не умел.","Быть человеком, который не только любит, но и показывает свою любовь.","","Я не изменился за один день.","Наверное, такие вещи вообще не происходят мгновенно.","Нельзя годами прятать чувства, а потом однажды проснуться совершенно другим человеком.","Ты всё равно будешь ошибаться.","Иногда замыкаться.","Иногда говорить не то.","Иногда слишком поздно понимать, что близкому человеку нужна была не твоя невозмутимость, а обычная нежность.","Но я начал стараться.","Потихоньку.","Шаг за шагом.","И мне казалось, что у нас действительно есть шанс.","Ведь теперь мы были вместе.","Она вернулась ко мне.","А я, несмотря на всё произошедшее, хотел быть с ней.","Мне хотелось верить, что дальше станет легче.","Что мы научимся понимать друг друга.","Что сможем построить что-нибудь настоящее.","Но наша история никогда не развивалась по спокойному сценарию.","Едва я начал привыкать к мысли, что Таисия рядом, как в её жизни появилась новая цель.","Она захотела уехать.","Работать на сезон.","И снова всё, во что я только начал верить, оказалось под угрозой.","","Когда я впервые услышал о её планах, внутри поднялось неприятное чувство.","Страх.","Причём знакомый.","Я уже сталкивался с ситуацией, когда девушка уезжает работать на сезон.","И вот теперь история словно повторялась.","Только на этот раз речь шла о Таисии.","О человеке, которого я уже любил.","Я боялся расстояния.","Боялся, что мы начнём отдаляться.","Боялся, что без ежедневных встреч между нами снова появится что-то непонятное.","И сильнее всего боялся, что однажды она просто перестанет нуждаться во мне.","Но одновременно я видел, насколько для неё важна эта поездка.","У неё появилась цель.","Желание попробовать что-то новое.","Возможность двигаться туда, куда ей хотелось.","И кто я такой, чтобы запрещать ей это?","Я не хотел становиться человеком, который удерживает любимую девушку рядом только потому, что сам боится остаться один.","Не хотел мешать её мечтам.","Не хотел, чтобы однажды она посмотрела на меня и подумала, что отказалась от важной возможности ради моих страхов.","Я должен был поддержать её.","По крайней мере, именно так мне казалось.","И я поддержал.","Вот только снова сделал это единственным известным мне способом.","С невозмутимым лицом.","С уверенными словами.","С видом человека, который совершенно спокойно относится к предстоящему расставанию на расстоянии.","А внутри меня в этот момент происходило нечто совершенно другое.","","Глава 5. Два демона внутри меня","Я никогда не умел красиво прощаться.","Особенно с людьми, которых не хотел отпускать.","Мне всегда казалось, что если ты покажешь, насколько тебе тяжело, то обязательно сделаешь человеку ещё больнее.","Заставишь чувствовать вину.","Начнёшь мешать его планам.","Поэтому я предпочитал улыбаться, говорить, что всё будет хорошо, и делать вид, будто совершенно не переживаю.","С Таисией я поступил точно так же.","И позже ещё долго жалел об этом.","","Она собиралась уезжать работать на сезон.","Для неё это было новым этапом.","Возможностью двигаться вперёд.","Целью, которая внезапно появилась в её жизни и которую она хотела осуществить.","Я понимал это.","Понимал, что не имею права решать за неё.","Что любовь не должна превращаться в запреты.","Что если человек чего-то действительно хочет, нельзя удерживать его только из-за собственного страха.","Все эти мысли казались правильными.","Разумными.","Взрослыми.","Вот только сердце совершенно не собиралось с ними соглашаться.","Я не хотел, чтобы она уезжала.","Совсем.","Мне хотелось просыпаться рядом.","Видеть её после работы.","Слушать рассказы о прошедшем дне.","Иногда ссориться из-за какой-нибудь ерунды, а потом снова мириться.","Просто жить вместе.","После всего, через что мы уже успели пройти, я особенно сильно хотел обычного спокойствия.","Хотел наконец почувствовать, что любимый человек рядом и никуда не собирается исчезать.","Но вместо этого нам снова предстояло расстаться.","На этот раз не из-за другого парня.","Не из-за ссоры.","Не из-за непонимания.","А из-за расстояния.","И я боялся его едва ли не сильнее всего остального.","","Внутри меня словно спорили два демона.","Один кричал, что я должен остановить её.","Сказать, как сильно люблю.","Признаться, что мне страшно.","Попросить остаться.","Объяснить, что я только начал учиться доверять ей и совершенно не готов снова оказаться далеко.","Этот голос становился особенно громким, когда я представлял, как она уедет.","Как вместо встреч останутся сообщения.","Как я больше не смогу просто подойти и обнять её.","Как между нами появятся километры, рабочие смены, усталость и совершенно разные распорядки дня.","Но второй голос говорил другое.","Он напоминал, что Таисия — отдельный человек.","Со своими мечтами.","Со своими желаниями.","Со своей жизнью.","И что я не должен превращать любовь в причину, по которой она откажется от собственных целей.","Я слушал обоих.","И не понимал, кто из них прав.","Наверное, мне следовало просто поговорить с ней.","Рассказать, что я чувствую.","Не запрещать.","Не требовать.","Не пытаться вызвать жалость.","А честно сказать:","«Я понимаю, что тебе нужно ехать. Я поддерживаю тебя. Но мне очень страшно тебя отпускать, потому что я люблю тебя и не хочу потерять».","Сейчас эти слова кажутся такими простыми.","Тогда произнести их было невероятно трудно.","Поэтому я не сказал ничего подобного.","","Я провожал её с невозмутимым лицом.","Подбадривал.","Говорил, что всё будет хорошо.","Старался вести себя так, будто впереди нас ждёт совершенно обычный период, который мы легко переживём.","Наверное, со стороны я действительно выглядел спокойным.","Возможно, даже слишком.","Я не знаю, что Таисия чувствовала в тот момент.","Не знаю, хотелось ли ей услышать от меня что-то другое.","Но знаю одно: она не могла увидеть всего, что происходило у меня внутри.","Потому что я этого не показывал.","Она видела парня, который спокойно отпускает её.","А внутри этого парня шла настоящая война.","Мне хотелось остановить время.","Сделать так, чтобы отъезд не наступал.","Чтобы у нас оставалось ещё немного дней вместе.","Ещё несколько вечеров.","Ещё несколько утренних разговоров.","Ещё хотя бы одна возможность просто побыть рядом, не думая о предстоящем расстоянии.","Но время не останавливалось.","И Таисия уехала.","","Наверное, в тот день я совершил одну из самых болезненных ошибок наших отношений.","Не потому, что позволил ей уехать.","Я по-прежнему считаю, что не должен был запрещать ей двигаться к своей цели.","Моя ошибка заключалась в другом.","Я снова не сказал правду.","Снова решил, что любимому человеку не обязательно знать, насколько сильно я переживаю.","Снова спрятался за образом мужчины, который должен всё выдержать.","Я думал, что поступаю правильно.","Что моя поддержка должна выглядеть именно так.","Что если я не стану показывать страх, ей будет легче.","Но любовь не всегда нуждается в человеке, который делает вид, будто ничего не чувствует.","Иногда ей нужен тот, кто способен признаться:","«Мне будет тебя не хватать».","Я понял это слишком поздно.","","Когда она уехала, привычная жизнь изменилась.","Теперь нельзя было просто увидеться.","Нельзя было спонтанно провести вечер вместе.","Нельзя было обнять её после тяжёлого дня.","Между нами появилось расстояние.","И с ним пришло то, чего я так боялся.","Ожидание.","Я начал жить от возможности до возможности.","От сообщения до сообщения.","От звонка до звонка.","От одной потенциальной встречи до следующей.","Но при этом я уже знал, что не хочу сдаваться.","Если раньше при первых трудностях я мог замкнуться и начать сомневаться во всём происходящем, то теперь внутри появилось другое чувство.","Решимость.","Я любил Таисию.","И собирался её дождаться.","Не просто сидеть дома и ждать, пока закончится сезон.","А искать возможности приезжать.","Работать.","Зарабатывать.","Делать всё, что в моих силах, чтобы расстояние не стало концом нашей истории.","Я не знал, насколько сложно это окажется.","Не представлял, сколько раз буду чувствовать бессилие.","Сколько раз стану смотреть на телефон, ожидая сообщения.","Сколько раз поймаю себя на мысли, что ужасно хочу оказаться рядом, но совершенно не могу ничего изменить.","Но решение уже было принято.","Я буду ждать.","Потому что впервые в жизни мне казалось, что есть человек, ради которого ожидание имеет смысл.","","Тогда я ещё верил, что любовь способна победить расстояние, если достаточно сильно стараться.","Что главное — не сдаваться.","Что если я буду работать, приезжать, поддерживать её и постепенно учиться показывать чувства, то всё обязательно получится.","Я ещё не понимал, что иногда два человека могут любить друг друга и при этом совершенно по-разному переживать разлуку.","Что одному нужны постоянные разговоры, а другой настолько устаёт на работе, что у него просто не остаётся сил.","Что молчание может означать усталость, но восприниматься как равнодушие.","Что страх потерять человека иногда заставляет вести себя именно так, как не следовало бы.","И что километры между двумя людьми — это не только расстояние на карте.","Иногда они превращаются в недосказанные слова.","В непрочитанные сообщения.","В ревность.","В обиду.","В одиночество.","И в бесконечное желание услышать простое:","«Я тоже скучаю».","Но всё это было впереди.","Пока же я только учился жить без неё рядом.","И впервые за долгое время перестал думать исключительно о том, как защитить себя от любви.","Теперь я думал о другом.","Как эту любовь сохранить.","","Глава 6. Между нами — километры","Расстояние странно меняет отношения.","Когда любимый человек рядом, ты не всегда замечаешь, насколько важны самые обычные вещи.","Возможность посмотреть ему в глаза.","Услышать смех не через телефон.","Прикоснуться.","Обнять.","Увидеть настроение ещё до того, как он что-нибудь скажет.","Кажется, что всё это мелочи.","Но стоит оказаться далеко друг от друга, и именно этих мелочей начинает не хватать сильнее всего.","Я постепенно узнавал это на собственном опыте.","","После отъезда Таисии мы продолжали общаться.","Переписывались.","Созванивались, когда получалось.","Рассказывали друг другу о происходящем.","Но наша жизнь теперь проходила в совершенно разных условиях.","Она работала.","Много.","Иногда настолько много, что работа забирала практически все силы.","Её дни были заполнены обязанностями, усталостью, рабочими проблемами и необходимостью хотя бы иногда отдыхать.","А я оставался далеко.","И пытался найти своё место в её новой повседневности.","Это оказалось непросто.","Я понимал, что Таисия не может постоянно находиться на связи.","Понимал, что после тяжёлой смены человеку порой хочется просто отдохнуть.","Понимал, что нельзя требовать внимания каждую минуту.","Но понимание не отменяло чувств.","Мне всё равно было грустно.","Всё равно хотелось разговаривать чаще.","Всё равно не хватало её присутствия.","И временами я совершенно не знал, что делать с этой тоской.","","Сначала я продолжал вести себя привычным образом.","Старался быть спокойным.","Не жаловаться.","Не показывать, насколько тяжело переживаю разлуку.","Когда возникали сложности, говорил, что всё нормально.","Когда что-то расстраивало, пытался справиться самостоятельно.","Когда скучал, не всегда признавался в этом.","Но постепенно начал меняться.","Мне всё чаще хотелось говорить о чувствах.","Хотелось, чтобы Таисия знала: я действительно люблю её.","Что её отъезд не сделал мои чувства слабее.","Что я не просто жду окончания сезона из привычки.","Я жду именно её.","И по мере того как учился открываться, начал замечать то, чего раньше словно не позволял себе видеть.","Меня тоже любили.","По крайней мере, в наших отношениях были моменты, которые давали мне это почувствовать.","И это стало для меня очень важным открытием.","Ведь прежде я настолько боялся оказаться ненужным, что порой даже не замечал хорошего.","Теперь мне хотелось отвечать на любовь любовью.","Не прятать её.","Не изображать равнодушие.","А показывать.","Пусть не всегда получалось.","Пусть иногда я снова ошибался.","Но я старался.","","Конечно, расстояние не делало нас идеальной парой.","Мы ссорились.","Иногда из-за мелочей.","Иногда из-за недопонимания.","Иногда просто потому, что оба уставали от обстоятельств, которые не могли изменить.","Бывало, что мне хотелось больше внимания, а у неё не оставалось сил.","Бывало, что её занятость заставляла меня чувствовать себя ненужным, хотя я понимал, насколько тяжело она работает.","Бывало, что я начинал переживать, но снова предпочитал молчать.","Мне казалось, что так я проявляю заботу.","Не давлю.","Не требую.","Не добавляю ей проблем.","Но иногда за этим молчанием скрывалось настоящее одиночество.","Я мог целый день думать о том, как сильно хочу её увидеть.","Представлять, что сказал бы при встрече.","Вспоминать наши дни в Краснодаре.","А потом получать возможность немного пообщаться и снова говорить, что у меня всё хорошо.","Хотя далеко не всегда было хорошо.","","Деньги стали ещё одной частью этой истории.","Чтобы приезжать к Таисии, нужно было зарабатывать.","А возможности не всегда совпадали с желаниями.","Я старался работать.","Восстанавливать своё финансовое положение.","Решать проблемы.","Искать способы выделить деньги на дорогу и совместное время.","Для меня каждая такая поездка значила гораздо больше, чем обычный отдых.","Я ехал не ради смены обстановки.","Не ради красивых мест.","Не ради развлечений.","Я ехал к ней.","И всё остальное становилось второстепенным.","Иногда приходилось долго ждать следующей возможности.","Иногда казалось, что деньги появляются слишком медленно, а время проходит слишком быстро.","Я смотрел на нашу жизнь и понимал, что не могу убрать расстояние одним желанием.","Не могу просто оказаться рядом, когда захочу.","Не могу решить все проблемы сразу.","Это чувство беспомощности постепенно становилось для меня всё более тяжёлым.","Но я продолжал стараться.","Потому что знал, ради чего.","","Летом мне наконец удалось начать приезжать.","Не так часто, как хотелось.","Не настолько регулярно, чтобы расстояние перестало ощущаться.","Но всё-таки приезжать.","И каждая встреча становилась маленьким праздником.","Мы снимали квартиры, чтобы провести время вместе.","И я был счастлив.","По-настоящему.","Даже если мы иногда ссорились.","Даже если не всё проходило идеально.","Даже если после долгого ожидания вдруг возникало какое-нибудь недопонимание.","Мне было достаточно того, что она рядом.","Я мог видеть её глаза.","Её улыбку.","Слышать смех.","Замечать, когда она грустит.","Видеть её настоящую, живую, со всеми эмоциями, которые так сильно полюбил.","Я больше не хотел идеальную девушку.","Не хотел, чтобы она всегда улыбалась и никогда не злилась.","Мне нравилась именно Таисия.","Со своим характером.","Со своими переживаниями.","Со своей усталостью.","Со своими резкими реакциями.","С тем самым криком, который иногда мог свести меня с ума, а иногда почему-то казался невероятно родным.","Мне нравилось всё, что делало её ею.","","Особенно сильно я любил моменты, когда удавалось её рассмешить.","После тяжёлых рабочих дней Таисия часто уставала.","Я видел это.","Понимал, сколько сил у неё забирает работа.","И мне хотелось хотя бы ненадолго сделать её жизнь легче.","Не обязательно решить какую-то огромную проблему.","Не обязательно совершить невероятный поступок.","Иногда мне просто хотелось сказать что-нибудь смешное и увидеть, как она улыбается.","И когда это получалось, внутри становилось удивительно хорошо.","Постепенно её улыбка превратилась для меня в отдельную маленькую цель.","Я начал думать о том, чем могу её порадовать.","Какой сюрприз сделать.","Что подарить.","Как поднять настроение.","Мне хотелось, чтобы рядом со мной она хотя бы иногда могла забыть об усталости.","Чтобы после тяжёлого дня у неё появлялся повод посмеяться.","Чтобы среди бесконечных рабочих забот находилось место чему-то тёплому.","Наверное, именно тогда во мне начал просыпаться тот романтик, которым я совершенно не был в начале нашей истории.","Тот самый парень, который раньше не умел сказать девушке, что она красивая, теперь хотел придумывать способы увидеть её счастливой.","И всё это происходило благодаря Таисии.","","Но у каждой нашей встречи был один недостаток.","Она заканчивалась.","Рано или поздно наступал момент, когда нужно было снова разъезжаться.","Возвращаться к работе.","К расстоянию.","К телефонам вместо объятий.","И сколько бы раз это ни происходило, привыкнуть было невозможно.","Наверное, потому что после каждой встречи я ещё сильнее убеждался в том, насколько люблю её.","Мне становилось всё труднее принимать жизнь, в которой мы не могли просто быть рядом.","Я работал, чтобы приехать.","Приезжал, чтобы увидеть её.","Уезжал и снова начинал работать.","И постепенно этот круг превратился в значительную часть моей жизни.","Я не жалел о деньгах, которые тратил на поездки.","Не жалел о времени.","Не жалел о силах.","Но всё чаще чувствовал, что мы словно живём от встречи до встречи, а между ними пытаемся сохранить то, что так легко получается, когда мы рядом.","","Я любил Таисию всё сильнее.","И вместе с любовью рос страх.","Страх потерять.","Страх, что расстояние однажды окажется сильнее нас.","Страх, что она привыкнет жить без меня.","Что её дни постепенно заполнятся другими людьми, другими заботами, другими событиями.","А я останусь где-то далеко.","Человеком в телефоне.","Человеком, который обещает приехать, когда заработает.","Человеком, который любит, но не всегда может оказаться рядом.","Поначалу эти мысли появлялись редко.","Потом всё чаще.","И однажды я заметил, что начал думать о возможной потере почти постоянно.","Я настолько сильно боялся будущего, в котором Таисии больше не будет рядом, что постепенно переставал замечать настоящее.","Переставал просто радоваться тому, что мы всё ещё вместе.","Что можем разговаривать.","Что у нас бывают счастливые встречи.","Что она всё ещё часть моей жизни.","Вместо этого я всё чаще думал:","«А что, если однажды она уйдёт?»","И чем сильнее любил, тем страшнее становилось.","","Тогда я ещё не понимал, насколько опасным может быть этот страх.","Мне казалось, что он лишь доказывает глубину моих чувств.","Что если я настолько боюсь потерять человека, значит, действительно люблю его.","Но постепенно страх начал занимать слишком много места.","Он заставлял ревновать.","Додумывать.","Переживать.","Искать признаки того, что между нами что-то меняется.","Я продолжал работать.","Продолжал стараться.","Продолжал говорить себе, что всё обязательно наладится.","Но внутри становилось всё тяжелее.","А потом наступил период, когда трудности начали накапливаться одна за другой.","Работа забирала силы.","Расстояние никуда не исчезало.","Общения становилось меньше.","И я впервые за долгое время почувствовал, что больше не справляюсь.","Мне хотелось поддержки.","Хотелось рассказать Таисии, насколько тяжело мне бывает.","Впервые не изображать человека, который способен выдержать абсолютно всё.","А просто признаться:","«Мне плохо».","Я не знал, что этот разговор станет началом одного из самых болезненных периодов нашей истории.","И что совсем скоро услышу слова, после которых привычный мир словно перестанет существовать.","","Продолжение: глава 7 «Ну бывает».","В ней начнётся первое большое расставание: момент, когда Артём впервые решится открыто рассказать о своей боли, услышит короткий ответ, а спустя несколько дней узнает, что Таисии понравился другой парень.","ЧАСТЬ II","ЛЮБОВЬ НА РАССТОЯНИИ","Глава 7. «Ну бывает»","Есть слова, которые остаются с тобой надолго.","Не обязательно громкие. Не обязательно жестокие. Иногда человек произносит всего два слова, даже не подозревая, какой след они оставят в чужой душе.","И самое страшное, что для него это может быть обычный ответ.","А для тебя — момент, когда внутри что-то ломается.","Я помню эти два слова.","До сих пор.","«Ну бывает».","","К тому времени наша жизнь окончательно превратилась в бесконечную попытку победить расстояние.","Таисия работала практически постоянно. Её дни были заполнены сменами, усталостью, рабочими проблемами и редкими возможностями отдохнуть.","Я тоже работал.","Старался зарабатывать больше, чтобы приезжать к ней, чтобы мы могли снимать квартиры, проводить время вместе и хотя бы ненадолго забывать, что живём далеко друг от друга.","Постепенно я начал замечать, что вся моя жизнь словно подчиняется одной цели.","Заработать.","Приехать.","Увидеть её.","Обнять.","Провести вместе несколько счастливых дней.","А потом снова уехать.","И начать всё сначала.","Раньше я не представлял, что могу настолько сильно привязаться к человеку.","Я, который когда-то боялся даже показать симпатию, теперь был готов работать сколько потребуется, лишь бы снова увидеть её.","Но у такой жизни была обратная сторона.","Мы оба уставали.","Она — от бесконечной работы.","Я — от попыток заработать, от финансовых трудностей, от постоянного ожидания.","У нас оставалось всё меньше времени друг для друга.","Иногда мы почти не общались.","Не потому, что я перестал её любить.","И не обязательно потому, что она больше не хотела разговаривать со мной.","Просто обстоятельства постепенно забирали у нас возможность быть рядом.","Но сердце не всегда способно спокойно принять объяснение, которое понимает голова.","Я знал, что Таисия работает.","Знал, что ей тяжело.","Знал, что после смены она может хотеть отдохнуть, погулять или просто побыть без лишних разговоров.","Я старался относиться к этому с пониманием.","А внутри всё равно скучал.","","Со временем я стал замечать, что ревную.","Иногда даже тогда, когда для ревности не было понятной причины.","Мне не нравилось это чувство.","Я понимал, что оно делает меня другим.","Заставляет переживать.","Представлять неприятные варианты.","Сомневаться.","Но избавиться от него было непросто.","Всё началось со страха.","Я уже переживал момент, когда Таисия уходила к другому человеку. Помнил, насколько больно это было. Помнил её возвращение и то невероятное счастье, которое испытал, когда услышал звонок в дверь.","И теперь боялся повторения.","Боялся, что однажды она снова встретит кого-то.","Кого-то, кто будет рядом.","Кто сможет увидеть её после работы.","Кто сможет предложить погулять не через неделю, когда появятся деньги на дорогу, а прямо сейчас.","Кто не будет постоянно говорить о том, что скучает, потому что ему не придётся скучать.","Мне хотелось быть таким человеком.","Тем, кто рядом.","Но я находился далеко.","И постепенно начал ненавидеть собственную беспомощность.","","Я всё чаще думал о том, что могу её потерять.","Сначала это была просто неприятная мысль.","Потом она стала появляться почти каждый день.","А однажды я понял, что настолько сильно сосредоточился на возможном расставании, что перестал замечать хорошее.","Я боялся будущего, которого ещё не существовало.","И этим страхом отравлял настоящее.","Ведь Таисия всё ещё была в моей жизни.","Мы продолжали общаться.","Иногда виделись.","У нас оставались общие воспоминания, чувства, планы.","Но вместо того чтобы ценить это, я всё чаще представлял, как однажды всё закончится.","Наверное, я сам не заметил, когда любовь начала смешиваться с тревогой настолько сильно, что стало трудно отделить одно от другого.","Я любил её.","Безумно.","Но вместе с этим постоянно боялся.","И чем сильнее становился страх, тем больше сил уходило на попытки его скрыть.","","Потому что я всё ещё считал, что должен быть сильным.","Мужчиной.","Человеком, который способен выдержать трудности, не жалуясь.","Мне казалось, что если я расскажу Таисии обо всём, что происходит у меня внутри, то только добавлю ей проблем.","У неё и без меня было достаточно забот.","Работа.","Усталость.","Собственные переживания.","Зачем ей ещё и мои?","Поэтому я молчал.","Когда было грустно — молчал.","Когда хотелось плакать от бессилия — старался отвлечься.","Когда казалось, что я больше не могу бороться с расстоянием, убеждал себя, что нужно просто работать ещё больше.","Заработаю денег.","Приеду.","Увижу её.","И всё снова станет хорошо.","Я повторял себе это настолько часто, что постепенно перестал замечать, как сильно устал.","","А потом наступил момент, когда я больше не смог.","Я проходил через тяжёлый период.","Работа, деньги, расстояние, постоянные переживания — всё это словно навалилось одновременно.","Я чувствовал себя бесполезным.","Не потому, что ничего не делал.","Наоборот, я постоянно пытался что-то изменить.","Но мне казалось, что всех моих усилий недостаточно.","Я не мог просто взять и убрать километры между нами.","Не мог приехать в любой момент.","Не мог быть рядом, когда ей тяжело.","И всё чаще задавал себе вопрос:","«Какой от меня вообще толк, если я даже не могу оказаться рядом с любимой девушкой?»","Я постепенно замкнулся.","Стал меньше общаться.","Немного пропал.","Мне было плохо, но я не знал, как об этом говорить.","Наверное, впервые за долгое время я оказался в состоянии, когда привычная невозмутимость перестала помогать.","Я больше не чувствовал себя человеком, который способен решить любую проблему.","Я просто устал.","Устал бояться.","Устал ждать.","Устал постоянно доказывать самому себе, что справлюсь.","И мне очень хотелось, чтобы кто-нибудь это заметил.","Особенно она.","","Через некоторое время я всё-таки решился написать Таисии.","Для кого-то рассказать близкому человеку о своих переживаниях — совершенно обычная вещь.","Для меня тогда это было почти подвигом.","Я годами привыкал справляться со всем самостоятельно.","Не показывать слабость.","Не жаловаться.","Не объяснять, насколько сильно меня что-то ранит.","И вот впервые я решил отказаться от этой привычки.","Я написал ей, что мне тяжело.","Рассказал о своём состоянии.","О том, что переживаю.","О том, насколько сложно мне даётся происходящее.","Я не ждал, что она решит все мои проблемы.","Не ждал денег.","Не ждал невероятных обещаний.","Мне просто хотелось почувствовать, что я не один.","Иногда ведь достаточно услышать:","«Я понимаю, что тебе тяжело».","Или:","«Я рядом».","Даже если человек находится за сотни километров.","Особенно если он находится за сотни километров.","Я отправил сообщение.","И получил ответ.","Короткий.","Сухой.","Без тех эмоций, на которые надеялся.","«Ну бывает».","","Я долго не мог перестать думать об этих словах.","Всего два.","Возможно, Таисия была уставшей.","Возможно, у неё самой не оставалось сил на чужие переживания.","Возможно, она просто не понимала, насколько серьёзно я воспринимаю происходящее.","Я не знаю.","Но тогда я услышал в этом ответе совсем другое.","Словно мои чувства оказались чем-то незначительным.","Словно то, с чем я так долго боролся внутри себя, не заслуживало даже нескольких тёплых слов.","И самое болезненное заключалось в том, что я впервые позволил себе открыться.","Впервые перестал изображать человека, у которого всегда всё нормально.","Впервые признался, что мне плохо.","И после этого почувствовал себя ещё более одиноким.","Наверное, именно тогда я особенно остро понял, насколько сильно мне не хватает обычной человеческой близости.","Не подарков.","Не красивых слов о вечной любви.","Не громких обещаний.","А простого ощущения, что мои переживания тоже имеют значение.","Я замкнулся ещё сильнее.","И не представлял, что самое тяжёлое только начинается.","","Через два дня Таисия написала, что нам нужно расстаться.","Я смотрел на сообщение и не мог поверить.","Наверное, какая-то часть меня давно боялась именно этого.","Я представлял подобный разговор сотни раз.","Думал о том, как отреагирую.","Убеждал себя, что если такое произойдёт, то смогу выдержать.","Но когда слова о расставании появились перед глазами, вся моя подготовка оказалась бесполезной.","Мы расставались.","Снова.","Только теперь всё ощущалось иначе.","В первый раз наши отношения ещё не успели стать настолько глубокими.","Я ещё не научился открыто любить.","Не успел окончательно привыкнуть к мысли, что Таисия — мой человек.","А теперь…","Теперь я уже представлял рядом с ней своё будущее.","Я работал ради возможности приезжать.","Менялся.","Учился говорить о чувствах.","Старался стать лучше.","И вдруг всё это словно потеряло смысл.","Я не понимал, что делать.","Жизнь и без того была непростой.","А теперь из неё исчезал человек, ради которого я находил силы продолжать.","","Прошёл ещё день.","Раздался звонок.","Звонила Таисия.","Я увидел её имя и почувствовал, как внутри появилась надежда.","Возможно, она передумала.","Возможно, мы сможем поговорить.","Возможно, всё случившееся было результатом усталости, расстояния и накопившихся эмоций.","Я ответил.","И услышал:","— У меня есть две новости. Хорошая и плохая.","Я попросил начать с плохой.","Наверное, в тот момент я ещё не представлял, насколько сильно пожалею об этом разговоре.","Таисия сказала, что ей понравился другой парень.","","Есть боль, которая приходит постепенно.","Сначала ты расстраиваешься.","Потом начинаешь осознавать произошедшее.","Потом постепенно принимаешь.","А есть боль, которая словно обрушивается на тебя целиком.","Без предупреждения.","Без возможности подготовиться.","Именно такую я почувствовал тогда.","Она сказала, что ей понравился другой.","А я словно на несколько мгновений перестал понимать, что происходит.","В голове вспыхнули все мои страхи.","Все мысли, которые я так долго пытался отогнать.","Всё, чего боялся с момента её отъезда.","Оно случилось.","Я боялся, что расстояние приведёт к тому, что рядом с ней появится другой человек.","И теперь услышал об этом от неё самой.","Мне было больно.","Я злился.","На обстоятельства.","На расстояние.","На себя.","На всё происходящее.","Я чувствовал себя разбитым.","И одновременно совершенно бессильным.","Что я мог сказать?","Что я столько работал ради наших встреч?","Что всё это время ждал?","Что пытался меняться?","Что любил её настолько сильно, что иногда забывал о собственной жизни?","Но разве такие слова способны заставить человека чувствовать то, чего он уже не чувствует?","Я не знал.","Я вообще ничего тогда не знал.","Кроме одного.","Мне было невыносимо больно.","","Мы попрощались.","И на этом закончился один из самых важных этапов наших отношений.","Я остался один.","С работой.","С проблемами.","С воспоминаниями.","И с любовью, которой теперь словно некуда было деваться.","Самое странное заключалось в том, что мои чувства никуда не исчезли.","Мы расстались.","Таисии понравился другой парень.","Я понимал, что должен принять происходящее.","Но продолжал любить её.","Всё так же сильно.","Возможно, даже сильнее — потому что теперь к любви добавилась потеря.","Я ещё не знал, что вскоре начну писать ей письма.","Что буду посвящать ей песни.","Что стану разговаривать с ней в собственных заметках.","Что однажды начну пить дома в одиночестве, пытаясь хотя бы ненадолго перестать чувствовать эту боль.","И уж точно не представлял, что спустя некоторое время снова услышу её голос и узнаю, что она приезжает в Краснодар.","Пока же наша история казалась законченной.","А я впервые по-настоящему столкнулся с вопросом, на который не мог найти ответа.","Как перестать любить человека, если сердце совершенно не согласно с тем, что всё закончилось?","","Глава 8. Человек, которого нельзя забыть","После расставания мир не останавливается.","Это, наверное, одна из самых несправедливых его особенностей.","Ты можешь чувствовать, что внутри всё разрушилось.","Что привычная жизнь потеряла смысл.","Что человек, с которым было связано столько планов, больше не принадлежит твоему будущему.","А вокруг ничего не меняется.","Люди продолжают ходить на работу.","Машины ездят по улицам.","В магазинах включают музыку.","Кто-то смеётся.","Кто-то строит планы на выходные.","Кто-то влюбляется.","И только ты никак не можешь понять, почему всё продолжается, если для тебя произошло что-то настолько страшное.","","После нашего расставания я продолжал видеть жизнь Таисии.","Не рядом.","Не лично.","Через телефон.","Через её истории.","Через фотографии и короткие моменты, которыми она делилась.","Она гуляла.","Каталась на квадроциклах.","Проводила время.","И, судя по тому, что я видел, в её жизни продолжали происходить счастливые события.","Я смотрел на это и испытывал совершенно противоречивые чувства.","С одной стороны, мне всегда хотелось, чтобы она была счастлива.","Искренне.","Я ведь столько времени старался увидеть её улыбку.","Приезжал после тяжёлых рабочих недель.","Искал способы порадовать.","Мечтал, чтобы у неё всё было хорошо.","Но теперь её счастье словно существовало отдельно от меня.","И именно это причиняло боль.","Я видел, что она живёт дальше.","А сам не понимал, как сделать то же самое.","","Самым тяжёлым было осознание, что я не могу просто перестать любить.","Казалось бы, всё должно быть логично.","Человек сказал, что хочет расстаться.","В его жизни появился кто-то другой.","Значит, нужно принять это и двигаться дальше.","Но чувства не подчиняются логике.","Невозможно однажды проснуться, открыть настройки собственной души и нажать кнопку «Удалить».","Нельзя стереть воспоминания о холодном море в Анапе.","О первой квартире.","О её возвращении.","О наших встречах летом.","О том, как я смешил её после работы.","О том, как счастлив был просто видеть её рядом.","Всё это продолжало жить во мне.","И чем сильнее я пытался забыть, тем отчётливее вспоминал.","Иногда мне казалось, что я скучаю не только по самой Таисии, но и по человеку, которым становился рядом с ней.","По тому Артёму, который начал учиться любить.","Который впервые захотел быть романтичным.","Который перестал бояться менять свою жизнь ради другого человека.","Без неё всё это словно оказалось ненужным.","Хотя на самом деле никуда не исчезло.","","Мы снова начали общаться.","Не так, как раньше.","Теперь между нами не было прежней определённости.","Мы уже не были парой.","И я старался принять это.","Мне хотелось хотя бы сохранить дружбу.","Хотя бы иногда разговаривать.","Хотя бы знать, как у неё дела.","Потому что мысль о том, что Таисия может полностью исчезнуть из моей жизни, казалась ещё страшнее самого расставания.","Я пытался не показывать чувства.","Не высказывать обиду.","Не превращать каждый разговор в обсуждение того, почему всё закончилось.","Я хотел, чтобы ей было спокойно общаться со мной.","Чтобы она не чувствовала, будто обязана что-то объяснять или возвращаться.","Но внутри происходило совсем другое.","Каждое сообщение напоминало о том, насколько сильно я скучаю.","Каждый разговор возвращал надежду.","Каждая тёплая интонация заставляла думать, что, возможно, ещё не всё потеряно.","Я пытался превратить любовь в дружбу.","Но ничего не получалось.","Как можно спокойно дружить с человеком, которого всё ещё хочешь обнимать, целовать и называть своим?","Как можно делать вид, что тебе достаточно обычного общения, когда ещё недавно ты мечтал о совместном будущем?","Я не знал.","Но продолжал пытаться.","Потому что совсем потерять её не хотел.","","Постепенно у меня появилась мысль, от которой я уже не мог отказаться.","Я попробую её вернуть.","Не знал, получится ли.","Не знал, остались ли у неё чувства.","Не знал, хочет ли она вообще когда-нибудь снова быть со мной.","Но понимал, что не смогу спокойно жить с мыслью, будто даже не попытался.","Мне казалось, что если я смогу показать, насколько сильно изменился, она однажды увидит во мне того человека, с которым захочет быть.","И я начал писать.","Много.","Иногда это были письма для неё.","Иногда — обычные заметки, которые я никому не отправлял.","Я открывал телефон и записывал всё, что хотел сказать Таисии.","Словно она находилась рядом.","Словно мы продолжали разговаривать.","Словно между нами не произошло расставания.","Я рассказывал о своих мыслях.","О чувствах.","О том, как скучаю.","О том, что понял за время наших отношений.","О собственных ошибках.","О надеждах.","Иногда такие записи становились единственным местом, где я мог быть полностью откровенным.","Там мне не нужно было изображать спокойствие.","Не нужно было делать вид, что всё нормально.","Не нужно было бояться показаться слабым.","Я просто писал.","И на некоторое время становилось легче.","","Потом появились песни.","Одна.","Другая.","Ещё.","И ещё.","Таисия стала человеком, которому я посвящал музыку.","Мне иногда казалось, что ни один артист не написал столько песен об одной девушке, сколько я успел написать о ней за это время.","Наверное, это звучит смешно.","Но тогда музыка стала для меня ещё одним способом справляться с чувствами.","Я не мог просто прийти и рассказать ей всё, что происходит внутри.","Не мог вернуть наши отношения одним разговором.","Не мог заставить её снова влюбиться.","Зато мог писать.","О том, что помню.","О том, чего мне не хватает.","О нашей истории.","О ней.","Каждая песня становилась ещё одной попыткой сохранить то, что постепенно уходило в прошлое.","","Я отправлял подарки.","Писал письма.","Старался напоминать о себе.","Мне хотелось привлечь её внимание.","Показать, что мои чувства не исчезли.","Что я всё ещё здесь.","Что я продолжаю любить.","Но постепенно начал понимать неприятную вещь.","Моих стараний может оказаться недостаточно.","Не потому, что подарки были плохими.","Не потому, что письма были недостаточно красивыми.","И не потому, что я любил недостаточно сильно.","Просто невозможно вернуть отношения усилиями одного человека.","Можно измениться.","Можно признать ошибки.","Можно научиться говорить о чувствах.","Можно сделать всё, что в твоих силах.","Но нельзя заставить другого человека снова захотеть быть рядом.","Я начинал это понимать.","Хотя принять было невероятно трудно.","","В какой-то момент мне стало казаться, что нужно исчезнуть.","Не навсегда.","Не из жизни вообще.","А из её повседневности.","Перестать постоянно напоминать о себе.","Перестать пытаться привлечь внимание.","Дать ей возможность спокойно жить.","Я видел, что Таисия может быть счастливой и без меня.","И как бы сильно это ни ранило, понимал, что не должен превращать собственную любовь в бесконечную попытку удержать её.","Если ей хорошо, разве я имею право мешать?","Я задавал себе этот вопрос снова и снова.","И постепенно начал пропадать.","Меньше писать.","Меньше проявляться.","Стараться не показывать, насколько сильно скучаю.","Но чем тише становилось наше общение, тем громче звучали мысли в моей голове.","","А потом я начал пить.","Один.","Дома.","Не ради праздника.","Не ради компании.","Не потому, что происходило что-то хорошее.","Мне просто хотелось хотя бы ненадолго перестать чувствовать.","Я приходил домой, оставался наедине со своими мыслями и понимал, что не хочу снова проживать всё это.","Не хочу вспоминать её.","Не хочу представлять, как она проводит время без меня.","Не хочу думать о том, что когда-то мы были вместе, а теперь я даже не знаю, есть ли у нашей истории будущее.","Алкоголь не решал ни одной проблемы.","Он не возвращал Таисию.","Не убирал расстояние.","Не менял прошлое.","Но иногда помогал ненадолго заглушить мысли.","А потом всё возвращалось.","И становилось ещё тяжелее.","Я начал прогуливать работу.","Иногда говорил, что заболел.","Придумывал причины не выходить.","А на самом деле оставался дома.","Пил.","Спал.","Просыпался.","И снова возвращался к тем же мыслям.","Я понимал, что постепенно разрушаю собственную жизнь.","Но в тот период мне было трудно найти силы остановиться.","","Наверное, со стороны всё это могло казаться глупостью.","Расстался с девушкой.","Бывает.","Люди расстаются каждый день.","Нужно просто жить дальше.","Я и сам пытался говорить себе подобные вещи.","Но Таисия к тому моменту стала для меня гораздо большим, чем просто девушкой, с которой не сложились отношения.","Она была человеком, ради которого я впервые начал по-настоящему меняться.","Человеком, с которым связывал будущее.","Человеком, чья улыбка могла сделать счастливым даже самый тяжёлый день.","И теперь я пытался научиться жить без неё.","Получалось плохо.","Очень плохо.","","А потом однажды всё снова изменилось.","Таисия сказала, что собирается приехать в Краснодар.","Я помню, как внутри сразу появилось волнение.","Она приедет.","В тот самый город, где всё начиналось.","Где мы впервые проводили время вместе.","Где решились съехаться.","Где она однажды вернулась ко мне после ухода к другому парню.","Я предложил встретиться.","Она согласилась.","И в тот момент я впервые за долгое время почувствовал что-то похожее на настоящее счастье.","Я увижу её.","Не на фотографии.","Не в историях.","Не через экран телефона.","По-настоящему.","Смогу услышать её голос рядом.","Посмотреть в глаза.","Увидеть улыбку.","И, возможно, хотя бы ненадолго почувствовать себя так, словно между нами ничего не изменилось.","","Особенно сильно мне хотелось показать ей квартиру.","Ту самую, в которой когда-то были почти одни стены.","За время её отсутствия я многое сделал.","Постепенно приводил жильё в порядок.","Старался воплотить то, о чём мы когда-то мечтали.","И теперь мне хотелось, чтобы Таисия увидела результат.","Не ради похвалы.","Не ради того, чтобы доказать, какой я молодец.","Мне просто хотелось показать ей, что наши разговоры не исчезли из моей памяти.","Что я помнил, каким мы представляли это место.","Что даже после расставания продолжал делать то, что когда-то планировали вместе.","Наверное, в глубине души я надеялся, что она увидит квартиру и вспомнит нас.","Не наши ссоры.","Не расставание.","А те моменты, когда мы мечтали о совместной жизни.","Когда ещё верили, что всё получится.","","Я ждал встречи.","И волновался так, словно собирался увидеть её впервые.","Хотя прекрасно знал эту девушку.","Знал её характер.","Знал, как эмоционально она может спорить.","Знал, насколько сильно устаёт от работы.","Знал, как она смеётся.","И всё равно чувствовал себя тем самым парнем на вокзале перед поездкой в Анапу.","Тем, который ужасно стеснялся красивой девушки, но пытался выглядеть равнодушным.","Разница была только одна.","Тогда я ещё не знал, что люблю её.","А теперь не мог представить, как перестать.","","Но встреча началась совсем не так, как я себе представлял.","Накануне я снова напился.","И Таисия не хотела видеться со мной из-за этого.","Я понимал, что сам создал ещё одну проблему.","Что мои попытки справиться с болью начали влиять не только на меня.","И всё-таки мы встретились.","Снова оказались рядом.","Снова начали разговаривать.","И, конечно же, спорить.","Потому что это были мы.","А с нами, кажется, иначе и не получалось.","Я ещё не знал, что впереди нас ждёт вечер, который снова перевернёт мои чувства.","Вечер с едой, музыкой и танцами.","Вечер, когда я буду стоять рядом с девушкой, которую всё ещё люблю, и бояться даже случайно прикоснуться к ней.","Потому что теперь мы друзья.","По крайней мере, именно так назывались наши отношения.","И я должен был научиться с этим жить.","Но сердце снова собиралось нарушить все правила.","","Глава 9. Танцы среди воспоминаний","Я не знаю, существует ли особенный вид счастья, который испытываешь, когда после долгой разлуки снова видишь любимого человека.","Наверное, его невозможно сравнить с обычной радостью.","Это не просто хорошее настроение.","Не просто приятная встреча.","Скорее ощущение, будто часть твоего мира, которая долгое время отсутствовала, внезапно вернулась на своё место.","Пусть ненадолго.","Пусть без обещаний.","Пусть вы уже не вместе.","Но человек снова рядом.","И на несколько мгновений этого оказывается достаточно.","","Когда я увидел Таисию в Краснодаре, меня переполняли эмоции.","Я скучал по ней настолько сильно, что даже наши первые споры показались чем-то родным.","Мы шли и ругались.","Она эмоционально высказывала мне всё, что думала.","А я слушал.","И, как ни странно, был счастлив.","Наверное, со стороны это выглядело совершенно ненормально.","Девушка злится.","Высказывает претензии.","Спорит.","А парень едва ли не улыбается от счастья.","Но дело было не в самой ссоре.","Мне не нравилось, что она сердится.","Не нравилось, что я снова дал повод для неприятного разговора.","Просто в её эмоциях мне хотелось увидеть подтверждение того, что я всё ещё что-то значу.","Что она меня не забыла.","Что я не превратился окончательно в человека из прошлого.","Я не мог знать, действительно ли это так.","Но тогда очень хотел верить.","И даже обычный эмоционал
