е.","Мы с Таисией уже не раз расставались.","Наши отношения оставались неопределёнными.","Но Мию я продолжал любить.","И прогулка с ней была для меня чем-то по-настоящему приятным.","Хотя внутри всё равно оставалась обида.","","После этого на меня обрушилось ещё больше недовольства со стороны Таисии.","Я чувствовал себя растерянным.","С одной стороны, понимал её усталость.","С другой — не мог понять, почему мои попытки сделать что-то хорошее так часто заканчиваются неприятностями.","Мне хотелось приехать с цветами.","Увидеть любимую девушку.","Провести немного времени рядом.","А вместо этого снова возникла ссора.","Иногда мне казалось, что мы совершенно не умеем встречаться спокойно.","Стоит оказаться рядом, как обязательно появляется какая-нибудь проблема.","Но даже тогда я не хотел уезжать.","Потому что слишком долго ждал возможности увидеть её.","","Вскоре Инесса собралась возвращаться в родной город.","Мы помогали ей с отъездом.","И мне было грустно.","За время нашего общения я успел привыкнуть к ней.","Привык к тому, что она находится рядом с Таисией, что живёт на море, что мы можем видеться.","И теперь она уезжала.","Наверное, за эти два года я постепенно привязался не только к самой Таисии, но и к некоторым людям из её окружения.","Они становились частью нашей общей истории.","Частью тех воспоминаний, которые оставались у меня после каждой поездки.","И расставаться с ними тоже было неприятно.","","Мы проводили Инессу.","Попрощались.","А потом поехали с Таисией домой.","И именно с этого момента всё снова неожиданно изменилось.","Мы начали жить вместе.","","Когда я осознал происходящее, внутри появилось невероятное счастье.","Снова.","После всех расставаний.","После бесконечных разговоров о дружбе.","После моих поездок туда и обратно.","После четырнадцатого февраля, которое едва не стало для меня окончательным разочарованием.","Мы снова находились под одной крышей.","Я мог видеть Таисию каждый день.","Просыпаться рядом.","Гулять с Мией.","Быть частью её повседневной жизни.","И больше не ждать следующей возможности приехать.","Наверное, именно об этом я мечтал всё предыдущее время.","Не о красивых путешествиях.","Не о дорогих подарках.","А о возможности просто находиться рядом.","","Мы жили в Весёлом.","И первое время я был по-настоящему счастлив.","Конечно, всё не было идеально.","Мы ссорились.","Иногда не понимали друг друга.","Иногда раздражались из-за мелочей.","Но между этим существовали и хорошие моменты.","Обычные.","Домашние.","Те, ради которых мне хотелось продолжать бороться.","Я радовался, когда мы находились рядом.","Когда могли провести время вместе.","Когда не нужно было снова смотреть расписание поездов.","Когда Таисия возвращалась домой, а я знал, что увижу её.","Мне казалось, что теперь у нас наконец появился шанс изменить привычный сценарий.","","За время жизни в Весёлом мне пришлось многим пожертвовать.","Были решения и обстоятельства, о которых я не хотел подробно рассказывать даже в собственных записях.","Но всё это было связано с одним желанием.","Чтобы у нас получилось.","Чтобы в этот раз мы смогли остаться вместе.","Чтобы больше не пришлось расставаться.","Я действительно хотел построить с ней жизнь.","И ради этого был готов отказаться от многого.","","Но постепенно радость начала смешиваться с тревогой.","Я снова испытывал сложности с работой.","Искал вакансии.","Ждал ответов.","Надеялся, что вот-вот появится возможность нормально зарабатывать.","Но дни проходили.","А ничего не менялось.","И чем дольше продолжалась неопределённость, тем сильнее я чувствовал собственную бесполезность.","","Мне казалось, что я становлюсь для Таисии якорем.","Человеком, который удерживает её на месте.","Не помогает двигаться вперёд.","Не решает проблемы.","А только добавляет новые.","Я старался.","По крайней мере, мне очень хотелось верить, что старался.","Но результата не было.","И постепенно начал замечать, что моё присутствие всё чаще раздражает её.","","Иногда мне казалось, что я могу ничего не делать, а Таисия уже злится.","Просто потому, что я рядом.","Потому что снова что-то не так.","Потому что я опять не оправдал ожиданий.","Я не знал, действительно ли она чувствовала именно это.","Но воспринимал происходящее так.","И от этого становилось всё тяжелее.","","Таисия шутила.","Иногда подкалывала меня.","Говорила что-то, что, возможно, для неё не имело серьёзного значения.","Но я всё чаще обижался.","Не потому, что совсем не понимал юмора.","А потому, что внутри уже накопилось слишком много разочарования в себе.","Я чувствовал себя человеком, у которого ничего не получается.","Не мог найти работу.","Не мог обеспечить стабильность.","Не мог решить финансовые проблемы.","И когда на этом фоне слышал очередную шутку о себе, она попадала именно туда, где уже было больно.","","Наверное, если бы моя жизнь в тот момент складывалась хорошо, я реагировал бы иначе.","Мог бы посмеяться.","Ответить шуткой.","Не принимать всё настолько близко к сердцу.","Но тогда мне казалось, что я и без того нахожусь на самом дне.","И каждый неприятный комментарий только подтверждает мои собственные мысли.","Что я недостаточно хорош.","Что ничего не умею.","Что не могу быть тем мужчиной, которого Таисия хотела бы видеть рядом.","","Я пытался показывать, что мне обидно.","Но, кажется, мы снова не понимали друг друга.","Она продолжала шутить.","Я продолжал обижаться.","И постепенно наши отношения превращались в постоянное напряжение.","Я ходил раздражённым.","Нервничал.","Замыкался.","Иногда не мог нормально объяснить, что именно меня задело.","А внутри продолжал любить её.","Вот что было самым странным.","Я мог чувствовать обиду.","Разочарование.","Бессилие.","Но стоило посмотреть на Таисию, как всё равно хотелось обнять её.","Потому что она оставалась человеком, ради которого я столько раз пытался изменить собственную жизнь.","","Около месяца я жил в этом состоянии.","С одной стороны — счастье, что мы снова вместе.","С другой — постоянное ощущение, что я не справляюсь.","Мне хотелось быть рядом.","Но всё чаще казалось, что моё присутствие перестало приносить ей радость.","И я не понимал, как это исправить.","","Деньги постепенно заканчивались.","Все накопления, которые у меня были, уходили на жизнь.","Работа так и не находилась.","Я продолжал ждать ответов.","Искать.","Надеяться.","Но время шло.","И однажды стало понятно, что дальше так продолжаться не может.","","Мы приняли решение.","Таисии нужно возвращаться жить в отель.","Зарабатывать.","Копить деньги.","Потому что у неё появилась новая цель.","Сербия.","Она хотела переехать.","Начать новый этап жизни.","И для этого требовались средства.","","Когда я услышал об этих планах, внутри снова что-то болезненно сжалось.","Я понимал, что Таисии нужно двигаться вперёд.","Понимал, что нельзя бесконечно жить в финансовой неопределённости.","Понимал, что переезд может стать для неё важным шансом.","Но одновременно осознавал, что наша совместная жизнь снова заканчивается.","Мы опять разъезжаемся.","Снова расстояние.","Снова ожидание.","Снова неопределённость.","","Мне было стыдно.","Наверное, именно это чувство оказалось самым сильным.","Стыдно, что я не смог найти работу.","Стыдно, что потратил все отложенные деньги.","Стыдно, что не сумел построить ту жизнь, ради которой так долго старался.","Я снова воспринимал происходящее как собственное поражение.","Будто всё зависело исключительно от меня.","Будто если бы я был сильнее, умнее, успешнее, мы обязательно остались бы вместе.","Я не знал, правда ли это.","Но именно так чувствовал.","","Когда мы собирались разъезжаться, мне было тяжело.","Очень.","Я смотрел на Таисию и пытался понять, что она чувствует.","Иногда мне казалось, что ей гораздо легче принять происходящее.","Словно она заранее знала, что всё закончится именно так.","Словно уже успела смириться.","А я только сейчас осознал, что снова остаюсь один.","Возможно, я ошибался.","Я не мог знать, что происходило внутри неё.","Но мне было больно от ощущения, что наша очередная разлука переживается нами совершенно по-разному.","","Я возвращался в Краснодар.","Домой.","Туда, откуда столько раз уезжал к ней.","И снова оставался один.","С финансовыми проблемами.","С мыслями о будущем.","С воспоминаниями о нашей жизни в Весёлом.","И с любовью, которую никак не мог оставить позади.","","Таисия собиралась двигаться дальше.","Копить на Сербию.","Строить планы.","Искать новые возможности.","А я снова думал о том, когда у нас появится шанс попробовать ещё раз.","Наверное, именно в этом заключалась самая болезненная особенность моей любви.","Я постоянно ждал.","Ждал, когда она вернётся.","Когда закончится сезон.","Когда появятся деньги.","Когда удастся найти работу.","Когда мы снова сможем жить вместе.","И каждый раз мне казалось, что следующий шанс обязательно станет последним.","Что в этот раз всё получится.","Но наша история продолжалась.","И впереди нас ждал ещё один неожиданный поворот.","Сербия так и не станет началом новой жизни Таисии.","А вместо далёкой страны судьба снова приведёт её в Краснодар.","Ко мне.","","Глава 19. Сербия, которая так и не случилась","Иногда люди строят большие планы, потому что надеются: где-то в другом месте жизнь обязательно станет лучше.","В другом городе.","В другой стране.","С новой работой.","С новыми возможностями.","Кажется, что стоит только уехать, и все прежние трудности останутся позади.","Я понимал желание Таисии изменить свою жизнь.","Она много работала.","Постоянно сталкивалась с финансовыми проблемами.","Уставала.","Искала способы двигаться вперёд.","Сербия казалась новой возможностью.","Новым началом.","И, возможно, именно поэтому она так хотела туда переехать.","","После нашей жизни в Весёлом мы снова оказались отдельно.","Я вернулся в Краснодар.","Она продолжала строить планы.","А между нами вновь появилась неопределённость.","К тому моменту мы расстались.","И мне было особенно тяжело принимать происходящее.","Я словно снова потерял всё, что только начал возвращать.","Мы ведь жили вместе.","Проводили дни рядом.","Гуляли с Мией.","Пытались наладить быт.","И теперь всё снова закончилось.","","Я часто думал о том, что мог сделать иначе.","Найти работу быстрее?","Меньше обижаться?","Спокойнее реагировать на шутки?","Больше помогать?","Наверное, многое действительно можно было изменить.","Но прошлое уже произошло.","И теперь я снова находился дома.","Один.","","Планы с Сербией постепенно начали рушиться.","Возникли трудности.","Обстоятельства складывались не так, как ожидалось.","И в итоге переезд не состоялся.","Таисия решила вернуться в Краснодар.","К маме.","","Когда я узнал об этом, испытал странное чувство.","С одной стороны, мне было грустно.","Я понимал, что её планы не осуществились.","Что она хотела другого.","Что возвращение к маме стало не тем новым этапом, на который она надеялась.","Но одновременно внутри появилась радость.","Она снова будет в Краснодаре.","Совсем рядом.","Не за сотни километров.","Не на работе в горах.","Не в другом городе.","А здесь.","Там, где всё когда-то началось.","","Мы всё ещё не были вместе.","Но теперь у нас снова появилась возможность видеться.","И для меня это уже значило очень много.","","С работой у меня по-прежнему были сложности.","Денег не хватало.","Финансовые проблемы продолжали давить.","Иногда казалось, что я застрял в одном и том же периоде жизни.","Что сколько бы ни пытался выбраться, всё равно возвращаюсь к началу.","Но теперь рядом снова была Таисия.","Пусть пока не как моя девушка.","Пусть без обещаний.","Пусть мы опять не знали, что между нами происходит.","Но мы могли встречаться.","Гулять.","Разговаривать.","И постепенно снова привыкать друг к другу.","","Таисии было непросто жить у мамы.","Она чувствовала себя не лучшим образом.","К тому же довольно быстро устала от такого положения.","Ей хотелось самостоятельности.","Собственного пространства.","Возможности жить так, как привыкла.","Я понимал её.","После всех переездов и попыток устроить жизнь возвращение к родителям могло восприниматься как очередной шаг назад.","","Мы продолжали видеться.","Иногда гуляли.","Общались.","И я постепенно снова чувствовал, как между нами появляется близость.","Наверное, к тому времени я уже перестал удивляться подобным поворотам.","Жизнь словно постоянно возвращала нас друг к другу.","Даже когда казалось, что для этого больше нет причин.","","А потом Таисия решила переехать ко мне.","","Я помню, насколько неожиданным оказалось это решение.","Мы ведь совсем недавно расстались.","После Весёлого.","После всех финансовых проблем.","После ощущения, что снова не смогли построить совместную жизнь.","И вот теперь она собиралась жить со мной.","Снова.","","В тот момент я испытал огромное счастье.","Наверное, потому что именно этого хотел на протяжении всего времени нашей разлуки.","Чтобы она вернулась.","Чтобы снова находилась рядом.","Чтобы мы могли просыпаться в одной квартире.","Чтобы мне больше не приходилось ждать следующей встречи.","И теперь это действительно происходило.","","Особенно символичным казалось то, что она возвращалась именно в мою квартиру.","Ту самую.","Где когда-то были почти одни стены.","Где я постепенно делал ремонт.","Где мы слушали музыку и танцевали после одного из наших расставаний.","Где она однажды снова меня поцеловала.","Где я жил с Мией.","Где осталось столько воспоминаний.","","Почти год прошёл с того времени, когда Таисия приезжала ко мне и мы снова сблизились.","Тогда мы слушали Макана.","Танцевали.","Проводили время вместе.","Я помнил эти моменты.","И теперь она возвращалась уже не на несколько дней.","А жить.","","Мне хотелось верить, что это знак.","Что, возможно, после всех наших поездок, расставаний и переездов мы наконец оказались там, где должны были быть.","В Краснодаре.","В нашей привычной квартире.","Вместе.","","Но вместе с радостью постепенно возвращалась реальность.","Работа.","Деньги.","Долги.","Быт.","Разные привычки.","Разные ожидания.","Всё то, что уже не раз становилось причиной наших ссор.","И теперь нам снова предстояло столкнуться с этим.","","Таисия нашла работу.","Но я видел, что она не особенно довольна.","Зарплата была небольшой.","Возможностей не хватало.","Ей хотелось большего.","А наша общая жизнь постепенно становилась всё сложнее.","","Я работал на заводе.","Это была не та жизнь, о которой мечтал.","Но я старался зарабатывать.","Старался держаться.","Старался хоть как-то справляться с финансовыми обязательствами.","","Долги продолжали накапливаться.","И я всё чаще замечал, что Таисия тоже вынуждена уходить в кредиты.","Это было особенно тяжело.","Потому что именно такого развития событий я всегда боялся.","Я не хотел, чтобы мои проблемы становились её проблемами.","Не хотел, чтобы из-за меня ей приходилось брать на себя дополнительные обязательства.","Но именно это, как мне казалось, и происходило.","","Я снова начал чувствовать себя недостаточно хорошим.","Недостаточно успешным.","Недостаточно сильным.","Недостаточно полезным.","Мне хотелось быть человеком, который способен дать любимой девушке спокойствие.","А вместо этого мы постоянно сталкивались с финансовыми трудностями.","","Но даже тогда я был счастлив возвращаться домой.","Потому что там была она.","Таисия.","Моя любимая девушка.","Человек, ради которого я столько раз собирал вещи, покупал билеты, искал работу и начинал всё заново.","","Я возвращался с завода.","Уставший.","Иногда раздражённый.","Иногда разочарованный собственным положением.","Но знал, что дома меня ждёт она.","И эта мысль согревала.","Даже когда всё остальное казалось неправильным.","","Наверное, именно поэтому мне было так трудно признать, что наши отношения снова начинают разрушаться.","Ведь теперь мы находились рядом.","Больше не было расстояния.","Не нужно было ждать окончания сезона.","Не нужно было искать возможность приехать.","Мы жили вместе.","Так, как я столько времени мечтал.","Но постепенно оказалось, что само по себе отсутствие расстояния ещё не означает счастья.","Иногда люди могут находиться в одной квартире и всё равно чувствовать, как отдаляются друг от друга.","","В нашей жизни снова начались ссоры.","Из-за денег.","Из-за быта.","Из-за привычек.","Из-за мелочей, которые постепенно накапливались.","И с каждым конфликтом я всё сильнее боялся, что снова теряю её.","","Я не хотел этого.","Не хотел повторения.","Не хотел нового расставания.","Но страх, как и раньше, не помогал мне становиться лучше.","Иногда он заставлял реагировать слишком эмоционально.","Иногда говорить обидные слова.","Иногда превращать небольшую проблему в серьёзный конфликт.","","Я понимал, что совершаю ошибки.","Но одновременно чувствовал, что не могу найти способ всё исправить.","Будто мы снова попали в тот самый круг.","Ссора.","Обиды.","Попытка помириться.","Немного спокойствия.","И новая ссора.","","Но теперь у нас было кое-что новое.","Таисия получила водительские права.","И в нашей жизни появились поездки на машине.","Казалось бы, ещё одна возможность проводить время вместе.","Ещё один маленький шаг к обычной совместной жизни.","Но даже здесь мои страхи нашли способ вмешаться.","","Когда Таисия водила, я иногда начинал паниковать.","Боялся.","Кричал.","Слишком резко реагировал на ситуации, которые не всегда требовали такой реакции.","Я понимал, что поступаю неправильно.","Что своими криками могу только мешать.","Но порой не мог сдержаться.","Мне было страшно.","И я превращал собственный страх в давление на неё.","","Позже я начал привыкать.","Стал спокойнее относиться к её вождению.","Меньше паниковать.","Постепенно учился доверять.","Но и эта часть нашей жизни оставила после себя ссоры.","","А дома продолжались бытовые трудности.","Таисии был важен порядок.","Она хотела, чтобы всё находилось на своих местах.","Чтобы квартира была чистой.","Чтобы совместная жизнь была организована.","И я понимал её.","Но за предыдущие годы успел привыкнуть жить один.","Почти два года без неё.","Со своими привычками.","Со своим отношением к бытовым мелочам.","И теперь мне было непросто перестроиться.","","Я старался.","Но часто чувствовал, что этого недостаточно.","Сделаю одно — оказывается овеком, который не умел показывать любовь.","А теперь оказался по другую сторону.","Теперь мне хотелось нежности.","Хотелось обычного поцелуя перед разлукой.","Хотелось почувствовать, что она будет скучать.","Но этого не произошло.","","Она уехала.","А я снова остался один.","","Переехать сразу не получалось.","Таисия сказала, что сначала освоится.","Найдёт подходящую работу.","Разберётся с жильём и обстоятельствами.","А потом я смогу приехать.","Я согласился ждать.","Снова.","","Наверное, за эти два года я научился ждать лучше, чем чему-либо другому.","Ждать зарплату.","Ждать ответа работодателя.","Ждать следующей встречи.","Ждать, когда закончится смена Таисии.","Ждать, когда она напишет.","Ждать, когда мы снова сможем быть рядом.","И теперь всё повторялось.","","Я периодически ездил в Адлер на собеседования.","Искал работу.","Пытался найти возможность переехать.","Но ничего не получалось.","Одно собеседование.","Другое.","Очередной отказ.","Очередная неудача.","Я постепенно начинал ненавидеть эти ситуации.","Потому что каждый отказ означал не просто отсутствие работы.","Он означал ещё немного времени вдали от неё.","","Но в наших встречах всё равно оставалось хорошее.","Мы гуляли.","Разговаривали.","Проводили время вместе.","Таисия много работала, поэтому виделись нечасто.","Но когда получалось, я снова чувствовал то самое счастье.","Она рядом.","Можно посмотреть в глаза.","Услышать голос.","Погулять.","Поговорить.","И хотя бы ненадолго забыть о проблемах.","","Я продолжал искать работу.","И однажды наступил момент, когда мне показалось, что переезд наконец становится возможным.","Я сообщил об этом Таисии.","И услышал ответ, которого совершенно не ожидал.","Она не хотела, чтобы я приезжал.","","Я был растерян.","Очень.","После всех наших разговоров.","После предложения переехать вместе.","После собеседований.","После моих попыток подготовиться.","Вдруг оказалось, что она не хочет моего приезда.","","Мне было больно.","Не потому, что я не понимал её права передумать.","А потому, что снова почувствовал себя ненужным.","Снова оказалось, что я готовлюсь к совместной жизни, а она уже сомневается.","И снова я не понимаю, что происходит между нами.","","Ситуацию усложняло то, что меня увольняли с завода.","Я рассчитывал закончить работу и переехать в Адлер.","Начать новый этап.","Найти работу рядом с Таисией.","Но теперь весь план оказался под вопросом.","","Я не знал, что делать.","Оставаться в Краснодаре?","Искать новую работу здесь?","Продолжать ждать?","Или всё-таки ехать?","Мне казалось, что каждый раз, когда я принимаю решение ради нашего будущего, обстоятельства мгновенно меняются.","","Но уже на следующий день Таисия снова написала.","Теперь она говорила, что я могу приезжать.","И даже думала, что я уже купил билеты.","","А я действительно купил.","Заранее.","Потому что надеялся.","Потому что ждал её приглашения.","Потому что, несмотря на предыдущий разговор, продолжал верить, что мы сможем всё исправить.","","Я приехал.","И мы провели хорошие выходные.","Даже не поругались.","Для нас это уже казалось маленьким достижением.","Мы гуляли.","Разговаривали.","Проводили время вместе.","И я снова почувствовал надежду.","Может быть, всё действительно налаживается?","Может быть, расстояние скоро закончится?","Может быть, наконец появится возможность построить ту самую обычную жизнь, о которой я мечтал?","","Я сходил на очередное собеседование.","Но меня снова не взяли.","","Каждый отказ становился всё тяжелее.","Я уже не понимал, что со мной не так.","Почему ничего не получается?","Почему, сколько бы ни старался, постоянно оказываюсь в одном и том же положении?","Почему не могу просто найти работу, переехать и жить рядом с любимой девушкой?","","Мне казалось, что я снова проигрываю.","Не Таисии.","Не какому-то другому мужчине.","А собственной жизни.","","После выходных я уехал обратно в Краснодар.","Понимал, что десятого числа меня окончательно уволят.","И нужно будет решать, как двигаться дальше.","Я всё ещё собирался переехать к Таисии.","Всё ещё надеялся найти работу в Адлере.","Всё ещё представлял нашу совместную жизнь.","","Но затем она написала, что десятого числа приезжать не нужно.","К ней должна была приехать Инесса.","Я согласился подождать.","Мне не хотелось снова давить.","Не хотелось создавать конфликт.","Я понимал, что у Таисии есть подруги, собственные планы и жизнь, которая не должна полностью зависеть от меня.","Поэтому решил не торопиться.","","После десятого числа я отправился в горы с друзьями.","Мне хотелось немного отвлечься.","Провести время в другой обстановке.","Не думать постоянно о работе.","О деньгах.","О том, когда наконец получится переехать.","","Я уехал.","Но мысли о Таисии всё равно оставались со мной.","Я скучал.","Хотел позвонить.","Поговорить.","Услышать её голос.","Рассказать о происходящем.","Мне хотелось верить, что пока я нахожусь в горах, она тоже хотя бы иногда думает обо мне.","Что скучает.","Что ждёт.","","Я ещё не знал, что после возвращения услышу слова, которые поставят точку в нашей истории.","Настоящую.","Не такую, после которой через несколько дней снова появится поцелуй.","Не такую, после которой она внезапно приедет в Краснодар.","Не такую, после которой мы снова съедемся.","А ту, после которой мне придётся впервые задуматься о том, что, возможно, некоторые истории действительно заканчиваются.","Даже если ты совершенно не готов.","","ЧАСТЬ IV","ПОСЛЕДНИЙ РАЗ","Глава 21. Плохое предчувствие","Иногда ты чувствуешь приближение конца раньше, чем находишь для этого объяснение.","Всё вроде бы продолжается.","Вы общаетесь.","Иногда созваниваетесь.","Обсуждаете обычные вещи.","Строите планы.","Но где-то глубоко внутри появляется неприятное ощущение.","Словно человек уже начал уходить.","Ещё не сказал об этом.","Ещё не собрал вещи.","Ещё не произнёс слова о расставании.","Но между вами уже возникло расстояние.","И ты чувствуешь его.","","За несколько дней до последнего расставания я сказал Таисии, что мне кажется, будто она хочет закончить наши отношения.","Не знаю, почему решил сказать именно тогда.","Наверное, слишком многое накопилось.","Её нежелание, чтобы я переезжал.","Потом неожиданное разрешение приехать.","Постепенное исчезновение поцелуев.","Отсутствие привычных слов любви.","Мои бесконечные попытки понять, нужен ли я ей.","Всё это складывалось в одно неприятное ощущение.","Что я снова теряю её.","","Я сказал об этом.","А Таисия ответила:","— Плохо чувствуешь.","","Мне хотелось поверить.","Очень.","Ведь я сам мечтал ошибиться.","Хотел, чтобы мои переживания оказались всего лишь последствиями прошлых расставаний.","Чтобы всё было хорошо.","Чтобы она действительно хотела нашего совместного будущего.","Чтобы мы просто переживали очередной сложный период.","","Я постарался успокоиться.","Продолжал думать о переезде.","О работе.","О том, как скоро окажусь рядом.","Но тревога никуда не исчезла.","","Я уехал в горы с друзьями.","И даже там продолжал скучать по Таисии.","Иногда мне хотелось просто взять телефон и позвонить.","Сказать, что люблю.","Что скучаю.","Что очень хочу её увидеть.","Но я понимал, что она занята.","Что у неё свои дела.","И старался не навязываться.","","Когда я вернулся, всё ещё надеялся, что мы поговорим.","Что услышу её голос.","Что сможем нормально обсудить наш переезд.","Что наконец появится хоть какая-то определённость.","Но вместо этого меня ждал разговор, к которому я, наверное, уже никогда не смог бы подготовиться.","","Таисия сказала, что мы расстаёмся.","Снова.","","Я даже не сразу понял, что чувствую.","Боль?","Конечно.","Разочарование?","Огромное.","Злость?","Тоже.","Но сильнее всего было ощущение невероятной усталости.","Будто я слишком долго шёл к одной цели.","Постоянно падал.","Поднимался.","Начинал заново.","И теперь снова оказался в самом начале.","Только сил почти не осталось.","","Я вспоминал всё.","Как искал работу.","Как ездил на собеседования.","Как готовился к переезду.","Как покупал билеты.","Как она сначала не хотела, чтобы я приезжал, а потом снова разрешила.","Как мы провели хорошие выходные.","Как я вернулся в Краснодар, уверенный, что совсем скоро смогу переехать.","И теперь всё это словно потеряло смысл.","","Мне казалось, что Таисия снова убегает.","От проблем.","От наших отношений.","От меня.","Возможно, она воспринимала происходящее иначе.","Возможно, давно чувствовала, что больше не хочет продолжать.","Но я видел ситуацию именно так.","Мы снова дошли до сложного момента.","И снова расстались.","","На эмоциях я удалил нашу переписку.","Ту самую.","В которой хранилось столько воспоминаний.","Сообщений.","Разговоров.","Ссор.","Примирений.","Признаний.","Фотографий.","Обычных повседневных мелочей.","Всего того, из чего за два года сложилась наша история.","","Я понимал, насколько важной была эта переписка.","Не только для меня.","Для неё тоже.","Но в тот момент я был настолько разбит, что поступил импульсивно.","Мне хотелось хоть как-то прекратить боль.","Убрать перед глазами всё, что постоянно напоминало о нас.","Перестать возвращаться к старым сообщениям.","Перестать искать там доказательства, что когда-то она меня любила.","","Но удалить переписку оказалось гораздо проще, чем удалить чувства.","","Я сидел с пониманием, что снова потерял её.","И впервые за долгое время не знал, хочу ли продолжать бороться.","Не потому, что перестал любить.","А потому, что устал.","Устал от постоянной неопределённости.","От переездов.","От расстояния.","От надежды, которая каждый раз заканчивалась одинаково.","","Я хотел поговорить.","Хотел понять, что произошло.","Почему всё снова изменилось.","Почему ещё недавно мы обсуждали переезд, а теперь расстаёмся.","Но вместе с этим начал понимать: возможно, дело уже не в конкретной ссоре.","Не в одной ошибке.","Не в одном разговоре.","Возможно, мы просто слишком долго пытались сохранить отношения, которые постоянно причиняли нам боль.","","Мне было трудно даже допустить такую мысль.","Потому что я любил Таисию.","И привык считать, что любовь обязательно должна означать борьбу.","Что если любишь по-настоящему, нужно стараться до конца.","Что нельзя сдаваться.","Что нужно преодолевать любые трудности.","Но теперь впервые задумался о другом.","А что, если иногда любовь заключается не в том, чтобы продолжать удерживать человека?","Что, если однажды нужно позволить ему уйти?","","Я не был готов ответить на этот вопрос.","Но постепенно понимал, что дальше всё уже не может продолжаться так, как раньше.","","Глава 22. Одиннадцатое число","После последнего расставания я начал вспоминать даты.","Не знаю, почему именно это стало для меня настолько важным.","Наверное, когда пытаешься понять, что произошло, начинаешь искать закономерности.","В словах.","В поступках.","В событиях.","Даже в календаре.","","Я заметил странную вещь.","Мы расставались примерно в одно и то же время месяца.","Чаще всего между девятым и девятнадцатым числом.","А незадолго до этого наше общение обычно начинало портиться.","Мне казалось, что Таисия уже тогда задумывается о расставании.","Становится холоднее.","Отдаляется.","А я начинаю чувствовать тревогу.","","Возможно, это было просто совпадение.","Возможно, я слишком сильно пытался найти смысл там, где его не было.","Но даты действительно запомнились.","","Первое серьёзное расставание произошло примерно девятого или десятого числа.","Последнее — около одиннадцатого или двенадцатого.","И теперь, оглядываясь назад, я словно видел повторяющийся сценарий.","Сначала всё хорошо.","Потом появляются недопонимания.","Постепенно становится меньше общения.","Я начинаю переживать.","Пытаюсь выяснить, что происходит.","Иногда давлю слишком сильно.","И в какой-то момент слышу знакомые слова.","Нам нужно расстаться.","","За два года это происходило столько раз, что я уже почти перестал удивляться самому факту.","Но боль от этого не становилась меньше.","Наверное, даже наоборот.","Потому что каждое новое расставание возвращало воспоминания обо всех предыдущих.","","Я вспоминал нашу первую квартиру.","Её уход к другому парню.","Тот самый звонок в дверь.","Потом сезон.","Расстояние.","«Ну бывает».","Другого парня.","Мои письма.","Возвращение.","Поцелуй.","Мию.","Новогоднее кольцо.","Свадьбу её мамы.","Весёлое.","Сербию.","Краснодар.","Завод.","Адлер.","И теперь — снова конец.","","Два года.","Всего два.","А мне казалось, что мы прожили вместе гораздо больше.","Слишком много всего уместилось в это время.","Слишком много счастья.","Слишком много боли.","Слишком много надежд.","","Я даже вспомнил странное совпадение с Абхазией.","В разные периоды мы оказывались там почти в одни и те же числа.","Один раз третьего мая.","Другой — пятого.","Не знаю, имело ли это какое-нибудь значение.","Скорее всего, нет.","Но когда в жизни происходит столько повторений, начинаешь замечать даже такие мелочи.","Словно пытаешься понять, почему судьба постоянно возвращала нас к одним и тем же местам, событиям и чувствам.","","Я долго думал о том, что наши отношения словно ходили по кругу.","Мы встречались.","Сближались.","Начинали строить планы.","Потом появлялись трудности.","Мы отдалялись.","Расставались.","Проходило время.","И снова находили дорогу друг к другу.","","Каждый раз мне казалось, что теперь всё будет иначе.","Что мы уже достаточно пережили.","Что научились на ошибках.","Что стали взрослее.","Что теперь точно понимаем, чего хотим.","Но постепенно всё повторялось.","","И я начал задаваться вопросом.","А может быть, мы просто не умели быть вместе?","Не потому, что кто-то из нас был плохим человеком.","Не потому, что всё происходившее было ненастоящим.","А потому, что любовь сама по себе не решает всех проблем.","Она не находит работу.","Не закрывает долги.","Не учит разговаривать во время ссоры.","Не убирает ревность.","Не делает людей одинаковыми.","Не заставляет их хотеть одного и того же.","","Я слишком долго думал, что если люблю Таисию достаточно сильно, то однажды всё обязательно получится.","Что нужно только стараться.","Работать больше.","Приезжать чаще.","Дарить подарки.","Делать комплименты.","Исправлять ошибки.","Но теперь начал понимать: для отношений недостаточно усилий одного человека.","И даже усилия двоих не всегда приводят к тому будущему, о котором они мечтали.","","Это было болезненное осознание.","Потому что мне очень хотелось верить в нашу любовь.","В ту самую, которая каждый раз оказывалась сильнее расставаний.","В историю двух людей, которые постоянно находили дорогу друг к другу.","Но теперь я уже не был уверен, что очередное возвращение сделало бы нас счастливыми.","","Я продолжал любить Таисию.","И одновременно начал понимать, что наши постоянные расставания ранили нас обоих.","","Наверное, именно это стало самым тяжёлым.","Признать, что человек может быть невероятно дорог тебе, но совместная жизнь с ним всё равно не получается.","Что можно хранить самые тёплые воспоминания и одновременно понимать, насколько много боли было между вами.","Что любовь не всегда заканчивается потому, что кто-то перестал любить.","Иногда она просто больше не может существовать в прежнем виде.","","Я не знал, что будет дальше.","Не знал, встретимся ли мы снова.","Будем ли когда-нибудь разговаривать.","Сможем ли сохранить дружбу.","Но теперь впервые задумался о том, что, возможно, наша история действительно подошла к концу.","И что мне придётся научиться жить с этим.","","Глава 23. Девушка, которую я хотел назвать женой","Я часто вспоминаю себя в самом начале нашей истории.","Того парня, который ехал через половину Краснодара ради обычной встречи.","Который слушал рассказы Таисии о работе в букмекерской конторе.","Который стеснялся на вокзале перед поездкой в Анапу.","Который фотографировал её возле холодного моря и боялся показать, насколько сильно она ему нравится.","Иногда мне хочется вернуться туда.","Не чтобы изменить всю нашу историю.","Не чтобы избежать знакомства.","А чтобы сказать самому себе несколько простых вещей.","","Не бойся любить.","Не прячь чувства.","Не делай вид, что тебе всё равно, если это не так.","Не думай, что невозмутимость делает тебя сильнее.","Не заставляй человека угадывать, насколько он тебе дорог.","","Я слишком долго этому учился.","И, наверное, именно поэтому наша история стала для меня настолько важной.","Таисия изменила меня.","Не полностью.","Не волшебным образом.","Я не стал идеальным человеком.","По-прежнему совершал ошибки.","Иногда ревновал.","Иногда слишком сильно переживал.","Иногда говорил лишнее.","Но рядом с ней я научился тому, чего раньше почти не умел.","Любить открыто.","","Я научился говорить комплименты.","Дарить цветы.","Придумывать сюрпризы.","Запоминать маленькие желания.","Радоваться чужому счастью так, словно оно принадлежит мне самому.","","Я помню духи.","Как Таисия расплакалась, когда оказалось, что мы купили не тот аромат.","Как я поехал менять их после работы.","Как мне отказали.","Как я всё равно купил новые, потому что хотел увидеть её улыбку.","","Я помню кольцо.","Сколько работал ради него.","Как разгружал машины.","Как откладывал деньги.","Как волновался, пока подарок шёл к ней.","И как счастлив был, когда увидел видео с её реакцией.","","Я помню Мию.","Нашу маленькую собаку.","Как мы ехали за ней.","Как искали полотенце, чтобы ей было тепло.","Как я потом играл с ней дома.","Как слушал музыку.","Как радовался, что у меня наконец появилась собака, о которой мечтал с детства.","","Я помню Новый год.","Горы.","Домик, до которого было невероятно сложно добраться.","Таисию в красивом платье.","Её подруг.","И ощущение, что я впервые встречаю праздник именно так, как мне хотелось.","","Я помню свадьбу её мамы.","Как волновался перед знакомством с родственниками.","Как покупал одежду.","Как целый день готовил салат, который Таисия не любила с рисом.","Как познакомился с её бабушкой.","И как впервые особенно ясно понял, что хочу однажды жениться на этой девушке.","","Я действительно хотел.","Не просто говорил себе, что когда-нибудь, возможно, мы поженимся.","Я представлял это.","Хотел выбрать особенное место.","Красиво сделать предложение.","Удивить её.","Увидеть реакцию.","И услышать согласие.","","Наверное, это была одна из самых больших моих мечтаний.","Чтобы однажды Таисия стала моей женой.","Чтобы больше не приходилось расставаться.","Чтобы все наши поездки были не попытками увидеться после долгой разлуки, а обычными семейными путешествиями.","Чтобы у нас был дом.","Мия.","Работа.","Быт.","И возможность каждый вечер возвращаться друг к другу.","","Я не мечтал о какой-то идеальной сказке.","Я прекрасно знал характер Таисии.","Знал, что она может быть взрывной.","Эмоциональной.","Резкой.","Что иногда мы будем спорить.","Что не всегда сможем быстро договориться.","Но мне хотелось проживать всё это вместе.","Не убегать.","Не расставаться.","Не начинать заново каждые несколько месяцев.","А просто оставаться.","","Но у жизни оказались другие планы.","","Я часто думал, что проиграл.","Проиграл очередную попытку построить отношения.","Проиграл борьбу с расстоянием.","Проиграл собственным финансовым проблемам.","Проиграл страхам.","Проиграл самому себе.","","Но теперь, оглядываясь назад, я уже не был уверен, что любовь вообще можно измерять победами и поражениями.","Разве те моменты, когда мы были счастливы, перестали существовать только потому, что расстались?","Разве Мия стала менее дорогой?","Разве Анапа перестала быть особенным воспоминанием?","Разве я не был счастлив в тот момент, когда Таисия снова меня поцеловала?","Был.","И это настоящее.","","Я не хочу вычёркивать нашу историю.","Не хочу делать вид, что этих двух лет не существовало.","Не хочу ненавидеть Таисию только потому, что у нас не получилось.","","Конечно, мне больно.","Конечно, я разочарован.","Конечно, иногда вспоминаю наши ссоры и думаю, насколько иначе всё могло сложиться.","Но вместе с этим я понимаю, что в моей жизни был человек, которого я любил настолько сильно, что однажды решил написать о нём целую книгу.","","И если бы мне снова предложили вернуться в тот день, когда мы познакомились, я не знаю, смог бы отказаться.","Даже понимая, сколько боли ждёт впереди.","Потому что тогда пришлось бы отказаться и от всего хорошего.","А хорошего было немало.","","Наверное, самое тяжёлое заключается в том, что я до сих пор не могу представить рядом с собой другую девушку.","Не хочу искать похожую.","Не хочу сравнивать.","Не хочу пытаться заменить Таисию.","Но теперь понимаю, что не обязан принимать решение о своём будущем прямо сейчас.","Мне нужно время.","Чтобы пережить.","Чтобы разобраться в себе.","Чтобы снова научиться жить не только ожиданием её возвращения.","","Я всё ещё люблю её.","И, наверное, именно поэтому больше не хочу превращать эту любовь в бесконечную борьбу.","Потому что за два года я слишком часто пытался удержать то, что снова и снова уходило.","И теперь впервые думаю о том, что, возможно, пора позволить нашей истории закончиться.","","Глава 24. В ожидании дракона","Когда-то я написал, что рыцарей больше нет.","И драконы давно исчезли.","Но я всё равно буду бороться за свою любовь.","Буду добиваться Таисии.","Буду ждать.","Сколько потребуется.","Тогда мне казалось, что именно так выглядит настоящая любовь.","Что если человек действительно дорог, нельзя просто позволить ему уйти.","Нужно стараться.","Преодолевать.","Доказывать.","Возвращать.","И я действительно делал всё это.","","Два года.","Два года, за которые мы столько раз начинали сначала, что я уже перестал считать.","Я приезжал.","Уезжал.","Искал работу.","Терял работу.","Зарабатывал.","Оставался без денег.","Покупал билеты.","Возвращался домой.","Снова собирал вещи.","Снова ехал к ней.","","Я писал письма.","Посвящал песни.","Дарил цветы.","Покупал подарки.","Мечтал о свадьбе.","Пытался стать лучше.","Иногда получалось.","Иногда нет.","","Я совершал ошибки.","Много.","Боялся показывать чувства.","Потом слишком сильно боялся потерять.","Ревновал.","Давил.","Замыкался.","Иногда говорил обидные вещи.","Иногда пытался решить проблемы деньгами и подарками, хотя на самом деле нам, возможно, гораздо сильнее нужны были спокойные разговоры.","","Но всё это время я любил Таисию.","","Наверное, когда-нибудь я перестану так остро реагировать на её имя.","Когда-нибудь смогу спокойно вспоминать нашу квартиру.","Поездку в Анапу.","Новый год.","Мию.","Свадьбу её мамы.","Когда-нибудь эти воспоминания перестанут причинять боль.","И останется только благодарность за то, что они вообще были.","","Но сейчас мне грустно.","Потому что наша история закончилась.","На этот раз я не собираюсь придумывать новую главу.","Не хочу обещать самому себе, что обязательно верну её.","Не хочу снова жить исключительно ожиданием.","","Я слишком долго пытался догнать ветер.","Когда-то мне казалось, что Таисия именно такая.","Ветер.","Свободный.","Непредсказуемый.","Постоянно меняющий направление.","А я — маленький фантик, который летит следом.","Мечтает догнать.","Хотя бы на мгновение оказаться рядом.","Хотя бы ещё раз поцеловать.","","Но теперь я понимаю, что невозможно бесконечно лететь за ветром.","Когда-нибудь приходится остановиться.","Даже если очень не хочется.","","Я не знаю, что будет дальше в жизни Таисии.","Где она окажется.","Какую работу найдёт.","В какой стране однажды захочет жить.","С кем будет встречать Новый год.","Кто станет помогать ей с Мией.","Кто будет слушать её истории после тяжёлых смен.","Кто однажды увидит её в красивом платье и подумает, что хочет провести с ней всю жизнь.","","Мне больно представлять это.","Но я всё равно хочу, чтобы она была счастлива.","","Хочу, чтобы ей больше не приходилось постоянно переживать из-за денег.","Чтобы работа не забирала все силы.","Чтобы она могла спокойно отдыхать.","Чтобы рядом были люди, которые её понимают.","Чтобы Мия была здоровой и счастливой.","Чтобы у Таисии получалось всё, к чему она стремится.","","И если для этого ей нужно окончательно уйти из моей жизни, я постараюсь принять её решение.","Не потому, что перестал любить.","А потому, что больше не хочу, чтобы наша история состояла из бесконечных расставаний и возвращений.","","Возможно, однажды она забудет обо мне.","Перестанет вспоминать наши поездки.","Не будет помнить, как мы забирали Мию.","Как слушали Макана и танцевали в квартире.","Как встречали Новый год в горах.","Как я подарил ей кольцо.","","Возможно, для неё всё это постепенно станет просто прошлым.","А для меня останется целой книгой.","","Я не знаю, почему жизнь столько раз сводила нас вместе.","Почему после каждого расставания появлялась новая возможность.","Почему мы снова и снова возвращались друг к другу.","И почему в итоге всё равно не смогли остаться рядом.","","Наверное, не на каждый вопрос существует ответ.","Иногда история просто заканчивается.","Без объяснения.","Без красивого финального разговора.","Без обещания, что однажды всё обязательно изменится.","","Я хотел жениться на Таисии.","Хотел видеть её своей семьёй.","Хотел однажды просыпаться рядом и понимать, что больше не нужно никуда ехать.","Что все поезда, автобусы и бесконечные дороги наконец остались позади.","Что мы дома.","Вместе.","","Но этого не произошло.","","И теперь мне остаётся только принять то, что было.","Не выдумывать счастливый конец.","Не превращать наши ошибки в красивую сказку.","Не делать вид, что любовь способна решить абсолютно всё.","","Мы любили.","Ссорились.","Возвращались.","Причиняли друг другу боль.","Снова пытались.","И однажды расстались.","","Это наша история.","Настоящая.","Неидеальная.","Иногда смешная.","Иногда невероятно тёплая.","А иногда такая болезненная, что мне до сих пор трудно вспоминать некоторые моменты.","","Я не знаю, прочитает ли Таисия когда-нибудь эти страницы.","Не знаю, узнает ли себя в каждой главе.","Возможно, какие-то события она помнит совершенно иначе.","Возможно, с чем-то не согласится.","Возможно, удивится тому, насколько сильно я переживал в моменты, когда внешне оставался спокойным.","","Но я писал эту историю такой, какой прожил её сам.","Со своими чувствами.","Со своими ошибками.","Со своей любовью.","","Когда-то всё началось с обычного знакомства.","С девушки, которая работала в букмекерской конторе.","С разговоров.","С поездок через половину Краснодара.","С холодного моря в Анапе.","","А закончилось двумя людьми, которые за два года так и не смогли научиться оставаться вместе.","","Я не жалею, что встретил её.","Не жалею, что любил.","Не жалею о Мие.","О наших поездках.","О подарках.","О счастливых моментах.","","Я жалею только о том, что у нас не получилось.","","Когда-то я ждал дракона.","Ждал возможности снова доказать свою любовь.","Ждал нового испытания, после которого обязательно смогу вернуть свою принцессу.","Но теперь понимаю, что не каждую историю нужно продолжать до бесконечности.","Иногда нужно закрыть книгу.","Даже если очень хочется написать ещё одну главу.","","Я любил тебя, Таисия.","Любил так, как раньше даже не представлял возможным.","Ты изменила многое во мне.","Научила чувствовать.","Научила не бояться романтики.","Научила мечтать о семье.","И оставила после себя воспоминания, которые навсегда останутся частью моей жизни.","","Я не знаю, что ждёт тебя впереди.","Но искренне надеюсь, что ты найдёшь своё счастье.","Даже если оно будет не со мной.","","Спасибо тебе за эти два года.","За Анапу.","За наши квартиры.","За поездки.","За Новый год.","За Мию.","За все моменты, когда мы были счастливы.","","И за то, что когда-то появилась в моей жизни.","","Я столько раз заканчивал нашу историю, что уже перестал верить собственным последним словам.","Каждый раз думал, что это финал.","А потом открывал заметки и начинал писать снова.","Но теперь всё иначе.","Я не хочу придумывать продолжение.","Не хочу обещать, что обязательно верну тебя.","Не хочу снова превращать любовь в ожидание.","","Возможно, когда-нибудь я открою эту книгу.","Перечитаю первые главы.","Улыбнусь, вспоминая того неловкого парня на вокзале.","И пойму, что наконец научился отпускать прошлое.","","А пока мне остаётся только сказать то, что я написал в конце нашей настоящей истории.","Люблю тебя, Таисия.","И всего хорошего тебе.","","ЭПИЛОГ","Там, где всё началось","Где-то в моих воспоминаниях навсегда останется холодное море.","Анапа.","Берег.","Девушка, которая улыбается, несмотря на холод.","И парень, который держит телефон, фотографирует её и совершенно не понимает, что происходит с его сердцем.","Он ещё не знает, что однажды будет готов разгружать машины ради возможности её увидеть.","Не знает, что купит ей бриллиантовое кольцо.","Что у них появится маленькая собака по имени Мия.","Что он будет встречать с ней Новый год в горах.","Что познакомится с её семьёй.","Что однажды начнёт мечтать сделать ей предложение.","","Он не знает, сколько раз они расстанутся.","Сколько поездов увезут его домой.","Сколько раз он будет смотреть на телефон, ожидая сообщения.","Сколько раз станет убеждать себя, что всё обязательно получится.","","Он просто стоит возле моря.","И смотрит на девушку, которая ему нравится.","","А она улыбается.","","И если бы я мог вернуться в тот день, я бы не стал рассказывать ему о будущем.","Не стал бы предупреждать о боли.","Не стал бы пытаться изменить его решение поехать в Анапу.","","Я бы просто подошёл.","И сказал:","«Сфотографируй её ещё раз, Артём».","«Когда-нибудь эта фотография будет значить для тебя гораздо больше, чем ты можешь представить».","","Потому что не каждая любовь остаётся с нами навсегда.","Но каждая настоящая любовь оставляет после себя историю.","И у меня такая история была.","Её звали Таисия.","","КОНЕЦ","«В ожидании дракона»","История любви, которая каждый раз начиналась заново.","Артём",""]}</script>
<script>
(() => {
'use strict';
const BOOK = JSON.parse(document.getElementById('book-data').textContent);
const $ = id => document.getElementById(id);
const STORAGE = 'dragonBookModernV1';
const all = BOOK.paragraphs;
const chapterRe = /^(Глава\s+\d+\..+|Эпилог\b.*)$/i;
const partRe = /^(ЧАСТЬ\s+[IVXLC0-9]+|ЧАСТЬ\s+[IVXLC0-9]+.*)$/i;
const sections = [];
let current = 0, pageIndex = 0, pages = [], searchMatches = [], toastTimer;
function isTitle(s){return chapterRe.test(s.trim())}
function isPart(s){return partRe.test(s.trim())}
function makeSections(){
  let currentSection={title:'Начало',start:0,items:[],kind:'front'};
  sections.push(currentSection);
  all.forEach((text,i)=>{
    if(i===0){currentSection.items.push({text,index:i,type:'title'});return}
    if(isTitle(text)){
      currentSection={title:text.trim(),start:i,items:[],kind:'chapter'};
      sections.push(currentSection);
    }
    currentSection.items.push({text,index:i,type:isTitle(text)?'chapter':isPart(text)?'part':'paragraph'});
  });
  // Preserve all original paragraphs, including empty ones, in the section sequence.
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderItem(item){
  const t=item.text;
  if(!t.trim()) return '';
  if(item.index===0) return `<h1 class="front-title">${escapeHtml(t)}</h1>`;
  if(item.index===1) return `<p class="front-subtitle">${escapeHtml(t)}</p>`;
  if(item.index===2||item.index===3) return `<p class="front-meta">${escapeHtml(t)}</p>`;
  if(item.type==='part') return `<h2><span class="part-label">${escapeHtml(t)}</span></h2>`;
  if(item.type==='chapter') return `<h1>${escapeHtml(t)}</h1>`;
  if(/^Автобиографический роман$/i.test(t.trim())) return `<p class="front-meta">${escapeHtml(t)}</p>`;
  return `<p>${escapeHtml(t)}</p>`;
}
function paginateSection(section, sectionNo){
  // Keep paragraphs whole and paginate on a conservative text budget for both mobile and desktop.
  const output=[]; let chunk=[], chars=0;
  const budget= section.kind==='front' ? 850 : 1250;
  section.items.forEach(item=>{
    if(!item.text.trim()) { chunk.push(item); return; }
    const cost=item.text.length + (item.type==='chapter'?100:40);
    if(chunk.length && chars+cost>budget){
      output.push({sectionNo,items:chunk});chunk=[];chars=0;
    }
    chunk.push(item);chars+=cost;
    if(item.type==='chapter' && chars>300){output.push({sectionNo,items:chunk});chunk=[];chars=0;}
  });
  if(chunk.length) output.push({sectionNo,items:chunk});
  if(!output.length) output.push({sectionNo,items:[]});
  return output;
}
function buildPages(){
  pages=[];
  sections.forEach((s,i)=>{s.pages=paginateSection(s,i);pages.push(...s.pages)});
  // On desktop, each navigation step shows two consecutive virtual pages.
  // Store the page count in spreads; mobile displays the right page only.
}
function getSaved(){try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){return {}}}
function save(){try{const old=getSaved();localStorage.setItem(STORAGE,JSON.stringify({...old,pageIndex,current,theme:document.body.classList.contains('dark'),font:$('fontRange').value,line:$('lineRange').value,bookmark:old.bookmark}))}catch(e){}}
function showToast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2100)}
function currentSection(){return pages[pageIndex]?.sectionNo ?? 0}
function drawToc(){
  $('toc').innerHTML=sections.map((s,i)=>`<button class="${i===0?'part':''} ${i===currentSection()?'active':''}" data-section="${i}">${escapeHtml(s.title)}</button>`).join('');
  $('toc').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>goSection(Number(b.dataset.section))));
}
function updateProgress(){
  const pct=pages.length<=1?100:Math.round((pageIndex/(pages.length-1))*100);
  $('progressText').textContent=pct+'%';$('progressFill').style.width=pct+'%';
  $('pageCount').textContent=`Страница ${Math.min(pageIndex+1,pages.length)} из ${pages.length}`;
  $('prevBtn').disabled=pageIndex<=0;$('nextBtn').disabled=pageIndex>=pages.length-1;
  const sec=sections[currentSection()];$('sectionLabel').textContent=sec?.title||'Начало';
  $('toc').querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.section)===currentSection()));
  const saved=getSaved();$('bookmarkStatus').textContent=saved.bookmark===pageIndex?'Закладка здесь':'';
  $('bookmarkBtn').classList.toggle('bookmark-on',saved.bookmark===pageIndex);
}
function drawPage(el,numberEl,idx,side){
  const page=pages[idx];
  const pageEl=el.parentElement;
  if(!page){pageEl.classList.add('blank');el.innerHTML='';numberEl.textContent='';return}
  pageEl.classList.remove('blank');
  el.innerHTML=page.items.map(renderItem).join('');
  numberEl.textContent=String(idx+1).padStart(2,'0');
}
function render(){
  if(pageIndex<0)pageIndex=0;if(pageIndex>=pages.length)pageIndex=pages.length-1;
  const spread=$('spread');spread.classList.remove('page-flip');void spread.offsetWidth;spread.classList.add('page-flip');
  drawPage($('leftContent'),$('leftNumber'),pageIndex-1,'left');
  drawPage($('rightContent'),$('rightNumber'),pageIndex,'right');
  if($('viewMode').value==='single'){$('leftPage').style.display='none';$('rightPage').style.borderRadius='3px'}
  else if(window.matchMedia('(max-width: 900px)').matches){$('leftPage').style.display='none'}
  else {$('leftPage').style.display='block';$('rightPage').style.borderRadius='0 3px 3px 0'}
  updateProgress();save();
}
function goSection(i){const target=pages.findIndex(p=>p.sectionNo===i);if(target>=0){pageIndex=target;render();if(window.innerWidth<900)window.scrollTo({top:0,behavior:'smooth'})}}
function step(delta){pageIndex=Math.max(0,Math.min(pages.length-1,pageIndex+delta));render()}
function toggle(panel){$(panel).classList.toggle('open')}
function loadSettings(){
  const s=getSaved();if(s.theme)document.body.classList.add('dark');
  if(s.font)$('fontRange').value=s.font;if(s.line)$('lineRange').value=s.line;
  applyTypography();
}
function applyTypography(){
  document.documentElement.style.setProperty('--page-font',$('fontRange').value+'px');
  document.documentElement.style.setProperty('--leading',($('lineRange').value/10).toFixed(1));
  $('fontValue').textContent=$('fontRange').value+' px';$('lineValue').textContent=($('lineRange').value/10).toFixed(1);save();
}
function openBookmark(){
  const s=getSaved();if(Number.isInteger(s.bookmark)){pageIndex=s.bookmark;render();showToast('Закладка открыта')}else showToast('Нажмите ♧, чтобы сохранить закладку');
}
function doSearch(q){
  const query=q.trim().toLocaleLowerCase('ru');if(!query){$('searchResults').innerHTML='';return}
  const matches=[];
  all.forEach((text,i)=>{const at=text.toLocaleLowerCase('ru').indexOf(query);if(at>=0){const sectionNo=sections.findIndex(s=>s.items.some(it=>it.index===i));const pageNo=pages.findIndex(p=>p.items.some(it=>it.index===i));matches.push({text,index:i,sectionNo,pageNo,at})}});
  $('searchResults').innerHTML=matches.slice(0,80).map(m=>`<button class="search-result" data-page="${m.pageNo}"><strong>${escapeHtml(sections[m.sectionNo]?.title||'Текст книги')}</strong><span>${escapeHtml(m.text.slice(Math.max(0,m.at-65),Math.min(m.text.length,m.at+query.length+100)))}</span></button>`).join('')||'<p style="font-size:12px;color:#777">Ничего не найдено.</p>';
  $('searchResults').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{pageIndex=Number(b.dataset.page);render();$('searchPanel').classList.remove('open')}));
}
function init(){
  makeSections();buildPages();
  $('sideTitle').textContent=BOOK.title;$('sideSubtitle').textContent=BOOK.subtitle;
  loadSettings();drawToc();
  const s=getSaved();if(Number.isInteger(s.pageIndex))pageIndex=Math.max(0,Math.min(pages.length-1,s.pageIndex));
  if(Number.isInteger(s.bookmark)){}render();
  $('prevBtn').addEventListener('click',()=>step(-1));$('nextBtn').addEventListener('click',()=>step(1));
  $('resumeBtn').addEventListener('click',()=>{const sv=getSaved();pageIndex=Number.isInteger(sv.pageIndex)?sv.pageIndex:0;render()});
  $('themeBtn').addEventListener('click',()=>{document.body.classList.toggle('dark');save()});
  $('searchBtn').addEventListener('click',()=>{toggle('searchPanel');$('searchInput').focus()});
  $('closeSearch').addEventListener('click',()=>toggle('searchPanel'));
  $('searchPanel').addEventListener('click',e=>{if(e.target===$('searchPanel'))toggle('searchPanel')});
  $('searchInput').addEventListener('input',e=>doSearch(e.target.value));
  $('settingsBtn').addEventListener('click',()=>toggle('settingsPanel'));$('closeSettings').addEventListener('click',()=>toggle('settingsPanel'));
  $('bookmarkBtn').addEventListener('click',()=>{const old=getSaved();const b=old.bookmark===pageIndex?null:pageIndex;try{localStorage.setItem(STORAGE,JSON.stringify({...old,pageIndex,current:currentSection(),bookmark:b,theme:document.body.classList.contains('dark'),font:$('fontRange').value,line:$('lineRange').value}))}catch(e){}updateProgress();showToast(b===null?'Закладка удалена':'Закладка сохранена')});
  $('fontRange').addEventListener('input',applyTypography);$('lineRange').addEventListener('input',applyTypography);
  $('resetSettings').addEventListener('click',()=>{$('fontRange').value=20;$('lineRange').value=18;applyTypography()});
  $('printBtn').addEventListener('click',()=>window.print());
  $('viewMode').addEventListener('change',render);
  $('tocBtn').addEventListener('click',()=>{const side=$('toc');const open=side.style.display==='block';side.style.display=open?'none':'block';if(!open){side.style.position='absolute';side.style.zIndex='15';side.style.top='58px';side.style.left='12px';side.style.right='12px';side.style.maxHeight='70vh';side.style.background='var(--paper)';side.style.padding='12px';side.style.border='1px solid var(--line)';side.style.borderRadius='12px';side.style.boxShadow='var(--shadow)'}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){ $('searchPanel').classList.remove('open');$('settingsPanel').classList.remove('open')}if(e.key==='ArrowRight'&&!$('searchPanel').classList.contains('open'))step(1);if(e.key==='ArrowLeft'&&!$('searchPanel').classList.contains('open'))step(-1);if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();$('searchPanel').classList.add('open');$('searchInput').focus()}});
  let startX=null;$('bookStage').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});$('bookStage').addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>50)step(dx<0?1:-1);startX=null},{passive:true});
  window.addEventListener('resize',()=>{if(window.innerWidth<=900)$('leftPage').style.display='none';else if($('viewMode').value!=='single')$('leftPage').style.display='block'});
  if('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
init();
})();
</script>
</body>
